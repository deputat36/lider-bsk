name: EtazhiSMSVizitka
options:
  bundleIdPrefix: ru.etagi.borisoglebsk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  EtazhiSMSVizitka:
    type: application
    platform: iOS
    sources:
      - SMSVizitka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.etagi.borisoglebsk.smscard.ios
        PRODUCT_NAME: "Этажи СМС Визитка"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: SMSVizitka/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: SMSVizitka/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Этажи • СМС Визитка"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
