name: Public services catalog CSS check

on:
  push:
    branches: [main]
    paths:
      - 'assets/packages-link.js'
      - 'assets/brand/**'
      - 'tools/test_public_homepage_browser.mjs'
      - 'uslugi.html'
      - 'assets/public-services.css'
      - 'tools/check_public_services_catalog_css.py'
      - 'docs/PUBLIC_SERVICES_CATALOG_CSS_MIGRATION_2026-07-13.md'
      - '.github/workflows/public-services-catalog-css-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/packages-link.js'
      - 'assets/brand/**'
      - 'tools/test_public_homepage_browser.mjs'
      - 'uslugi.html'
      - 'assets/public-services.css'
      - 'tools/check_public_services_catalog_css.py'
      - 'docs/PUBLIC_SERVICES_CATALOG_CSS_MIGRATION_2026-07-13.md'
      - '.github/workflows/public-services-catalog-css-check.yml'

jobs:
  validate-public-services-catalog-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate services catalog CSS migration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_public_services_catalog_css.py 2>&1 | tee public-services-catalog-css-report.txt

      - name: Upload services catalog CSS report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-services-catalog-css-report
          path: public-services-catalog-css-report.txt
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check services navigation and responsive layout
        run: node tools/test_public_homepage_browser.mjs --services
      - name: Upload services screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-services-browser
          path: artifacts/public-homepage/
          retention-days: 3
