name: CRM staging authenticated E2E diagnostic once

on:
  push:
    branches:
      - agent/487-authenticated-staging-e2e
    paths:
      - 'tools/run-crm-auth-e2e-diagnostic-once.txt'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: crm-staging-authenticated-e2e-diagnostic-once
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_SUPABASE_URL: https://otulfnouybahfnsycxqn.supabase.co
      STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iRCLPHgRaI5SNo9h4efMQw_W7Kdby1D
      BOOTSTRAP_URL: https://otulfnouybahfnsycxqn.supabase.co/functions/v1/leader-staging-authenticated-e2e-bootstrap
      OIDC_AUDIENCE: leader-staging-authenticated-e2e
      STAGING_CRM_E2E_CONFIRM: YES_CREATE_AND_DELETE_SYNTHETIC_STAGING_DATA
    steps:
      - uses: actions/checkout@v4

      - name: Pin browser Supabase dependency locally
        shell: bash
        run: |
          set -euo pipefail
          UMD_PATH="${RUNNER_TEMP}/supabase-js-2.112.2.umd.js"
          curl -fsSL --retry 3 --max-time 30 \
            'https://registry.npmjs.org/@supabase/supabase-js/-/supabase-js-2.112.2.tgz' \
            | tar -xzO package/dist/umd/supabase.js > "${UMD_PATH}"
          test "$(wc -c < "${UMD_PATH}")" -gt 100000
          echo "STAGING_CRM_E2E_SUPABASE_UMD=${UMD_PATH}" >> "${GITHUB_ENV}"

      - name: Prepare temporary staging Auth user and lead
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          OIDC_FILE="${RUNNER_TEMP}/diag-oidc.json"
          PREPARE_FILE="${RUNNER_TEMP}/diag-prepare.json"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" > "${OIDC_FILE}"
          OIDC_TOKEN="$(jq -er '.value' "${OIDC_FILE}")"
          rm -f "${OIDC_FILE}"
          HTTP_CODE="$(curl -sS -o "${PREPARE_FILE}" -w '%{http_code}' -X POST "${BOOTSTRAP_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data '{"action":"prepare"}')"
          unset OIDC_TOKEN
          test "${HTTP_CODE}" = '201'
          jq -e '.ok == true and .action == "prepare" and (.marker | test("^SYNTH-CRM-E2E-[A-Za-z0-9-]+$")) and .role == "manager"' "${PREPARE_FILE}" >/dev/null
          TEST_EMAIL="$(jq -er '.email' "${PREPARE_FILE}")"
          TEST_PASSWORD="$(jq -er '.password' "${PREPARE_FILE}")"
          TEST_MARKER="$(jq -er '.marker' "${PREPARE_FILE}")"
          TEST_LEAD_ID="$(jq -er '.lead_id' "${PREPARE_FILE}")"
          TEST_RUN_KEY="$(jq -er '.run_key' "${PREPARE_FILE}")"
          echo "::add-mask::${TEST_EMAIL}"
          echo "::add-mask::${TEST_PASSWORD}"
          echo "::add-mask::${TEST_MARKER}"
          echo "::add-mask::${TEST_LEAD_ID}"
          {
            echo "STAGING_CRM_E2E_EMAIL=${TEST_EMAIL}"
            echo "STAGING_CRM_E2E_PASSWORD=${TEST_PASSWORD}"
            echo "STAGING_CRM_E2E_MARKER=${TEST_MARKER}"
            echo "STAGING_CRM_E2E_LEAD_ID=${TEST_LEAD_ID}"
            echo "STAGING_CRM_E2E_RUN_KEY=${TEST_RUN_KEY}"
            echo "STAGING_CRM_E2E_EVIDENCE_PATH=${RUNNER_TEMP}/diag/browser.json"
          } >> "${GITHUB_ENV}"
          rm -f "${PREPARE_FILE}"

      - name: Run authenticated browser path and capture safe code
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/diag"
          node tools/run_crm_staging_authenticated_e2e.mjs --mode=run > "${RUNNER_TEMP}/diag/browser.log" 2>&1

      - name: Extract allowlisted diagnostic
        id: diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/diag/browser.log"
          CODE='authenticated_e2e_failed_without_safe_code'
          if [ -f "${LOG}" ]; then
            RAW="$(tail -n 30 "${LOG}" | jq -Rr 'fromjson? | .error? // empty' | tail -n 1 || true)"
            if [ -z "${RAW}" ]; then
              RAW="$(grep -Eo '(chrome_browser_scenario_timeout|chrome_browser_scenario_stalled|browser_e2e_failed|browser_process_failed):[^"[:space:]]+|browser_evidence_missing' "${LOG}" | tail -n 1 || true)"
            fi
            case "${RAW}" in
              chrome_browser_scenario_timeout:*|chrome_browser_scenario_stalled:*|browser_e2e_failed:*|browser_process_failed:*|browser_evidence_missing)
                CODE="$(printf '%s' "${RAW}" | python3 -c "import re,sys; s=sys.stdin.read(); sys.stdout.write(re.sub(r'[^A-Za-z0-9_:.=\\-]', '_', s)[:180])")"
                ;;
            esac
          fi
          if [ '${{ steps.browser.outcome }}' = 'success' ]; then CODE='authenticated_e2e_browser_passed'; fi
          echo "code=${CODE}" >> "${GITHUB_OUTPUT}"

      - name: Cleanup all synthetic data and Auth user
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_FILE="${RUNNER_TEMP}/diag-cleanup-oidc.json"
          CLEANUP_FILE="${RUNNER_TEMP}/diag-cleanup.json"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" > "${OIDC_FILE}"
          OIDC_TOKEN="$(jq -er '.value' "${OIDC_FILE}")"
          rm -f "${OIDC_FILE}"
          HTTP_CODE="$(curl -sS -o "${CLEANUP_FILE}" -w '%{http_code}' -X POST "${BOOTSTRAP_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data "{\"action\":\"cleanup\",\"run_key\":\"${STAGING_CRM_E2E_RUN_KEY}\",\"marker\":\"${STAGING_CRM_E2E_MARKER}\"}")"
          unset OIDC_TOKEN
          test "${HTTP_CODE}" = '200'
          jq -e '.ok == true and .auth_user_deleted == true and ([.residue[] | tonumber] | all(. == 0))' "${CLEANUP_FILE}" >/dev/null
          rm -f "${CLEANUP_FILE}"

      - name: Report privacy-safe diagnostic to issue 487
        if: always()
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_CODE: ${{ steps.diagnostic.outputs.code }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        with:
          script: |
            const code = String(process.env.DIAGNOSTIC_CODE || 'missing').replace(/[^A-Za-z0-9_:.\[\]=\"-]/g, '').slice(0, 180);
            const cleanup = process.env.CLEANUP_OUTCOME === 'success' ? 'PASS' : 'FAIL';
            const shortSha = context.sha.slice(0, 12);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 487,
              body: `Authenticated staging E2E diagnostic: \`${code}\`. Cleanup: **${cleanup}**. Head: \`${shortSha}\`. Только allowlisted stage/error code; credentials, marker и synthetic IDs не публикуются.`
            });

      - name: Enforce cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.cleanup.outcome }}' = 'success'