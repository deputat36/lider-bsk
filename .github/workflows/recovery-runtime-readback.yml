name: Recovery runtime readback
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recovery-runtime-readback-main
  cancel-in-progress: true
jobs:
  published-files:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages to publish this exact commit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          sha=os.environ['SOURCE_SHA']
          deadline=time.monotonic()+120
          last_status=None
          while time.monotonic()<deadline:
           pages_run=None
           for page in range(1,6):
            url='https://api.github.com/repos/deputat36/lider-bsk/actions/runs?head_sha='+sha+'&per_page=100&page='+str(page)
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','Cache-Control':'no-cache'})
            with urllib.request.urlopen(request,timeout=8) as response:data=json.load(response)
            pages_run=next((r for r in data['workflow_runs'] if r['name']=='pages build and deployment' and r['head_sha']==sha),None)
            if pages_run or page*100>=data['total_count']:break
           status=(pages_run or {}).get('status','not_registered')
           if status!=last_status:print('Pages for '+sha+': '+status,flush=True);last_status=status
           if status=='completed':
            assert pages_run['conclusion']=='success','Pages did not publish this source: '+str(pages_run['conclusion'])
            print('Pages publication confirmed for exact source SHA',flush=True)
            break
           time.sleep(min(5,max(0,deadline-time.monotonic())))
          else:raise AssertionError('Pages did not complete within 120 seconds; resume from its actual run state')
          
          PY
      - name: Compare 41 recovered public files without backend writes
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,time,pathlib,hashlib,urllib.request,urllib.error,concurrent.futures,datetime
          paths=["3d-modelirovanie-konstrukciy.html","3d-vizualizaciya-reklamy.html","ai-dlya-biznesa.html","animaciya-motion-dizayn.html","assets/public-creative-services.css","avtomatizaciya-biznesa.html","crm/v4/assets/v4/company-legal-settings-draft-v1.js","crm/v4/assets/v4/company-legal-settings-preview-v1.js","crm/v4/assets/v4/company-legal-settings-v1.js","crm/v4/assets/v4/crm-quick-start-v1.js","crm/v4/assets/v4/document-archive-transport-v1.js","crm/v4/assets/v4/document-archive-v1.js","crm/v4/assets/v4/finance-adjustment-transport-v1.js","crm/v4/assets/v4/finance-adjustment-ui-v1.js","crm/v4/assets/v4/finance-plan-actual-model-v1.js","crm/v4/assets/v4/finance-plan-actual-panel-v1.js","crm/v4/assets/v4/finance-record-transport-v1.js","crm/v4/assets/v4/finance-record-ui-v1.js","crm/v4/assets/v4/notifications-pwa-v1.js","crm/v4/assets/v4/offer-order-create-v1.js","crm/v4/assets/v4/order-act-preview-v1.js","crm/v4/assets/v4/order-card-v1.js","crm/v4/assets/v4/order-contract-model-v1.js","crm/v4/assets/v4/order-contract-preview-v1.js","crm/v4/assets/v4/quote-workspace-model-v1.js","crm/v4/assets/v4/quote-workspace-transport-v1.js","crm/v4/icons/icon192.png","crm/v4/icons/icon512.png","crm/v4/index.html","crm/v4/manifest.webmanifest","crm/v4/sw.js","dizayn-3d-animaciya.html","index.html","kartochki-tovarov-marketpleysy.html","nashi-raboty.html","podgotovka-maketov-k-pechati.html","prilozheniya-dlya-biznesa.html","promoakcii-borisoglebsk.html","promoutery-borisoglebsk.html","qr-katalogi-onlayn-zapis.html","sozdanie-saytov.html","suvenirnaya-produkciya.html"]
          root=pathlib.Path('.')
          report_path=pathlib.Path('artifacts/runtime-readback/report.json')
          report_path.parent.mkdir(parents=True,exist_ok=True)
          for round_no in range(1,4):
           def check(name):
            expected=hashlib.sha256((root/name).read_bytes()).hexdigest()
            url='https://www.lider-bsk.ru/'+name+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'-'+str(round_no)
            result={'file':name,'expected_sha256':expected}
            try:
             with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Leader-release-verification/1.0'}),timeout=12) as response:
              body=response.read(1048577);result['status']=response.status
             actual=hashlib.sha256(body).hexdigest()
             result.update(actual_sha256=actual,bytes=len(body),match=len(body)<=1048576 and expected==actual)
            except Exception as error:result.update(match=False,error=str(error)[:250])
            return result
           with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(check,paths))
           failed=[r for r in results if not r['match']]
           report={'source_sha':os.environ['SOURCE_SHA'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'round':round_no,'total':len(results),'matched':len(results)-len(failed),'files':results}
           report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2))
           print(json.dumps({'source_sha':report['source_sha'],'round':round_no,'total':len(results),'matched':report['matched'],'failures':failed[:3]},ensure_ascii=False),flush=True)
           if not failed:break
           if round_no<3:time.sleep(8)
          assert not failed,'Published runtime does not match checked-out source; inspect report.json'
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-runtime-readback
          path: artifacts/runtime-readback/report.json
          retention-days: 14
          if-no-files-found: error
