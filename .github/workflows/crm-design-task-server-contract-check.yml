name: CRM design task server contract check

on:
  push:
    branches: [main]
    paths:
      - 'contracts/design-task-create-from-order-v1.json'
      - 'contracts/design-task-database-rpc-candidate-v1.json'
      - 'contracts/crm-v4-backend-command-contract-v1.json'
      - 'docs/CRM_DESIGN_TASK_CREATE_FROM_ORDER_SERVER_CONTRACT_2026-07-13.md'
      - 'docs/CRM_DESIGN_TASK_DATABASE_RPC_CANDIDATE_SPEC_2026-07-13.md'
      - 'docs/CRM_V4_BACKEND_COMMAND_CONTRACT_2026-07-10.md'
      - 'tools/design-task-create-from-order-reference-v1.mjs'
      - 'tools/test_design_task_create_from_order_contract.mjs'
      - 'tools/check_design_task_create_from_order_contract.py'
      - 'tools/check_design_task_database_rpc_candidate.py'
      - 'tools/check_crm_v4_backend_command_contract.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/design-task-draft-model-v1.js'
      - 'supabase/functions/leader-crm-orders/index.ts'
      - '.github/workflows/crm-design-task-server-contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/design-task-create-from-order-v1.json'
      - 'contracts/design-task-database-rpc-candidate-v1.json'
      - 'contracts/crm-v4-backend-command-contract-v1.json'
      - 'docs/CRM_DESIGN_TASK_CREATE_FROM_ORDER_SERVER_CONTRACT_2026-07-13.md'
      - 'docs/CRM_DESIGN_TASK_DATABASE_RPC_CANDIDATE_SPEC_2026-07-13.md'
      - 'docs/CRM_V4_BACKEND_COMMAND_CONTRACT_2026-07-10.md'
      - 'tools/design-task-create-from-order-reference-v1.mjs'
      - 'tools/test_design_task_create_from_order_contract.mjs'
      - 'tools/check_design_task_create_from_order_contract.py'
      - 'tools/check_design_task_database_rpc_candidate.py'
      - 'tools/check_crm_v4_backend_command_contract.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/design-task-draft-model-v1.js'
      - 'supabase/functions/leader-crm-orders/index.ts'
      - '.github/workflows/crm-design-task-server-contract-check.yml'

jobs:
  validate-design-task-server-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate contract JSON
        run: |
          python3 -m json.tool contracts/design-task-create-from-order-v1.json >/dev/null
          python3 -m json.tool contracts/design-task-database-rpc-candidate-v1.json >/dev/null
          python3 -m json.tool contracts/crm-v4-backend-command-contract-v1.json >/dev/null

      - name: Validate JavaScript syntax
        run: |
          node --check tools/design-task-create-from-order-reference-v1.mjs
          node --check tools/test_design_task_create_from_order_contract.mjs
          node --check crm/v4/assets/v4/action-permissions-v1.js
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node --check crm/v4/assets/v4/design-task-draft-model-v1.js

      - name: Run server contract behavior test
        run: node tools/test_design_task_create_from_order_contract.mjs

      - name: Validate detailed design action contract
        run: python3 tools/check_design_task_create_from_order_contract.py

      - name: Validate database and RPC candidate
        shell: bash
        run: |
          set +e
          python3 tools/check_design_task_database_rpc_candidate.py > design-task-db-rpc-candidate-check.log 2>&1
          code=$?
          cat design-task-db-rpc-candidate-check.log
          exit $code

      - name: Upload candidate checker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-task-db-rpc-candidate-check-log
          path: design-task-db-rpc-candidate-check.log
          retention-days: 3

      - name: Validate general backend command registry
        run: python3 tools/check_crm_v4_backend_command_contract.py
