name: CRM leads orders staging transport check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/leader-crm-leads/index.ts'
      - 'supabase/staging-functions/leader-crm-leads-staging/index.ts'
      - 'supabase/staging-functions/leader-crm-leads-staging-impl/index.ts'
      - 'supabase/staging-functions/_shared/canonical-edge-wrapper-v1.js'
      - 'contracts/crm-leads-orders-staging-deployment-v1.json'
      - 'contracts/crm-staging-edge-action-gate-deployment-v1.json'
      - 'contracts/crm-staging-lead-workflow-command-v1.json'
      - 'tools/run_crm_leads_orders_staging_auth_e2e.mjs'
      - 'tools/check_crm_leads_orders_staging_deployment.py'
      - 'docs/SUPABASE_STAGING_CRM_LEADS_ORDERS_PROBE_2026-07-16.md'
      - '.github/workflows/crm-leads-orders-staging-transport-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/leader-crm-leads/index.ts'
      - 'supabase/staging-functions/leader-crm-leads-staging/index.ts'
      - 'supabase/staging-functions/leader-crm-leads-staging-impl/index.ts'
      - 'supabase/staging-functions/_shared/canonical-edge-wrapper-v1.js'
      - 'contracts/crm-leads-orders-staging-deployment-v1.json'
      - 'contracts/crm-staging-edge-action-gate-deployment-v1.json'
      - 'contracts/crm-staging-lead-workflow-command-v1.json'
      - 'tools/run_crm_leads_orders_staging_auth_e2e.mjs'
      - 'tools/check_crm_leads_orders_staging_deployment.py'
      - 'docs/SUPABASE_STAGING_CRM_LEADS_ORDERS_PROBE_2026-07-16.md'
      - '.github/workflows/crm-leads-orders-staging-transport-check.yml'

permissions:
  contents: read

jobs:
  validate-staging-leads-orders-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner syntax
        run: node --check tools/run_crm_leads_orders_staging_auth_e2e.mjs
      - name: Compile source checker
        run: python3 -m py_compile tools/check_crm_leads_orders_staging_deployment.py
      - name: Validate staging probe evidence and scope
        run: python3 tools/check_crm_leads_orders_staging_deployment.py
