name: CRM lead list filters check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/state.js'
      - 'crm/v4/assets/v4/styles.css'
      - 'crm/v4/assets/v4/lead-list-preferences-v1.js'
      - 'tools/test_lead_list_preferences.mjs'
      - 'tools/check_crm_lead_list_filters.py'
      - '.github/workflows/crm-lead-list-filters-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/state.js'
      - 'crm/v4/assets/v4/styles.css'
      - 'crm/v4/assets/v4/lead-list-preferences-v1.js'
      - 'tools/test_lead_list_preferences.mjs'
      - 'tools/check_crm_lead_list_filters.py'
      - '.github/workflows/crm-lead-list-filters-check.yml'

jobs:
  lead-list-filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser-only filter behavior
        run: |
          node --check crm/v4/assets/v4/lead-list-preferences-v1.js
          node --check crm/v4/assets/v4/leads.js
          node tools/test_lead_list_preferences.mjs
          python3 tools/check_crm_lead_list_filters.py
