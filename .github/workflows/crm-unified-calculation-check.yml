name: CRM unified calculation check
on:
  push:
    branches: [main]
    paths: ['crm/v4/index.html', 'crm/v4/assets/v4/calculations.js', 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js', 'crm/v4/assets/v4/calculation-pricing-model-v1.js', 'crm/v4/assets/v4/calculation-spec-model-v1.js', 'crm/v4/assets/v4/calculation-contractor-quote-model-v1.js', 'crm/v4/assets/v4/calculation-draft-review-model-v1.js', 'crm/v4/assets/v4/calculation-draft-review-v1.js', 'crm/v4/assets/v4/calculations-unified.css', 'tools/test_calculation_pricing_model.mjs', 'tools/test_calculation_spec_model.mjs', 'tools/test_calculation_contractor_quote_model_v1.mjs', 'tools/test_calculation_draft_review_model.mjs', 'tools/check_crm_unified_calculation.py', 'tools/check_calc_v2.py', 'tools/check_crm_single_tab_router.py', '.github/workflows/crm-unified-calculation-check.yml']
  pull_request:
    branches: [main]
    paths: ['crm/v4/index.html', 'crm/v4/assets/v4/calculations.js', 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js', 'crm/v4/assets/v4/calculation-pricing-model-v1.js', 'crm/v4/assets/v4/calculation-spec-model-v1.js', 'crm/v4/assets/v4/calculation-contractor-quote-model-v1.js', 'crm/v4/assets/v4/calculation-draft-review-model-v1.js', 'crm/v4/assets/v4/calculation-draft-review-v1.js', 'crm/v4/assets/v4/calculations-unified.css', 'tools/test_calculation_pricing_model.mjs', 'tools/test_calculation_spec_model.mjs', 'tools/test_calculation_contractor_quote_model_v1.mjs', 'tools/test_calculation_draft_review_model.mjs', 'tools/check_crm_unified_calculation.py', 'tools/check_calc_v2.py', 'tools/check_crm_single_tab_router.py', '.github/workflows/crm-unified-calculation-check.yml']
jobs:
  unified-calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unified calculation checks
        run: |
          node --check crm/v4/assets/v4/calculation-pricing-model-v1.js
          node --check crm/v4/assets/v4/calculation-spec-model-v1.js
          node --check crm/v4/assets/v4/calculation-contractor-quote-model-v1.js
          node --check crm/v4/assets/v4/calculation-draft-review-model-v1.js
          node --check crm/v4/assets/v4/calculation-draft-review-v1.js
          node --check crm/v4/assets/v4/calculations.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
          node tools/test_calculation_pricing_model.mjs
          node tools/test_calculation_spec_model.mjs
          node tools/test_calculation_contractor_quote_model_v1.mjs
          node tools/test_calculation_draft_review_model.mjs
          python3 tools/check_crm_unified_calculation.py
          python3 tools/check_calc_v2.py
          python3 tools/check_crm_single_tab_router.py
