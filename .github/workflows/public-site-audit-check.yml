  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'banner/index.html'
      - 'signs/index.html'
      - 'auto-stickers/index.html'
      - 'assets/public-lead-form.js'
      - 'assets/packages-link.js'
      - 'assets/public-lead-form.css'
      - 'assets/public-landing.css'
      - 'assets/public-homepage.css'
      - 'assets/public-lead-reference-v1.js'
      - 'docs/PUBLIC_LANDING_CSS_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_FIRST_PAGE_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_PECHAT_BANNEROV_PATCH_NOTES.md'
      - 'docs/PUBLIC_LANDING_WINDOW_STICKERS_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_WORKING_HOURS_MIGRATION.md'
      - 'docs/PUBLIC_HOMEPAGE_SOURCE_COPY_2026-07-12.md'
      - 'docs/PUBLIC_HOMEPAGE_CSS_MIGRATION_2026-07-12.md'
      - 'tools/check_public_vizitki_service.py'
      - 'tools/check_vizitki_page_local_service.py'
      - 'tools/check_public_poligrafiya_service.py'
      - 'tools/check_public_poligrafiya_catalog.py'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - 'tools/check_public_legacy_redirects.py'
      - 'tools/check_public_landing_css.py'
      - 'tools/check_public_landing_first_page_migration.py'
      - 'tools/check_public_window_stickers_migration.py'
      - 'tools/check_public_working_hours_migration.py'
      - 'tools/check_public_homepage_helper.py'
      - 'tools/check_public_homepage_source_copy.py'
      - 'tools/check_public_homepage_css_migration.py'
      - 'tools/check_public_ci_workflows.py'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/public-site-audit-check.yml'
      - '.github/workflows/public-homepage-source-copy-check.yml'
      - '.github/workflows/public-homepage-css-migration-check.yml'
      - '.github/workflows/public-legacy-url-check.yml'
      - '.github/workflows/public-no-secret-markers-check.yml'
      - '.github/workflows/public-window-stickers-migration-check.yml'
      - '.github/workflows/public-working-hours-migration-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'banner/index.html'
      - 'signs/index.html'
      - 'auto-stickers/index.html'
      - 'assets/public-lead-form.js'
      - 'assets/packages-link.js'
      - 'assets/public-lead-form.css'
      - 'assets/public-landing.css'
      - 'assets/public-homepage.css'
      - 'assets/public-lead-reference-v1.js'
      - 'docs/PUBLIC_LANDING_CSS_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_FIRST_PAGE_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_PECHAT_BANNEROV_PATCH_NOTES.md'
      - 'docs/PUBLIC_LANDING_WINDOW_STICKERS_MIGRATION.md'
      - 'docs/PUBLIC_LANDING_WORKING_HOURS_MIGRATION.md'
      - 'docs/PUBLIC_HOMEPAGE_SOURCE_COPY_2026-07-12.md'
      - 'docs/PUBLIC_HOMEPAGE_CSS_MIGRATION_2026-07-12.md'
      - 'tools/check_public_vizitki_service.py'
      - 'tools/check_vizitki_page_local_service.py'
      - 'tools/check_public_poligrafiya_service.py'
      - 'tools/check_public_poligrafiya_catalog.py'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - 'tools/check_public_legacy_redirects.py'
      - 'tools/check_public_landing_css.py'
      - 'tools/check_public_landing_first_page_migration.py'
      - 'tools/check_public_window_stickers_migration.py'
      - 'tools/check_public_working_hours_migration.py'
      - 'tools/check_public_homepage_helper.py'
      - 'tools/check_public_homepage_source_copy.py'
      - 'tools/check_public_homepage_css_migration.py'
      - 'tools/check_public_ci_workflows.py'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/public-site-audit-check.yml'
      - '.github/workflows/public-homepage-source-copy-check.yml'
      - '.github/workflows/public-homepage-css-migration-check.yml'
      - '.github/workflows/public-legacy-url-check.yml'
      - '.github/workflows/public-no-secret-markers-check.yml'
      - '.github/workflows/public-window-stickers-migration-check.yml'
      - '.github/workflows/public-working-hours-migration-check.yml'

jobs:
  public-site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate robots and sitemap basics
        shell: bash
        run: |
          set -euo pipefail
          test -f robots.txt
          test -f sitemap.xml
          grep -Fq 'User-agent: *' robots.txt
          grep -Fq 'Disallow: /crm/' robots.txt
          grep -Fq 'Disallow: /nav/' robots.txt
          grep -Fq 'Disallow: /nav-v2/' robots.txt
          grep -Fq 'Disallow: /nav_v2/' robots.txt
          grep -Fq 'Allow: /' robots.txt
          grep -Fq 'Host: https://www.lider-bsk.ru' robots.txt
          grep -Fq 'Sitemap: https://www.lider-bsk.ru/sitemap.xml' robots.txt
          grep -Fq '<urlset' sitemap.xml
          grep -Fq 'https://www.lider-bsk.ru/' sitemap.xml
          if grep -Fq '/crm/' sitemap.xml || grep -Fq 'nav_' sitemap.xml; then
            echo 'sitemap.xml must not include CRM/nav contour.' >&2
            exit 1
          fi

      - name: Validate public lead form contract
        shell: bash
        run: |
          set -euo pipefail
          form='assets/public-lead-form.js'
          css='assets/public-lead-form.css'
          helper='assets/public-lead-reference-v1.js'
          request='request.html'
          test -f "$form"
          test -f "$css"
          test -f "$helper"
          test -f "$request"
          grep -Fq 'ofewxuqfjhamgerwzull.supabase.co/functions/v1/leader-public-lead' "$form"
          grep -Fq 'leader-public-lead' "$form"
          if grep -Fq 'parket-public-lead' "$form" || grep -Fq 'broker-public-lead' "$form" || grep -Fq 'nav-v2-deal-api' "$form"; then
            echo 'Public RA Lider form must not point to another contour function.' >&2
            exit 1
          fi
          grep -Fq 'METRIKA_ID=109387236' "$form"
          grep -Fq 'request_id' "$form"
          grep -Fq 'responseRequestId' "$form"
          grep -Fq 'form.dataset.lastRequestId=responseRequestId' "$form"
          grep -Fq 'Номер обращения: ' "$form"
          grep -Fq "website:field(form,'website')" "$form"
          grep -Fq 'page_path' "$form"
          grep -Fq 'submitted_at' "$form"
          grep -Fq "goal('lead_sent',{service,page:location.href,page_path:location.pathname,request_id:responseRequestId,duplicate})" "$form"
          grep -Fq 'leader-lead-hp' "$css"
          grep -Fq 'overflow-x:hidden' "$css"
          grep -Fq '@media(max-width:1180px) and (min-width:1025px)' "$css"
          grep -Fq 'leader-public-header-wrap-v5' "$css"
          grep -Fq '@media(max-width:1240px) and (min-width:1025px)' "$css"
          grep -Fq 'flex-wrap:wrap!important' "$css"
          grep -Fq 'order:3!important' "$css"
          grep -Fq 'width:100%!important' "$css"
          grep -Fq 'white-space:nowrap!important' "$css"
          grep -Fq 'params.request_id' "$helper"
          grep -Fq 'Номер обращения:' "$helper"
          grep -Fq '20260628-clarity-2' "$request"
          grep -Fq 'Что будет дальше' "$request"
          grep -Fq 'Выберите похожую задачу' "$request"
          grep -Fq 'data-scenario="shop"' "$request"
          grep -Fq 'data-scenario="cafe"' "$request"
          grep -Fq 'data-scenario="service"' "$request"
          grep -Fq 'data-scenario="beauty"' "$request"
          grep -Fq 'data-scenario="construction"' "$request"
          grep -Fq 'data-scenario="office"' "$request"
          grep -Fq 'Перед отправкой' "$request"
          grep -Fq 'После отправки' "$request"
          grep -Fq 'Номер обращения' "$request"
          if grep -Fq "if(field(form,'website'))return" "$form"; then
            echo 'Client-side honeypot must not bypass server audit.' >&2
            exit 1
          fi

      - name: Validate request page script order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page = Path('request.html').read_text(encoding='utf-8')
          helper = 'assets/public-lead-reference-v1.js?v=1'
          form = 'assets/public-lead-form.js?v=4'
          assert page.count(helper) == 1
          assert page.count(form) == 1
          assert page.index(helper) < page.index(form)
          PY

      - name: Check vizitki service contract
        run: python3 tools/check_public_vizitki_service.py

      - name: Check vizitki local service contract
        run: python3 tools/check_vizitki_page_local_service.py

      - name: Check poligrafiya service contract
        run: python3 tools/check_public_poligrafiya_service.py

      - name: Check poligrafiya catalog contract
        run: python3 tools/check_public_poligrafiya_catalog.py

      - name: Check public lead v5 coverage
        run: python3 tools/check_public_lead_form_cache_v5_partial.py

      - name: Check public v5 SEO contract
        run: python3 tools/check_public_v5_landing_seo_contract.py

      - name: Check legacy redirects
        run: python3 tools/check_public_legacy_redirects.py

      - name: Check shared landing CSS
        run: python3 tools/check_public_landing_css.py

      - name: Check first landing migration contract
        run: python3 tools/check_public_landing_first_page_migration.py

      - name: Check window stickers migration contract
        run: python3 tools/check_public_window_stickers_migration.py

      - name: Check working hours migration contract
        run: python3 tools/check_public_working_hours_migration.py

      - name: Check homepage helper contract
        run: python3 tools/check_public_homepage_helper.py

      - name: Check homepage source copy contract
        run: python3 tools/check_public_homepage_source_copy.py

      - name: Check homepage CSS migration contract
        run: python3 tools/check_public_homepage_css_migration.py

      - name: Check public CI workflow contracts
        run: python3 tools/check_public_ci_workflows.py

      - name: Check public scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/public-lead-form.js
          node --check assets/packages-link.js
