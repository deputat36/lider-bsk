name: CRM staging lead workflow command check

on:
  pull_request:
    paths:
      - 'supabase/staging-migrations/20260723_01_lead_workflow_update_rpc.sql'
      - 'supabase/staging-tests/20260723_lead_workflow_update_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-leads-staging/**'
      - 'supabase/staging-functions/_shared/canonical-edge-wrapper-v1.js'
      - 'supabase/staging-functions/_shared/crm-canonical-action-map-v1.js'
      - 'supabase/staging-functions/leader-crm-leads-staging-impl/**'
      - 'contracts/crm-staging-lead-workflow-command-v1.json'
      - 'contracts/crm-staging-edge-action-gate-deployment-v1.json'
      - 'docs/SUPABASE_STAGING_LEAD_WORKFLOW_COMMAND_V1_2026-07-23.md'
      - 'tools/check_crm_staging_lead_workflow_command.py'
      - '.github/workflows/crm-staging-lead-workflow-command-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/staging-migrations/20260723_01_lead_workflow_update_rpc.sql'
      - 'supabase/staging-tests/20260723_lead_workflow_update_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-leads-staging/**'
      - 'supabase/staging-functions/_shared/canonical-edge-wrapper-v1.js'
      - 'supabase/staging-functions/_shared/crm-canonical-action-map-v1.js'
      - 'supabase/staging-functions/leader-crm-leads-staging-impl/**'
      - 'contracts/crm-staging-lead-workflow-command-v1.json'
      - 'contracts/crm-staging-edge-action-gate-deployment-v1.json'
      - 'docs/SUPABASE_STAGING_LEAD_WORKFLOW_COMMAND_V1_2026-07-23.md'
      - 'tools/check_crm_staging_lead_workflow_command.py'
      - '.github/workflows/crm-staging-lead-workflow-command-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check staging leads Edge v4
        run: deno check supabase/staging-functions/leader-crm-leads-staging/index.ts
      - name: Compile checker
        run: python3 -m py_compile tools/check_crm_staging_lead_workflow_command.py
      - name: Validate atomic lead workflow contract
        shell: bash
        run: |
          set +e
          python3 tools/check_crm_staging_lead_workflow_command.py > lead-workflow-check.log 2>&1
          status=$?
          cat lead-workflow-check.log
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-workflow-check-diagnostics
          path: lead-workflow-check.log
          if-no-files-found: error
          retention-days: 7
