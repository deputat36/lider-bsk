name: Public related form cache v28 check

on:
  push:
    branches: [main]
    paths:
      - 'banner-dlya-magazina-borisoglebsk.html'
      - 'oformlenie-vhoda-borisoglebsk.html'
      - 'nakleyki-na-vitrinu-borisoglebsk.html'
      - 'rezhim-raboty-tablichki-borisoglebsk.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'reklama-otkrytiya-magazina-borisoglebsk.html'
      - 'assets/public-lead-form.js'
      - 'sitemap.xml'
      - 'tools/check_public_related_form_cache_v28.py'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - 'tools/check_public_banner_store_migration.py'
      - 'tools/check_public_entrance_migration.py'
      - 'tools/check_public_window_stickers_migration.py'
      - 'tools/check_public_working_hours_migration.py'
      - 'tools/check_public_simple_service_css.py'
      - 'tools/check_public_campaign_landing_css.py'
      - 'tools/check_public_poligrafiya_service.py'
      - 'docs/PUBLIC_RELATED_FORM_CACHE_V28_2026-07-18.md'
      - '.github/workflows/public-related-form-cache-v28-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'banner-dlya-magazina-borisoglebsk.html'
      - 'oformlenie-vhoda-borisoglebsk.html'
      - 'nakleyki-na-vitrinu-borisoglebsk.html'
      - 'rezhim-raboty-tablichki-borisoglebsk.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'reklama-otkrytiya-magazina-borisoglebsk.html'
      - 'assets/public-lead-form.js'
      - 'sitemap.xml'
      - 'tools/check_public_related_form_cache_v28.py'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - 'tools/check_public_banner_store_migration.py'
      - 'tools/check_public_entrance_migration.py'
      - 'tools/check_public_window_stickers_migration.py'
      - 'tools/check_public_working_hours_migration.py'
      - 'tools/check_public_simple_service_css.py'
      - 'tools/check_public_campaign_landing_css.py'
      - 'tools/check_public_poligrafiya_service.py'
      - 'docs/PUBLIC_RELATED_FORM_CACHE_V28_2026-07-18.md'
      - '.github/workflows/public-related-form-cache-v28-check.yml'

jobs:
  validate-related-form-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate related commercial form cache and existing page contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_related_form_cache_v28.py
          python3 tools/check_all_public_form_cache_versions.py
          python3 tools/check_public_lead_form_cache_v5_partial.py
          python3 tools/check_public_v5_landing_seo_contract.py
          python3 tools/check_public_banner_store_migration.py
          python3 tools/check_public_entrance_migration.py
          python3 tools/check_public_window_stickers_migration.py
          python3 tools/check_public_working_hours_migration.py
          python3 tools/check_public_simple_service_css.py
          python3 tools/check_public_campaign_landing_css.py
          python3 tools/check_public_poligrafiya_service.py
          git diff --check
