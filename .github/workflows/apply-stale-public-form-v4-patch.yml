name: Apply stale public form v4 patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_stale_public_form_v4_patch.py'
      - '.github/workflows/apply-stale-public-form-v4-patch.yml'

permissions:
  contents: write

concurrency:
  group: stale-public-form-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-stale-pages:
    if: github.head_ref == 'fix/public-request-css-v5-2026-07-12'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/public-request-css-v5-2026-07-12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-request-css-v5-2026-07-12
          fetch-depth: 0

      - name: Update four stale form cache markers
        run: python3 tools/apply_stale_public_form_v4_patch.py

      - name: Validate all public form cache versions
        run: python3 tools/check_all_public_form_cache_versions.py

      - name: Commit HTML cache updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            nakleyki-plotternaya-rezka-borisoglebsk.html \
            socseti-kontent.html \
            tablichki-borisoglebsk.html \
            yandex-karty-2gis.html
          git commit -m 'Update remaining public form cache markers to v5'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
