name: Public evidence intake check

on:
  push:
    branches: [main]
    paths:
      - 'docs/PUBLIC_PORTFOLIO_MATERIALS_INTAKE_2026-07-13.md'
      - 'docs/PUBLIC_NAP_CONFIRMATION_FORM_2026-07-13.md'
      - 'tools/check_public_evidence_intake.py'
      - '.github/workflows/public-evidence-intake-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/PUBLIC_PORTFOLIO_MATERIALS_INTAKE_2026-07-13.md'
      - 'docs/PUBLIC_NAP_CONFIRMATION_FORM_2026-07-13.md'
      - 'tools/check_public_evidence_intake.py'
      - '.github/workflows/public-evidence-intake-check.yml'

jobs:
  validate-public-evidence-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio and NAP intake contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_evidence_intake.py
