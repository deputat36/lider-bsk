name: CRM lead exception assistant check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/lead-exception-scenarios-v1.js'
      - 'crm/v4/assets/v4/lead-exception-assistant-v1.js'
      - 'crm/v4/assets/v4/lead-timeline.js'
      - 'tools/test_lead_exception_scenarios.mjs'
      - 'tools/check_crm_lead_exception_assistant.py'
      - 'docs/CRM_LEAD_EXCEPTION_ASSISTANT_MANUAL_TEST_2026-07-20.md'
      - '.github/workflows/crm-lead-exception-assistant-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/lead-exception-scenarios-v1.js'
      - 'crm/v4/assets/v4/lead-exception-assistant-v1.js'
      - 'crm/v4/assets/v4/lead-timeline.js'
      - 'tools/test_lead_exception_scenarios.mjs'
      - 'tools/check_crm_lead_exception_assistant.py'
      - 'docs/CRM_LEAD_EXCEPTION_ASSISTANT_MANUAL_TEST_2026-07-20.md'
      - '.github/workflows/crm-lead-exception-assistant-check.yml'

jobs:
  lead-exception-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lead exception assistant
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/lead-exception-scenarios-v1.js
          node --check crm/v4/assets/v4/lead-exception-assistant-v1.js
          node --check crm/v4/assets/v4/lead-timeline.js
          node --check tools/test_lead_exception_scenarios.mjs
          node tools/test_lead_exception_scenarios.mjs
          python3 tools/check_crm_lead_exception_assistant.py
