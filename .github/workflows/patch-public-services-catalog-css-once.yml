name: Patch public services catalog CSS once

on:
  pull_request:
    branches: [main]
    paths:
      - 'uslugi.html'
      - 'assets/public-services.css'
      - 'tools/patch_public_services_catalog_css_once.py'
      - 'tools/check_public_services_catalog_css.py'
      - '.github/workflows/patch-public-services-catalog-css-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'public/services-catalog-css-2026-07-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded services catalog CSS migration
        run: python3 tools/patch_public_services_catalog_css_once.py

      - name: Validate services catalog migration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_public_services_catalog_css.py 2>&1 | tee patch-public-services-catalog-css-report.txt

      - name: Upload guarded migration report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-public-services-catalog-css-report
          path: patch-public-services-catalog-css-report.txt
          if-no-files-found: error

      - name: Validate public SEO, DOM and resources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_html_seo_baseline.py
          python3 tools/check_public_dom_integrity.py
          python3 tools/check_public_local_resources.py

      - name: Commit migrated page and stylesheet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uslugi.html assets/public-services.css; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi.html assets/public-services.css
          git commit -m 'Move services catalog CSS to a cacheable asset'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
