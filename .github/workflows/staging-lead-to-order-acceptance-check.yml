name: Staging lead-to-order acceptance contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260626_06_leader_order_from_offer_rpc.sql'
      - 'supabase/staging-migrations/20260730_00_lead_to_order_status_history_compat.sql'
      - 'supabase/staging-migrations/20260730_01_lead_to_order_acceptance_compat.sql'
      - 'supabase/staging-tests/20260730_lead_to_order_schema_preflight.sql'
      - 'supabase/staging-tests/20260730_lead_to_order_acceptance.sql'
      - 'tools/check_staging_lead_to_order_acceptance.py'
      - '.github/workflows/staging-lead-to-order-acceptance-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260626_06_leader_order_from_offer_rpc.sql'
      - 'supabase/staging-migrations/20260730_00_lead_to_order_status_history_compat.sql'
      - 'supabase/staging-migrations/20260730_01_lead_to_order_acceptance_compat.sql'
      - 'supabase/staging-tests/20260730_lead_to_order_schema_preflight.sql'
      - 'supabase/staging-tests/20260730_lead_to_order_acceptance.sql'
      - 'tools/check_staging_lead_to_order_acceptance.py'
      - '.github/workflows/staging-lead-to-order-acceptance-check.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_staging_lead_to_order_acceptance.py
