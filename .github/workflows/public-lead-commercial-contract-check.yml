name: Public lead commercial contract check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/leader-service-catalog.js'
      - 'assets/public-commercial-services.css'
      - 'data/commercial-services.json'
      - 'tools/test_commercial_service_contract.mjs'
      - 'tools/build_commercial_service_pages.py'
      - 'assets/public-lead-form.js'
      - 'assets/public-lead-form.css'
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'docs/PUBLIC_SITE_COMMERCIAL_AUDIT_2026-07-12.md'
      - 'tools/check_public_lead_commercial_contract.py'
      - 'tools/test_public_lead_submission.mjs'
      - 'tools/test_public_lead_browser.mjs'
      - '.github/workflows/public-lead-commercial-contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/leader-service-catalog.js'
      - 'assets/public-commercial-services.css'
      - 'data/commercial-services.json'
      - 'tools/test_commercial_service_contract.mjs'
      - 'tools/build_commercial_service_pages.py'
      - 'assets/public-lead-form.js'
      - 'assets/public-lead-form.css'
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'docs/PUBLIC_SITE_COMMERCIAL_AUDIT_2026-07-12.md'
      - 'tools/check_public_lead_commercial_contract.py'
      - 'tools/test_public_lead_submission.mjs'
      - 'tools/test_public_lead_browser.mjs'
      - '.github/workflows/public-lead-commercial-contract-check.yml'

jobs:
  validate-public-lead-commercial-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate attribution, consent and accessibility markers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_lead_commercial_contract.py
          node tools/test_public_lead_submission.mjs
          node tools/test_commercial_service_contract.mjs
          python3 tools/build_commercial_service_pages.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile submission without production writes
        run: node tools/test_public_lead_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-lead-submission-browser
          path: artifacts/public-lead/
          retention-days: 7
