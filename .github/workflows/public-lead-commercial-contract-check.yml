name: Public lead commercial contract check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/leader-service-catalog.js'
      - 'assets/public-commercial-services.css'
      - 'data/commercial-services.json'
      - 'data/service-explainers.json'
      - 'data/service-use-cases.json'
      - 'data/service-illustration-provenance.json'
      - 'assets/service-illustrations/**'
      - 'assets/public-service-explainers.css'
      - 'tools/service_explainers.py'
      - 'tools/build_service_explainers.py'
      - 'tools/test_public_service_explainers_browser.mjs'
      - 'sitemap.xml'
      - 'tools/check_all_public_form_cache_versions.py'
      - 'tools/test_commercial_service_contract.mjs'
      - 'tools/build_commercial_service_pages.py'
      - 'assets/public-lead-form.js'
      - 'assets/public-lead-form.css'
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'docs/PUBLIC_SITE_COMMERCIAL_AUDIT_2026-07-12.md'
      - 'tools/check_public_lead_commercial_contract.py'
      - 'tools/test_public_lead_submission.mjs'
      - 'tools/test_public_lead_browser.mjs'
      - 'tools/test_creative_need_draft.mjs'
      - 'tools/build_creative_service_hub.py'
      - 'docs/PUBLIC_PORTFOLIO_MANIFEST_V1.json'
      - 'assets/portfolio/**'
      - 'assets/public-creative-services.css'
      - 'crm/v4/assets/v4/creative-need-draft-v1.js'
      - 'crm/v4/assets/v4/needs.js'
      - '.github/workflows/public-lead-commercial-contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/leader-service-catalog.js'
      - 'assets/public-commercial-services.css'
      - 'data/commercial-services.json'
      - 'data/service-explainers.json'
      - 'data/service-use-cases.json'
      - 'data/service-illustration-provenance.json'
      - 'assets/service-illustrations/**'
      - 'assets/public-service-explainers.css'
      - 'tools/service_explainers.py'
      - 'tools/build_service_explainers.py'
      - 'tools/test_public_service_explainers_browser.mjs'
      - 'sitemap.xml'
      - 'tools/check_all_public_form_cache_versions.py'
      - 'tools/test_commercial_service_contract.mjs'
      - 'tools/build_commercial_service_pages.py'
      - 'assets/public-lead-form.js'
      - 'assets/public-lead-form.css'
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'docs/PUBLIC_SITE_COMMERCIAL_AUDIT_2026-07-12.md'
      - 'tools/check_public_lead_commercial_contract.py'
      - 'tools/test_public_lead_submission.mjs'
      - 'tools/test_public_lead_browser.mjs'
      - 'tools/test_creative_need_draft.mjs'
      - 'tools/build_creative_service_hub.py'
      - 'docs/PUBLIC_PORTFOLIO_MANIFEST_V1.json'
      - 'assets/portfolio/**'
      - 'assets/public-creative-services.css'
      - 'crm/v4/assets/v4/creative-need-draft-v1.js'
      - 'crm/v4/assets/v4/needs.js'
      - '.github/workflows/public-lead-commercial-contract-check.yml'

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-lead-commercial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate attribution, consent and accessibility markers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_lead_commercial_contract.py
          python3 tools/check_all_public_form_cache_versions.py
          node tools/test_public_lead_submission.mjs
          node tools/test_commercial_service_contract.mjs
          node tools/test_creative_need_draft.mjs
          python3 tools/build_commercial_service_pages.py --check
          python3 tools/build_service_explainers.py --check
          python3 tools/build_creative_service_hub.py --check
          python3 tools/check_public_portfolio_manifest.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Verify desktop and mobile submission without production writes
        run: node tools/test_public_lead_browser.mjs
      - name: Verify illustrations, service selection and Metrika events with external HTTP blocked
        run: node tools/test_public_service_explainers_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-lead-submission-browser
          path: artifacts/public-lead/
          retention-days: 7
