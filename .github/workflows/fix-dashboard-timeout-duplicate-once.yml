name: Fix dashboard timeout duplicate once

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/fix_dashboard_timeout_duplicate_once.py'
      - 'tools/run-fix-dashboard-timeout-duplicate-once.txt'
      - '.github/workflows/fix-dashboard-timeout-duplicate-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-dashboard-timeout-duplicate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove duplicate and validate syntax
        run: |
          set -euo pipefail
          python3 tools/fix_dashboard_timeout_duplicate_once.py
          node --check crm/v4/assets/v4/management-dashboard-v3.js
      - name: Commit fixed source
        run: |
          set -euo pipefail
          if git diff --quiet -- crm/v4/assets/v4/management-dashboard-v3.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/management-dashboard-v3.js
          git commit -m 'Убрать дублирующую константу таймаута дашборда'
          git push origin HEAD:${{ github.head_ref }}
