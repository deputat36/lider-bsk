name: Public pechat bannerov migration check

on:
  push:
    branches: [main]
    paths:
      - 'pechat-bannerov-borisoglebsk.html'
      - 'assets/public-landing.css'
      - 'tools/check_public_pechat_bannerov_migration.py'
      - '.github/workflows/public-pechat-bannerov-migration-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pechat-bannerov-borisoglebsk.html'
      - 'assets/public-landing.css'
      - 'tools/check_public_pechat_bannerov_migration.py'
      - '.github/workflows/public-pechat-bannerov-migration-check.yml'

jobs:
  validate-pechat-bannerov-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared CSS, form version and local links
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_pechat_bannerov_migration.py
