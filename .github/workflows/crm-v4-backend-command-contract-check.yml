name: CRM v4 backend command contract check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/crm-v4-backend-command-contract-v1.json'
      - 'docs/CRM_V4_BACKEND_COMMAND_CONTRACT_2026-07-10.md'
      - 'docs/CRM_BACKEND_COMMAND_CONTRACT_EXECUTION_ADDENDUM_2026-07-10.md'
      - 'tools/check_crm_v4_backend_command_contract.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - '.github/workflows/crm-v4-backend-command-contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/crm-v4-backend-command-contract-v1.json'
      - 'docs/CRM_V4_BACKEND_COMMAND_CONTRACT_2026-07-10.md'
      - 'docs/CRM_BACKEND_COMMAND_CONTRACT_EXECUTION_ADDENDUM_2026-07-10.md'
      - 'tools/check_crm_v4_backend_command_contract.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - '.github/workflows/crm-v4-backend-command-contract-check.yml'

jobs:
  validate-backend-command-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate command contract and canonical registries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool contracts/crm-v4-backend-command-contract-v1.json >/dev/null
          python3 tools/check_crm_v4_backend_command_contract.py
          node --check crm/v4/assets/v4/action-permissions-v1.js
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node tools/test_crm_status_transitions.mjs
