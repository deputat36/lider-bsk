name: Public cache docs current check

on:
  push:
    branches: [main]
    paths:
      - 'docs/PUBLIC_LEAD_FORM_CACHE_BUST_2026-07-01.md'
      - 'docs/PUBLIC_LEAD_FORM_CACHE_V5_COVERAGE_2026-07-10.md'
      - 'tools/check_all_public_form_cache_versions.py'
      - 'tools/check_public_cache_docs_current.py'
      - '.github/workflows/public-cache-docs-current-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/PUBLIC_LEAD_FORM_CACHE_BUST_2026-07-01.md'
      - 'docs/PUBLIC_LEAD_FORM_CACHE_V5_COVERAGE_2026-07-10.md'
      - 'tools/check_all_public_form_cache_versions.py'
      - 'tools/check_public_cache_docs_current.py'
      - '.github/workflows/public-cache-docs-current-check.yml'

jobs:
  validate-current-cache-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed migration status and all-pages contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_cache_docs_current.py
          python3 tools/check_all_public_form_cache_versions.py
