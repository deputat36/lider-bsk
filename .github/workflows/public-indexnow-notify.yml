name: Public IndexNow notify

on:
  pull_request:
    branches: [main]
    paths:
      - '93997a8ea7f1013d09703e47ac5ece584a3b0fcaf26738f8.txt'
      - 'uslugi.html'
      - 'dizayn-3d-animaciya.html'
      - 'dizayn-maketov.html'
      - 'tablichki-borisoglebsk.html'
      - 'nakleyki-plotternaya-rezka-borisoglebsk.html'
      - '3d-modelirovanie-konstrukciy.html'
      - '3d-vizualizaciya-reklamy.html'
      - 'animaciya-motion-dizayn.html'
      - 'podgotovka-maketov-k-pechati.html'
      - 'nashi-raboty.html'
      - 'sitemap.xml'
      - 'tools/public-indexnow-urls.txt'
      - 'tools/public_indexnow.py'
      - 'tools/check_public_indexnow.py'
      - 'tools/test_public_indexnow.py'
      - 'docs/PUBLIC_CREATIVE_INDEXING_2026-10-11.md'
      - '.github/workflows/public-indexnow-notify.yml'
  push:
    branches: [main]
    paths:
      - '93997a8ea7f1013d09703e47ac5ece584a3b0fcaf26738f8.txt'
      - 'uslugi.html'
      - 'dizayn-3d-animaciya.html'
      - 'dizayn-maketov.html'
      - 'tablichki-borisoglebsk.html'
      - 'nakleyki-plotternaya-rezka-borisoglebsk.html'
      - '3d-modelirovanie-konstrukciy.html'
      - '3d-vizualizaciya-reklamy.html'
      - 'animaciya-motion-dizayn.html'
      - 'podgotovka-maketov-k-pechati.html'
      - 'nashi-raboty.html'
      - 'sitemap.xml'
      - 'tools/public-indexnow-urls.txt'
      - 'tools/public_indexnow.py'
      - 'tools/check_public_indexnow.py'
      - 'tools/test_public_indexnow.py'
      - 'docs/PUBLIC_CREATIVE_INDEXING_2026-10-11.md'
      - '.github/workflows/public-indexnow-notify.yml'

permissions:
  contents: read

jobs:
  validate-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate IndexNow key, URL scope and dry payload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_indexnow.py
          python3 tools/test_public_indexnow.py
          git diff --check

  notify-indexnow:
    if: github.event_name == 'push'
    needs: validate-indexnow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify IndexNow about the reviewed service URLs
        run: python3 tools/public_indexnow.py --submit
