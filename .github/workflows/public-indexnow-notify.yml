name: Public IndexNow notify

on:
  pull_request:
    branches: [main]
    paths:
      - '93997a8ea7f1013d09703e47ac5ece584a3b0fcaf26738f8.txt'
      - 'index.html'
      - 'uslugi.html'
      - 'vyveski-borisoglebsk.html'
      - 'remont-vyvesok.html'
      - 'vyveski-na-russkom.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'prices.html'
      - 'primery-rabot-kejsy.html'
      - 'sitemap.xml'
      - 'tools/public-indexnow-urls.txt'
      - 'tools/public_indexnow.py'
      - 'tools/check_public_indexnow.py'
      - 'tools/test_public_indexnow.py'
      - '.github/workflows/public-indexnow-notify.yml'
  push:
    branches: [main]
    paths:
      - '93997a8ea7f1013d09703e47ac5ece584a3b0fcaf26738f8.txt'
      - 'index.html'
      - 'uslugi.html'
      - 'vyveski-borisoglebsk.html'
      - 'remont-vyvesok.html'
      - 'vyveski-na-russkom.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'prices.html'
      - 'primery-rabot-kejsy.html'
      - 'sitemap.xml'
      - 'tools/public-indexnow-urls.txt'
      - 'tools/public_indexnow.py'
      - 'tools/check_public_indexnow.py'
      - 'tools/test_public_indexnow.py'
      - '.github/workflows/public-indexnow-notify.yml'

permissions:
  contents: read

jobs:
  validate-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate IndexNow key, URL scope and dry payload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_indexnow.py
          python3 tools/test_public_indexnow.py
          git diff --check

  notify-indexnow:
    if: github.event_name == 'push'
    needs: validate-indexnow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the updated public sitemap
        run: python3 tools/public_indexnow.py --wait-for-sitemap
      - name: Notify IndexNow about the reviewed service URLs
        run: python3 tools/public_indexnow.py --submit
