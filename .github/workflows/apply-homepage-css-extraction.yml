name: Apply homepage CSS extraction

on:
  push:
    branches:
      - 'fix/public-homepage-css-2026-07-12'
    paths:
      - 'tools/apply_homepage_css_extraction.py'
      - '.github/workflows/apply-homepage-css-extraction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_homepage_css_extraction.py'
      - '.github/workflows/apply-homepage-css-extraction.yml'

permissions:
  contents: write

jobs:
  apply-guarded-extraction:
    if: github.event_name == 'push' || github.head_ref == 'fix/public-homepage-css-2026-07-12'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/public-homepage-css-2026-07-12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-homepage-css-2026-07-12
          fetch-depth: 0

      - name: Extract homepage CSS and update cache markers
        id: extract
        shell: bash
        run: |
          set +e
          python3 tools/apply_homepage_css_extraction.py > /tmp/homepage-extraction.log 2>&1
          status=$?
          cat /tmp/homepage-extraction.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit extraction diagnostic
        if: steps.extract.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/diagnostics
          cp /tmp/homepage-extraction.log docs/diagnostics/homepage-css-extraction.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/homepage-css-extraction.txt
          git commit -m 'Record homepage CSS extraction diagnostic'
          git push origin HEAD:"$TARGET_BRANCH"
          exit 1

      - name: Validate extracted homepage
        if: steps.extract.outputs.status == '0'
        run: |
          git diff --check
          python3 tools/check_public_homepage_css_migration.py
          python3 tools/check_public_homepage_source_copy.py
          python3 tools/check_public_lead_form_cache_v5_partial.py
          python3 tools/check_public_v5_landing_seo_contract.py

      - name: Commit homepage CSS migration
        if: steps.extract.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html assets/public-homepage.css; then
            echo 'Homepage CSS is already extracted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/public-homepage.css
          git commit -m 'Extract homepage CSS and update public form cache'
          git push origin HEAD:"$TARGET_BRANCH"
