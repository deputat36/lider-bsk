name: Apply composite offer visibility 143 145

on:
  push:
    branches: [agent/143-145-composite-offer-visibility]
    paths:
      - 'tools/patch_composite_offer_visibility_143_145.py'
      - '.github/workflows/apply-composite-offer-visibility-143-145.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/143-145-composite-offer-visibility
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/patch_composite_offer_visibility_143_145.py
      - name: Validate composite and offer visibility
        run: |
          node --check crm/v4/assets/v4/calculation-composite-model-v1.js
          node --check crm/v4/assets/v4/calculations.js
          node --check crm/v4/assets/v4/offer-visibility-v1.js
          node --check crm/v4/assets/v4/offers.js
          node tools/test_calculation_composite_model_v1.mjs
          node tools/test_offer_visibility_v1.mjs
          python3 tools/check_crm_composite_offer_visibility.py
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/calculations.js crm/v4/assets/v4/offers.js
          git commit -m 'Integrate composite calculation and offer visibility'
          git push origin HEAD:agent/143-145-composite-offer-visibility
