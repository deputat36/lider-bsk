name: Apply public lead shared retry patch

on:
  push:
    branches:
      - fix/public-lead-shared-retry-2026-07-10
    paths:
      - '.github/workflows/apply-public-lead-shared-retry-temp.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-lead-shared-retry-2026-07-10

      - name: Apply and validate patch v2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_public_lead_shared_retry.py
          node --check assets/public-lead-form.js
          node --check assets/public-lead-reference-v1.js
          test "$(python3 tools/apply_public_lead_shared_retry.py)" = "already-applied"

      - name: Commit patched assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/public-lead-form.js assets/public-lead-reference-v1.js; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/public-lead-form.js assets/public-lead-reference-v1.js
          git commit -m 'Normalize shared retry phone fingerprint'
          git push origin HEAD:fix/public-lead-shared-retry-2026-07-10
