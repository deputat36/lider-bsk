name: CRM local training scenario check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/crm-training-scenario-v1.js'
      - 'crm/v4/assets/v4/crm-training-scenario-v1.css'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'tools/test_crm_training_scenario.mjs'
      - 'tools/check_crm_training_scenario.py'
      - 'docs/CRM_V4_LOCAL_TRAINING_SCENARIO_2026-07-12.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-training-scenario-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/crm-training-scenario-v1.js'
      - 'crm/v4/assets/v4/crm-training-scenario-v1.css'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'tools/test_crm_training_scenario.mjs'
      - 'tools/check_crm_training_scenario.py'
      - 'docs/CRM_V4_LOCAL_TRAINING_SCENARIO_2026-07-12.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-training-scenario-check.yml'

jobs:
  local-training-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local training scenario
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/crm-training-scenario-v1.js
          node --check crm/v4/assets/v4/role-tab-permissions-v1.js
          node --check crm/v4/assets/v4/action-permissions-v1.js
          node --check crm/v4/assets/v4/site-cache-note-v1.js
          node --check tools/test_crm_training_scenario.mjs
          node tools/test_crm_training_scenario.mjs
          python3 tools/check_crm_training_scenario.py
