name: Staging production-to-installation acceptance contract

on:
  pull_request:
    paths:
      - 'supabase/staging-migrations/20260731_04_installation_job_create_from_order_rpc.sql'
      - 'supabase/staging-tests/20260731_production_to_installation_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-installation-create/**'
      - 'tools/check_staging_production_to_installation_acceptance.py'
      - 'docs/CRM_STAGING_PRODUCTION_TO_INSTALLATION_ACCEPTANCE_2026-07-31.md'
      - '.github/workflows/staging-production-to-installation-acceptance-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/staging-migrations/20260731_04_installation_job_create_from_order_rpc.sql'
      - 'supabase/staging-tests/20260731_production_to_installation_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-installation-create/**'
      - 'tools/check_staging_production_to_installation_acceptance.py'
      - 'docs/CRM_STAGING_PRODUCTION_TO_INSTALLATION_ACCEPTANCE_2026-07-31.md'
      - '.github/workflows/staging-production-to-installation-acceptance-check.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/staging-functions/leader-crm-installation-create/index.ts
      - run: deno test supabase/staging-functions/leader-crm-installation-create/contract_test.ts
      - run: python3 tools/check_staging_production_to_installation_acceptance.py
