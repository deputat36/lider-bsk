name: Public contact identity check

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/public-lead-form.js'
      - 'tools/structured_data_pages.json'
      - 'tools/check_public_contact_identity.py'
      - '.github/workflows/public-contact-identity-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/public-lead-form.js'
      - 'tools/structured_data_pages.json'
      - 'tools/check_public_contact_identity.py'
      - '.github/workflows/public-contact-identity-check.yml'

jobs:
  validate-public-contact-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public phone and email consistency
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_public_contact_identity.py 2>&1 | tee public-contact-identity-report.txt
      - name: Upload contact identity failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-contact-identity-report
          path: public-contact-identity-report.txt
          if-no-files-found: error
          retention-days: 7
