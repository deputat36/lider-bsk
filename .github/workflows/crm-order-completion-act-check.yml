name: CRM order completion act check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/order-act-preview-v1.js'
      - 'docs/CRM_ORDER_COMPLETION_ACT_ARCHITECTURE_2026-07-10.md'
      - 'docs/CRM_ORDER_COMPLETION_ACT_MANUAL_TEST_2026-07-10.md'
      - 'tools/check_crm_order_completion_act.py'
      - '.github/workflows/crm-order-completion-act-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/order-act-preview-v1.js'
      - 'docs/CRM_ORDER_COMPLETION_ACT_ARCHITECTURE_2026-07-10.md'
      - 'docs/CRM_ORDER_COMPLETION_ACT_MANUAL_TEST_2026-07-10.md'
      - 'tools/check_crm_order_completion_act.py'
      - '.github/workflows/crm-order-completion-act-check.yml'

jobs:
  completion-act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate completion act contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_crm_order_completion_act.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/action-permissions-v1.js
          node --check crm/v4/assets/v4/order-act-preview-v1.js
          grep -q 'order-act-preview-v1.js?v=20260710-1' crm/v4/index.html
