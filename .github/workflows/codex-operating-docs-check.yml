name: Codex operating docs check

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/WORKFLOW.md'
      - 'docs/WORK_CURRENT.md'
      - 'docs/AUTOPILOT_RULES.md'
      - 'docs/CODEX_OWNER_PLAYBOOK.md'
      - '.github/workflows/codex-operating-docs-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/WORKFLOW.md'
      - 'docs/WORK_CURRENT.md'
      - 'docs/AUTOPILOT_RULES.md'
      - 'docs/CODEX_OWNER_PLAYBOOK.md'
      - '.github/workflows/codex-operating-docs-check.yml'

permissions:
  contents: read

jobs:
  validate-codex-operating-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify current operating entrypoints
        shell: bash
        run: |
          set -euo pipefail
          # Historical baseline text is preserved in Git history and dated docs.
          # Current operating instructions must not be frozen to June versions.
          for document in AGENTS.md README.md docs/PROJECT.md docs/WORK_CURRENT.md docs/WORKFLOW.md docs/STATUS.md docs/DECISIONS.md docs/AUTOPILOT_RULES.md; do
            test -s "$document"
          done
