name: CRM finance plan actual check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/finance-record-*.js'
      - 'crm/v4/assets/v4/finance-control-v2.js'
      - 'tools/test_finance_records.mjs'
      - 'tools/test_order_detail_read.mjs'
      - 'tools/test_order_operations.mjs'
      - 'tools/build_order_operations_test.py'
      - 'supabase/staging-functions/_shared/order-operations-edge-v1.js'
      - 'supabase/staging-migrations/20261001082221_order_operations_v1.sql'
      - 'supabase/staging-functions/_shared/order-detail-read-v1.js'
      - 'tools/build_finance_rpc_test.py'
      - 'tools/generate_crm_finance_production_candidate.py'
      - 'supabase/functions/leader-crm-finance/**'
      - 'supabase/staging-migrations/20260928093643_finance_records_staging.sql'
      - 'crm/v4/assets/v4/finance-plan-actual-model-v1.js'
      - 'crm/v4/assets/v4/finance-plan-actual-panel-v1.js'
      - 'crm/v4/assets/v4/payment-record-status-model-v1.js'
      - 'crm/v4/assets/v4/order-card-v1.js'
      - 'crm/v4/assets/v4/order-status-ui-model-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'tools/test_finance_plan_actual.mjs'
      - 'tools/test_crm_payment_record_status.mjs'
      - 'tools/check_finance_plan_actual.py'
      - 'tools/check_crm_payment_record_status_registry.py'
      - 'docs/CRM_FINANCE_PLAN_ACTUAL_MANUAL_TEST_2026-07-13.md'
      - 'docs/CRM_PAYMENT_RECORD_STATUS_REGISTRY_MANUAL_TEST_2026-07-15.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-finance-plan-actual-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/finance-record-*.js'
      - 'crm/v4/assets/v4/finance-control-v2.js'
      - 'tools/test_finance_records.mjs'
      - 'tools/test_order_detail_read.mjs'
      - 'tools/test_order_operations.mjs'
      - 'tools/build_order_operations_test.py'
      - 'supabase/staging-functions/_shared/order-operations-edge-v1.js'
      - 'supabase/staging-migrations/20261001082221_order_operations_v1.sql'
      - 'supabase/staging-functions/_shared/order-detail-read-v1.js'
      - 'tools/build_finance_rpc_test.py'
      - 'tools/generate_crm_finance_production_candidate.py'
      - 'supabase/functions/leader-crm-finance/**'
      - 'supabase/staging-migrations/20260928093643_finance_records_staging.sql'
      - 'crm/v4/assets/v4/finance-plan-actual-model-v1.js'
      - 'crm/v4/assets/v4/finance-plan-actual-panel-v1.js'
      - 'crm/v4/assets/v4/payment-record-status-model-v1.js'
      - 'crm/v4/assets/v4/order-card-v1.js'
      - 'crm/v4/assets/v4/order-status-ui-model-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'tools/test_finance_plan_actual.mjs'
      - 'tools/test_crm_payment_record_status.mjs'
      - 'tools/check_finance_plan_actual.py'
      - 'tools/check_crm_payment_record_status_registry.py'
      - 'docs/CRM_FINANCE_PLAN_ACTUAL_MANUAL_TEST_2026-07-13.md'
      - 'docs/CRM_PAYMENT_RECORD_STATUS_REGISTRY_MANUAL_TEST_2026-07-15.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-finance-plan-actual-check.yml'

jobs:
  finance-plan-actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate finance plan and actual contract
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/finance-plan-actual-model-v1.js
          node --check crm/v4/assets/v4/finance-plan-actual-panel-v1.js
          node --check crm/v4/assets/v4/payment-record-status-model-v1.js
          node --check crm/v4/assets/v4/order-card-v1.js
          node --check crm/v4/assets/v4/order-status-ui-model-v1.js
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node --check crm/v4/assets/v4/role-tab-permissions-v1.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
          node --check tools/test_finance_plan_actual.mjs
          node --check tools/test_crm_payment_record_status.mjs
          node tools/test_finance_records.mjs
          node tools/test_order_detail_read.mjs
          node tools/test_order_operations.mjs
          node tools/test_finance_plan_actual.mjs
          node tools/test_crm_payment_record_status.mjs
          python3 tools/check_finance_plan_actual.py
          python3 tools/check_crm_payment_record_status_registry.py

  finance-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate source-only production package and isolated SQL test
        run: |
          python3 tools/generate_crm_finance_production_candidate.py
          python3 tools/build_finance_rpc_test.py
          python3 tools/build_order_operations_test.py
      - name: Exercise real transaction, role, replay and rollback semantics
        env:
          PGPASSWORD: isolated-ci-only
        run: |
          psql -h localhost -U postgres -d finance_test -v ON_ERROR_STOP=1 -f build/finance-rpc-test.sql
          psql -h localhost -U postgres -d finance_test -v ON_ERROR_STOP=1 -f build/order-operations-test.sql
      - name: Upload source-only production candidates
        uses: actions/upload-artifact@v4
        with:
          name: crm-finance-production-candidate
          path: build/crm-finance-production-candidate
