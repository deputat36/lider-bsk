name: Order card finance check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-order-card-finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate confirmation-aware finance markers
        shell: bash
        run: |
          set -euo pipefail
          index='crm/v4/index.html'
          card='crm/v4/assets/v4/order-card-v1.js'
          model='crm/v4/assets/v4/finance-plan-actual-model-v1.js'
          test -f "$index"
          test -f "$card"
          test -f "$model"
          grep -Fq 'order-card-v1.js?v=20260629-design-1' "$index"
          grep -Fq "from('leader_payments')" "$card"
          grep -Fq "from('leader_expenses')" "$card"
          grep -Fq "from './finance-plan-actual-model-v1.js'" "$card"
          grep -Fq 'План и подтверждённый факт' "$card"
          grep -Fq 'Подтверждено приходов' "$card"
          grep -Fq 'Чистые поступления' "$card"
          grep -Fq 'Долг клиента' "$card"
          grep -Fq 'Подтв. расходы' "$card"
          grep -Fq 'Денежный результат' "$card"
          grep -Fq 'Не рассчитана' "$card"
          grep -Fq 'План / факт' "$card"
          ! grep -Fq '<span>Факт прибыль</span>' "$card"
          node --check "$model"
          node --check "$card"
