name: Fix public intake credential fallback once

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/fix_public_intake_credential_fallback_once.py'
      - 'tools/run-fix-public-intake-credential-fallback-once.txt'
      - '.github/workflows/fix-public-intake-credential-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/public-intake-service-role-candidate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact fallback fix
        run: |
          set -euo pipefail
          python3 tools/fix_public_intake_credential_fallback_once.py
          python3 tools/check_public_intake_service_role_candidate.py
      - name: Commit source and remove one-off machinery
        run: |
          set -euo pipefail
          rm -f tools/fix_public_intake_credential_fallback_once.py
          rm -f tools/run-fix-public-intake-credential-fallback-once.txt
          rm -f .github/workflows/fix-public-intake-credential-fallback-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Сохранить legacy fallback при повреждённом modern secret config'
          git push origin HEAD:${{ github.head_ref }}
