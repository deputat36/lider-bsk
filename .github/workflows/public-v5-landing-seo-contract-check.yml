name: Public v5 landing SEO contract check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - '.github/workflows/public-v5-landing-seo-contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'tools/check_public_lead_form_cache_v5_partial.py'
      - 'tools/check_public_v5_landing_seo_contract.py'
      - '.github/workflows/public-v5-landing-seo-contract-check.yml'

jobs:
  validate-public-v5-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate public v5 landing SEO and contour contract
        shell: bash
        run: |
          set +e
          {
            python3 tools/check_public_lead_form_cache_v5_partial.py
            python3 tools/check_public_v5_landing_seo_contract.py
          } > public-v5-seo-report.txt 2>&1
          status=$?
          cat public-v5-seo-report.txt
          exit "$status"

      - name: Upload SEO diagnostic report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-v5-seo-report
          path: public-v5-seo-report.txt
          if-no-files-found: error
          retention-days: 7
