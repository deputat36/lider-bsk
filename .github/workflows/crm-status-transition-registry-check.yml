name: CRM status transition registry check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/lead-operational-quality-v1.js'
      - 'docs/CRM_STATUS_TRANSITION_REGISTRY_2026-07-10.md'
      - 'docs/CRM_STATUS_TRANSITION_EXECUTION_ADDENDUM_2026-07-10.md'
      - 'tools/check_crm_status_transition_registry.py'
      - 'tools/test_crm_status_transitions.mjs'
      - '.github/workflows/crm-status-transition-registry-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/lead-operational-quality-v1.js'
      - 'docs/CRM_STATUS_TRANSITION_REGISTRY_2026-07-10.md'
      - 'docs/CRM_STATUS_TRANSITION_EXECUTION_ADDENDUM_2026-07-10.md'
      - 'tools/check_crm_status_transition_registry.py'
      - 'tools/test_crm_status_transitions.mjs'
      - '.github/workflows/crm-status-transition-registry-check.yml'

jobs:
  status-transition-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate status registry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_crm_status_transition_registry.py

      - name: Check JavaScript and behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node --check crm/v4/assets/v4/lead-operational-quality-v1.js
          node --check tools/test_crm_status_transitions.mjs
          node tools/test_crm_status_transitions.mjs
