jobs:
  status-transition-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate status registry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_crm_status_transition_registry.py
          python3 tools/check_crm_lead_status_ui_registry.py
          python3 tools/check_crm_offer_status_ui_registry.py
          python3 tools/check_crm_order_status_ui_registry.py
          python3 tools/check_crm_payment_status_ui_registry.py
          python3 tools/check_crm_production_status_ui_registry.py
          python3 tools/check_crm_installation_status_ui_registry.py
          python3 tools/check_crm_production_board_status_registry.py

      - name: Check JavaScript and behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node --check crm/v4/assets/v4/lead-operational-quality-v1.js
          node --check crm/v4/assets/v4/lead-status-ui-model-v1.js
          node --check crm/v4/assets/v4/lead-status-ui-registry-v1.js
          node --check crm/v4/assets/v4/offer-status-ui-model-v1.js
          node --check crm/v4/assets/v4/offers.js
          node --check crm/v4/assets/v4/order-status-ui-model-v1.js
          node --check crm/v4/assets/v4/orders.js
          node --check crm/v4/assets/v4/orders-fast-loader-v1.js
          node --check crm/v4/assets/v4/order-control-v2.js
          node --check crm/v4/assets/v4/order-card-v1.js
          node --check crm/v4/assets/v4/payment-status-ui-model-v1.js
          node --check crm/v4/assets/v4/finance-control-v2.js
          node --check crm/v4/assets/v4/production-status-ui-model-v1.js
          node --check crm/v4/assets/v4/production-job-card-v2.js
          node --check crm/v4/assets/v4/installation-status-ui-model-v1.js
          node --check crm/v4/assets/v4/installation-job-card-v2.js
          node --check crm/v4/assets/v4/production-board-status-model-v1.js
          node --check crm/v4/assets/v4/production-alerts-v1.js
          node --check tools/test_crm_status_transitions.mjs
          node --check tools/test_crm_lead_status_ui.mjs
          node --check tools/test_crm_offer_status_ui.mjs
          node --check tools/test_crm_order_status_ui.mjs
          node --check tools/test_crm_payment_status_ui.mjs
          node --check tools/test_crm_production_status_ui.mjs
          node --check tools/test_crm_installation_status_ui.mjs
          node --check tools/test_crm_production_board_status_model.mjs
          node tools/test_crm_status_transitions.mjs
          node tools/test_crm_lead_status_ui.mjs
          node tools/test_crm_offer_status_ui.mjs
          node tools/test_crm_order_status_ui.mjs
          node tools/test_crm_payment_status_ui.mjs
          node tools/test_crm_production_status_ui.mjs
          node tools/test_crm_installation_status_ui.mjs
          node tools/test_crm_production_board_status_model.mjs
