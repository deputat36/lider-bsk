name: Public UTM links assets check

on:
  push:
    branches: [main]
    paths:
      - 'utm-links.html'
      - 'assets/public-utm-links.css'
      - 'assets/public-utm-links.js'
      - 'assets/public-campaign-link-model.js'
      - 'sitemap.xml'
      - 'tools/check_public_utm_links_assets.py'
      - 'tools/test_public_campaign_link_builder.mjs'
      - 'docs/PUBLIC_UTM_LINKS_ASSETS_2026-07-15.md'
      - 'docs/PUBLIC_CAMPAIGN_LINK_BUILDER_2026-07-17.md'
      - 'docs/STATUS.md'
      - '.github/workflows/public-utm-links-assets-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'utm-links.html'
      - 'assets/public-utm-links.css'
      - 'assets/public-utm-links.js'
      - 'assets/public-campaign-link-model.js'
      - 'sitemap.xml'
      - 'tools/check_public_utm_links_assets.py'
      - 'tools/test_public_campaign_link_builder.mjs'
      - 'docs/PUBLIC_UTM_LINKS_ASSETS_2026-07-15.md'
      - 'docs/PUBLIC_CAMPAIGN_LINK_BUILDER_2026-07-17.md'
      - 'docs/STATUS.md'
      - '.github/workflows/public-utm-links-assets-check.yml'

jobs:
  validate-utm-links-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate internal UTM tool assets and links
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_utm_links_assets.py
          node --check assets/public-campaign-link-model.js
          node --check assets/public-utm-links.js
          node --check tools/test_public_campaign_link_builder.mjs
          node tools/test_public_campaign_link_builder.mjs
          git diff --check
