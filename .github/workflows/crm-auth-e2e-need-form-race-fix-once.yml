name: CRM authenticated E2E need-form race fix once

on:
  push:
    branches:
      - agent/487-authenticated-staging-e2e
    paths:
      - 'tools/run-crm-auth-e2e-need-form-race-fix-once.txt'

permissions:
  contents: write

concurrency:
  group: crm-auth-e2e-need-form-race-fix-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact post-assignment render race fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tools/run_crm_staging_authenticated_e2e.mjs')
          source = runner.read_text()
          old = (
              "  progress('assignment_before_need_ui');\n"
              "  const assignmentEvent=waitForDocumentEvent('leader-v4:lead-workflow-updated','lead_assignment_event_timeout',45000);progress('lead_assign_clicked');click(assignSelector);progress('lead_assign_dispatched');\n"
              "  const assignmentDetail=await assignmentEvent;assert(clean(assignmentDetail?.lead?.assigned_to),'lead_assignment_event_missing_assignee');assert(clean(assignmentDetail?.lead?.status)==='В работе','lead_assignment_event_status_sync_failed');record('lead_assignment_ui_confirmed');\n"
          )
          new = (
              "  progress('assignment_before_need_ui');\n"
              "  const refreshedCard=waitForDocumentEvent('leader-v4:lead-card-rendered','lead_card_refresh_after_assignment_timeout',45000);\n"
              "  const assignmentEvent=waitForDocumentEvent('leader-v4:lead-workflow-updated','lead_assignment_event_timeout',45000);progress('lead_assign_clicked');click(assignSelector);progress('lead_assign_dispatched');\n"
              "  const assignmentDetail=await assignmentEvent;assert(clean(assignmentDetail?.lead?.assigned_to),'lead_assignment_event_missing_assignee');assert(clean(assignmentDetail?.lead?.status)==='В работе','lead_assignment_event_status_sync_failed');\n"
              "  const refreshDetail=await refreshedCard;assert(clean(refreshDetail?.lead?.id)===R.leadId,'lead_card_refresh_after_assignment_wrong_lead');\n"
              "  await waitFor(()=>document.body.dataset.v4Tab==='card'&&location.search.includes('lead='+R.leadId),'lead_card_route_after_assignment_timeout',45000);record('lead_assignment_ui_confirmed');\n"
          )
          if source.count(old) != 1:
              raise SystemExit('post_assignment_runner_anchor_mismatch')
          runner.write_text(source.replace(old, new, 1))

          test = Path('tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs')
          test_source = test.read_text()
          anchor = "assert.match(runnerSource, /assignment_before_need_ui/);\n"
          addition = (
              anchor
              + "assert.match(runnerSource, /lead_card_refresh_after_assignment_timeout/);\n"
              + "assert.match(runnerSource, /lead_card_refresh_after_assignment_wrong_lead/);\n"
              + "assert.match(runnerSource, /lead_card_route_after_assignment_timeout/);\n"
          )
          if test_source.count(anchor) != 1:
              raise SystemExit('post_assignment_test_anchor_mismatch')
          test.write_text(test_source.replace(anchor, addition, 1))
          PY

          node --check tools/run_crm_staging_authenticated_e2e.mjs
          node --check tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          node tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --check

      - name: Commit exact fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_crm_staging_authenticated_e2e.mjs tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --cached --quiet && { echo 'No patch to commit' >&2; exit 1; }
          git commit -m 'Wait for post-assignment card render in authenticated E2E'
          git push origin HEAD:agent/487-authenticated-staging-e2e
