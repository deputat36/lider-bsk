name: CRM authenticated E2E transport response fix once

on:
  push:
    branches:
      - agent/487-authenticated-staging-e2e
    paths:
      - 'tools/run-crm-auth-e2e-need-form-race-fix-once.txt'

permissions:
  contents: write

concurrency:
  group: crm-auth-e2e-transport-response-fix-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace native Response body stream in exact RPC interception
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tools/run_crm_staging_authenticated_e2e.mjs')
          source = runner.read_text()
          old = "return Promise.resolve(new Response(JSON.stringify({ok:true,request_id:command.request_id,idempotent_replay:false,lead}),{status:201,headers:{'Content-Type':'application/json','Cache-Control':'no-store'}}));"
          new = "const synthetic={ok:true,request_id:command.request_id,idempotent_replay:false,lead};progress('workflow_rpc_synthetic_ready');return Promise.resolve({ok:true,status:201,json:async()=>{progress('workflow_rpc_synthetic_json');return synthetic;}});"
          if source.count(old) != 1:
              raise SystemExit('synthetic_response_runner_anchor_mismatch')
          runner.write_text(source.replace(old, new, 1))

          test = Path('tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs')
          test_source = test.read_text()
          old_test = "assert.match(runnerSource, /status:201,headers:\\{'Content-Type':'application\\/json'/);\n"
          new_test = (
              "assert.doesNotMatch(runnerSource, /new Response\\(JSON\\.stringify\\(\\{ok:true,request_id:command\\.request_id/);\n"
              "assert.match(runnerSource, /workflow_rpc_synthetic_ready/);\n"
              "assert.match(runnerSource, /workflow_rpc_synthetic_json/);\n"
              "assert.match(runnerSource, /status:201,json:async/);\n"
          )
          if test_source.count(old_test) != 1:
              raise SystemExit('synthetic_response_test_anchor_mismatch')
          test.write_text(test_source.replace(old_test, new_test, 1))
          PY

          node --check tools/run_crm_staging_authenticated_e2e.mjs
          node --check tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          node tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --check

      - name: Commit exact transport response fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_crm_staging_authenticated_e2e.mjs tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --cached --quiet && { echo 'No patch to commit' >&2; exit 1; }
          git commit -m 'Use settled JSON response in authenticated E2E bridge'
          git push origin HEAD:agent/487-authenticated-staging-e2e
