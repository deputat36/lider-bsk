name: Supabase staging local reconstruction shadow

on:
  push:
    branches:
      - chore/supabase-staging-decommission-prep-2026-10-01
    paths:
      - '.github/workflows/supabase-staging-local-reconstruction-shadow.yml'
      - 'supabase/staging-migrations/**'
      - 'supabase/staging/**'
      - '.ci/supabase-staging-baseline/**'
      - '.ci/supabase-staging-reconstruction/**'
      - 'supabase/production-candidates/20260724_02_public_intake_rate_limit_candidate.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    name: Reconstruct staging locally
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Supabase CLI: $(supabase --version)"
          test -d supabase/staging-migrations
          if grep -R -n --fixed-strings 'ofewxuqfjhamgerwzull' supabase/staging-migrations; then
            echo 'Production project ref found in staging migrations; refusing local reconstruction.'
            exit 1
          fi
          if grep -R -nE 'supabase[[:space:]]+(link|db[[:space:]]+(push|pull|dump|reset)[[:space:]].*--linked)' supabase/staging-migrations; then
            echo 'Remote Supabase CLI command text found in staging SQL; refusing reconstruction.'
            exit 1
          fi

      - name: Build isolated local Supabase workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/supabase-staging-local
          mkdir -p .ci/supabase-staging-local
          cd .ci/supabase-staging-local
          supabase init
          mkdir -p supabase/migrations

          python3 - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          import shutil

          root = Path.cwd().parents[1]
          baseline_dir = root / '.ci' / 'supabase-staging-baseline'
          src_dir = root / 'supabase' / 'staging-migrations'
          legacy_staging_dir = root / 'supabase' / 'staging'
          reconstruction_dir = root / '.ci' / 'supabase-staging-reconstruction'
          rate_candidate = root / 'supabase' / 'production-candidates' / '20260724_02_public_intake_rate_limit_candidate.sql'
          dst_dir = Path.cwd() / 'supabase' / 'migrations'
          baseline_files = sorted(baseline_dir.glob('*.sql'))
          reconstruction_files = sorted(reconstruction_dir.glob('*.sql'))

          if not rate_candidate.is_file():
              raise SystemExit('Public intake rate-limit candidate source is missing')

          rate_source = rate_candidate.read_text(encoding='utf-8')
          tx_marker = 'begin;\\n'
          if tx_marker not in rate_source:
              raise SystemExit('Rate-limit candidate transaction marker is missing')
          staging_guard = """do $guard$
begin
  if not exists (
    select 1
    from leader_staging.environment_guard
    where singleton = true
      and project_ref = 'otulfnouybahfnsycxqn'
      and environment_name = 'staging'
      and repository = 'deputat36/lider-bsk'
  ) then
    raise exception 'staging_environment_guard_failed';
  end if;
end
$guard$;

"""
          rate_source = rate_source.replace(tx_marker, tx_marker + staging_guard, 1)
          rate_reconstruction = Path.cwd() / '20260725_rate_limit_local_reconstruction.sql'
          rate_reconstruction.write_text(rate_source, encoding='utf-8')

          excluded_source_only = {
              '20260715_02_calculation_version_harness.sql',
              '20260715_03_calculation_version_safe_response.sql',
          }
          primary_files = sorted(
              p for p in src_dir.glob('*.sql')
              if 'rollback' not in p.name.lower()
              and p.name not in excluded_source_only
          )
          legacy_files = sorted(legacy_staging_dir.glob('*.sql'))

          pre_20260721 = [p for p in primary_files if p.name < '20260721_']
          from_20260721 = [p for p in primary_files if p.name >= '20260721_']
          through_public_intake_alignment = [
              p for p in from_20260721
              if p.name <= '20260725_01_public_intake_contract_alignment.sql'
          ]
          after_public_intake_alignment = [
              p for p in from_20260721
              if p.name > '20260725_01_public_intake_contract_alignment.sql'
          ]
          offer_reconstruction = [
              p for p in reconstruction_files
              if p.name.startswith('20260718_')
          ]
          other_reconstruction = [
              p for p in reconstruction_files
              if not p.name.startswith('20260718_')
          ]
          if other_reconstruction:
              raise SystemExit(
                  'Unclassified local reconstruction files: '
                  + ', '.join(p.name for p in other_reconstruction)
              )

          files = (
              baseline_files
              + pre_20260721
              + offer_reconstruction
              + legacy_files
              + through_public_intake_alignment
              + [rate_reconstruction]
              + after_public_intake_alignment
          )
          staging_files = (
              primary_files
              + reconstruction_files
              + legacy_files
              + [rate_reconstruction]
          )

          if not primary_files:
              raise SystemExit('No staging migration SQL files found')
          if not legacy_files:
              raise SystemExit('Expected supabase/staging compatibility migrations are missing')
          if not reconstruction_files:
              raise SystemExit('Expected local staging reconstruction files are missing')
          if not baseline_files:
              raise SystemExit('No local staging baseline SQL files found')

          base = datetime(2020, 1, 1, 0, 0, 0)
          manifest = []
          for index, src in enumerate(files):
              version = (base + timedelta(seconds=index)).strftime('%Y%m%d%H%M%S')
              dst = dst_dir / f'{version}_{src.stem}.sql'
              shutil.copyfile(src, dst)
              manifest.append(f'{dst.name}\t{src.relative_to(root)}')

          manifest_path = Path.cwd() / 'migration-map.tsv'
          manifest_path.write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(
              f'Prepared {len(baseline_files)} local baseline files + '
              f'{len(primary_files)} canonical/helper staging files + '
              f'{len(reconstruction_files)} reconstructed historical blocks + '
              f'{len(legacy_files)} compatibility migrations; '
              f'source-only and rollback scripts excluded'
          )
          PY

          test -s migration-map.tsv
          cat migration-map.tsv

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/supabase-staging-local
          supabase start

      - name: Rebuild database from staging migrations
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/supabase-staging-local
          supabase db reset --local
          supabase migration list --local

      - name: Verify staging guard exists locally
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/supabase-staging-local
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "${DB_URL}"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -Atc "
            select project_ref || '|' || environment_name || '|' || repository
            from leader_staging.environment_guard
            where singleton = true;
          " | grep -Fx 'otulfnouybahfnsycxqn|staging|deputat36/lider-bsk'

      - name: Print local staging parity fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/supabase-staging-local
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "${DB_URL}"
          echo 'LOCAL_STAGING_FINGERPRINT='
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -Atc "
            with table_items as (
              select schemaname || '.' || tablename as item
              from pg_tables
              where (schemaname='public' and tablename like 'leader_%')
                 or schemaname in ('leader_private','leader_staging')
            ),
            function_items as (
              select n.nspname || '.' || p.oid::regprocedure::text || '=' ||
                     md5(pg_get_functiondef(p.oid)) as item
              from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
              where (n.nspname='public' and (p.proname like 'leader_%' or p.proname='rls_auto_enable'))
                 or n.nspname='leader_private'
            ),
            policy_items as (
              select schemaname || '.' || tablename || ':' || policyname || ':' ||
                     permissive || ':' || array_to_string(roles, ',') || ':' || cmd || ':' ||
                     coalesce(qual,'') || ':' || coalesce(with_check,'') as item
              from pg_policies
              where (schemaname='public' and tablename like 'leader_%')
                 or schemaname in ('leader_private','leader_staging')
            ),
            index_items as (
              select n.nspname || '.' || t.relname || ':' || i.relname || ':' ||
                     pg_get_indexdef(i.oid) as item
              from pg_index x
              join pg_class t on t.oid=x.indrelid
              join pg_namespace n on n.oid=t.relnamespace
              join pg_class i on i.oid=x.indexrelid
              where (n.nspname='public' and t.relname like 'leader_%')
                 or n.nspname in ('leader_private','leader_staging')
            )
            select jsonb_build_object(
              'tables_count',(select count(*) from table_items),
              'tables_hash',(select md5(string_agg(item,E'\\n' order by item)) from table_items),
              'functions_count',(select count(*) from function_items),
              'functions_hash',(select md5(string_agg(item,E'\\n' order by item)) from function_items),
              'policies_count',(select count(*) from policy_items),
              'policies_hash',(select md5(string_agg(item,E'\\n' order by item)) from policy_items),
              'indexes_count',(select count(*) from index_items),
              'indexes_hash',(select md5(string_agg(item,E'\\n' order by item)) from index_items)
            );
          "

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd .ci/supabase-staging-local 2>/dev/null || exit 0
          supabase stop --no-backup || true
