name: CRM staging installation schema check

on:
  pull_request:
    paths:
      - 'supabase/staging-migrations/20260721_05_installation_schema_install.sql'
      - 'supabase/staging-migrations/20260721_06_installation_job_update_rpc.sql'
      - 'supabase/staging-migrations/20260721_07_installation_command_compat.sql'
      - 'supabase/staging-migrations/20260721_09_installation_schema_indexes_reconcile.sql'
      - 'supabase/staging-tests/20260721_installation_schema_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-installation/**'
      - 'contracts/crm-staging-installation-schema-v1.json'
      - 'docs/SUPABASE_STAGING_INSTALLATION_SCHEMA_V1_2026-07-21.md'
      - 'tools/check_crm_staging_installation_schema.py'
      - '.github/workflows/crm-staging-installation-schema-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/staging-migrations/20260721_05_installation_schema_install.sql'
      - 'supabase/staging-migrations/20260721_06_installation_job_update_rpc.sql'
      - 'supabase/staging-migrations/20260721_07_installation_command_compat.sql'
      - 'supabase/staging-migrations/20260721_09_installation_schema_indexes_reconcile.sql'
      - 'supabase/staging-tests/20260721_installation_schema_acceptance.sql'
      - 'supabase/staging-functions/leader-crm-installation/**'
      - 'contracts/crm-staging-installation-schema-v1.json'
      - 'docs/SUPABASE_STAGING_INSTALLATION_SCHEMA_V1_2026-07-21.md'
      - 'tools/check_crm_staging_installation_schema.py'
      - '.github/workflows/crm-staging-installation-schema-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile checker
        run: python3 -m py_compile tools/check_crm_staging_installation_schema.py
      - name: Validate aligned staging installation schema v5
        shell: bash
        run: |
          set +e
          python3 tools/check_crm_staging_installation_schema.py > installation-schema-check.log 2>&1
          status=$?
          cat installation-schema-check.log
          exit "$status"
      - name: Upload installation schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-schema-check-diagnostics
          path: installation-schema-check.log
          if-no-files-found: error
          retention-days: 7
