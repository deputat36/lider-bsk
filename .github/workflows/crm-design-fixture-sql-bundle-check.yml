name: CRM design staging fixture SQL bundle check

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/design-task-staging-fixture-sql-bundle-v1.json'
      - 'contracts/design-task-staging-fixture-manifest-v1.json'
      - 'tools/create-design-task-staging-fixture-manifest.mjs'
      - 'tools/create-design-task-staging-fixture-sql-bundle.mjs'
      - 'tools/design-task-staging-auth-e2e.mjs'
      - 'tools/design-task-staging-auth-e2e-v2.mjs'
      - 'tools/test_create_design_task_staging_fixture_sql_bundle.mjs'
      - 'tools/check_design_task_staging_fixture_sql_bundle.py'
      - 'docs/CRM_DESIGN_TASK_STAGING_FIXTURE_SQL_BUNDLE_2026-07-14.md'
      - '.github/workflows/crm-design-fixture-sql-bundle-check.yml'
      - '.gitignore'
      - 'supabase/config.toml'
  push:
    branches: [main]
    paths:
      - 'contracts/design-task-staging-fixture-sql-bundle-v1.json'
      - 'contracts/design-task-staging-fixture-manifest-v1.json'
      - 'tools/create-design-task-staging-fixture-manifest.mjs'
      - 'tools/create-design-task-staging-fixture-sql-bundle.mjs'
      - 'tools/design-task-staging-auth-e2e.mjs'
      - 'tools/design-task-staging-auth-e2e-v2.mjs'
      - 'tools/test_create_design_task_staging_fixture_sql_bundle.mjs'
      - 'tools/check_design_task_staging_fixture_sql_bundle.py'
      - 'docs/CRM_DESIGN_TASK_STAGING_FIXTURE_SQL_BUNDLE_2026-07-14.md'
      - '.github/workflows/crm-design-fixture-sql-bundle-check.yml'
      - '.gitignore'
      - 'supabase/config.toml'

permissions:
  contents: read

jobs:
  validate-fixture-sql-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate contract JSON
        run: python3 -m json.tool contracts/design-task-staging-fixture-sql-bundle-v1.json >/dev/null

      - name: Validate source syntax
        run: |
          node --check tools/create-design-task-staging-fixture-sql-bundle.mjs
          node --check tools/test_create_design_task_staging_fixture_sql_bundle.mjs
          python3 -m py_compile tools/check_design_task_staging_fixture_sql_bundle.py

      - name: Run fixture SQL bundle behavior tests
        run: node tools/test_create_design_task_staging_fixture_sql_bundle.mjs

      - name: Validate source contracts and production boundary
        run: python3 tools/check_design_task_staging_fixture_sql_bundle.py

      - name: Generate temporary manifest and SQL bundle locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)"
          node tools/create-design-task-staging-fixture-manifest.mjs \
            --auth-user-id=22222222-2222-4222-8222-222222222222 \
            --lead-id=33333333-3333-4333-8333-333333333333 \
            --order-id=44444444-4444-4444-8444-444444444444 \
            --need-id=55555555-5555-4555-8555-555555555555 \
            --expected-updated-at="$created_at" \
            --idempotency-key=ci-local-fixture-sql-bundle \
            --task-title='CI local staging fixture' \
            --created-at="$created_at" \
            --expires-at="$expires_at" \
            --output=artifacts/design-task-staging-fixture-manifest.json
          node tools/create-design-task-staging-fixture-sql-bundle.mjs \
            --manifest=artifacts/design-task-staging-fixture-manifest.json \
            --seed-output=artifacts/design-task-staging-fixture-seed.sql \
            --cleanup-output=artifacts/design-task-staging-fixture-cleanup.sql \
            --summary-output=artifacts/design-task-staging-fixture-sql-bundle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('artifacts/design-task-staging-fixture-sql-bundle.json').read_text(encoding='utf-8'))
          assert summary['project_ref'] == 'otulfnouybahfnsycxqn'
          assert summary['production_enabled'] is False
          assert summary['contains_credentials'] is False
          assert summary['performs_network_calls'] is False
          assert summary['executes_sql'] is False
          assert summary['auth_user_required'] is True
          assert summary['auth_user_created_or_deleted_by_sql'] is False
          assert len(summary['manifest_digest_sha256']) == 64
          assert len(summary['seed_sha256']) == 64
          assert len(summary['cleanup_sha256']) == 64
          PY

      - name: Protect generated SQL boundaries
        shell: bash
        run: |
          set -euo pipefail
          seed=artifacts/design-task-staging-fixture-seed.sql
          cleanup=artifacts/design-task-staging-fixture-cleanup.sql
          grep --fixed-strings 'otulfnouybahfnsycxqn' "$seed" "$cleanup" >/dev/null
          if grep --fixed-strings 'ofewxuqfjhamgerwzull' "$seed" "$cleanup"; then
            echo 'Production ref leaked into generated SQL.' >&2
            exit 1
          fi
          if grep -E -i '\b(insert into|delete from)[[:space:]]+auth\.users\b' "$seed" "$cleanup"; then
            echo 'Generated SQL must never mutate auth.users.' >&2
            exit 1
          fi
          if grep -E -i '\b(create|alter|drop|grant|revoke|truncate)\b' "$seed" "$cleanup"; then
            echo 'Generated fixture SQL must not contain DDL or grants.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          seed = Path('artifacts/design-task-staging-fixture-seed.sql').read_text(encoding='utf-8').lower()
          cleanup = Path('artifacts/design-task-staging-fixture-cleanup.sql').read_text(encoding='utf-8').lower()
          inserts = re.findall(r'insert\s+into\s+([a-z0-9_.]+)', seed)
          assert inserts == [
              'public.leader_user_profiles',
              'public.leader_leads',
              'public.leader_orders',
              'public.leader_lead_needs',
          ], inserts
          deletes = re.findall(r'delete\s+from\s+([a-z0-9_.]+)', cleanup)
          assert deletes == [
              'leader_private.leader_command_receipts',
              'public.leader_design_task_events',
              'public.leader_design_tasks',
              'public.leader_production_jobs',
              'public.leader_lead_needs',
              'public.leader_orders',
              'public.leader_leads',
              'public.leader_user_profiles',
          ], deletes
          PY

      - name: Reject committed or generated secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E --line-number \
            'sb_secret_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|database[_-]?password[[:space:]]*[=:]|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' \
            contracts/design-task-staging-fixture-sql-bundle-v1.json \
            tools/create-design-task-staging-fixture-sql-bundle.mjs \
            tools/test_create_design_task_staging_fixture_sql_bundle.mjs \
            docs/CRM_DESIGN_TASK_STAGING_FIXTURE_SQL_BUNDLE_2026-07-14.md \
            artifacts/design-task-staging-fixture-seed.sql \
            artifacts/design-task-staging-fixture-cleanup.sql \
            artifacts/design-task-staging-fixture-sql-bundle.json; then
            echo 'Possible secret material found in fixture SQL bundle.' >&2
            exit 1
          fi

      - name: Protect production config
        run: grep --fixed-strings 'project_id = "ofewxuqfjhamgerwzull"' supabase/config.toml >/dev/null
