name: Public no secret markers check

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/*.js'
      - 'assets/*.css'
      - '.github/workflows/public-no-secret-markers-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/*.js'
      - 'assets/*.css'
      - '.github/workflows/public-no-secret-markers-check.yml'

jobs:
  public-no-secret-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public files for secret markers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            *.html
            assets/*.js
            assets/*.css
          )
          markers=(
            'SUPABASE_SERVICE_ROLE'
            'SUPABASE_SERVICE_KEY'
            'SUPABASE_DB_PASSWORD'
            'DATABASE_URL'
            'service_role'
            'service-role'
            'sb_secret_'
            'JWT_SECRET'
            'PRIVATE_KEY'
          )
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            for marker in "${markers[@]}"; do
              if grep -Fq "$marker" "$file"; then
                echo "Forbidden marker '$marker' found in $file" >&2
                exit 1
              fi
            done
          done
