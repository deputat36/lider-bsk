name: Apply issue 516 offer privacy UX once

on:
  push:
    branches: [agent/516-offer-privacy-ux-v1]
    paths:
      - 'tools/apply_issue_516_offer_privacy_ux_patch.py'
      - '.github/workflows/apply-issue-516-offer-privacy-ux-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/516-offer-privacy-ux-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix exact two-template replacement guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_issue_516_offer_privacy_ux_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '''print_source = replace_once(print_source, old_business, "  const { offer, calculation, items } = bundle;", 'business destructure')\nprint_source = replace_once(print_source, old_business, "  const { offer, calculation, items } = bundle;", 'presentation destructure')'''
          new = '''if print_source.count(old_business) != 2:\n    raise RuntimeError(f'print destructure: expected 2 occurrences, got {print_source.count(old_business)}')\nprint_source = print_source.replace(old_business, "  const { offer, calculation, items } = bundle;", 2)'''
          if old not in s:
              raise SystemExit('destructure patch marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply exact source patch
        run: python3 tools/apply_issue_516_offer_privacy_ux_patch.py
      - name: Syntax and focused tests
        run: |
          node --check crm/v4/assets/v4/offers.js
          node --check crm/v4/assets/v4/offer-print-brand-v4.js
          node --check crm/v4/assets/v4/offer-client-privacy-v1.js
          node tools/test_offer_client_privacy_v1.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/offers.js crm/v4/assets/v4/offer-print-brand-v4.js
          git commit -m 'Make commercial offers anonymous by default'
          git push origin HEAD:agent/516-offer-privacy-ux-v1
