name: Public accessibility browser check
on:
  pull_request:
    branches: [main]
    paths: ['*.html', 'assets/**', 'tools/test_public_accessibility_browser.mjs', '.github/workflows/public-accessibility-browser-check.yml']
  push:
    branches: [main]
    paths: ['*.html', 'assets/**', 'tools/test_public_accessibility_browser.mjs', '.github/workflows/public-accessibility-browser-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
      - name: Check every public page at mobile and desktop widths without external writes
        run: node tools/test_public_accessibility_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-accessibility-browser
          path: artifacts/public-accessibility/
          retention-days: 7
