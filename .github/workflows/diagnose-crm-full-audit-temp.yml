name: Diagnose CRM full audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-crm-full-audit-temp.yml'
      - 'tools/check_crm_order_completion_act.py'
      - 'crm/v4/assets/v4/order-act-preview-v1.js'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/index.html'
      - 'docs/CRM_ORDER_COMPLETION_ACT_ARCHITECTURE_2026-07-10.md'
      - 'docs/CRM_ORDER_COMPLETION_ACT_MANUAL_TEST_2026-07-10.md'

permissions:
  contents: write

jobs:
  capture-completion-act-check:
    if: github.head_ref == 'feat/crm-v4-command-transition-registry-2026-07-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-v4-command-transition-registry-2026-07-10

      - name: Capture checker output
        shell: bash
        run: |
          set +e
          python3 tools/check_crm_order_completion_act.py > /tmp/completion-act-check.txt 2>&1
          status=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$status"
            cat /tmp/completion-act-check.txt
          } > diagnostics/completion-act-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/completion-act-check.txt
          git commit -m 'Capture completion act checker diagnostic'
          git push origin HEAD:feat/crm-v4-command-transition-registry-2026-07-10
