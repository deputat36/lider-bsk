name: Public calculation checklist CSS check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chto-nuzhno-dlya-rascheta.html'
      - 'assets/public-calculation-checklist.css'
      - 'tools/check_public_calculation_checklist_css.py'
      - 'docs/PUBLIC_CALCULATION_CHECKLIST_CSS_MIGRATION_2026-07-13.md'
      - '.github/workflows/public-calculation-checklist-css-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'chto-nuzhno-dlya-rascheta.html'
      - 'assets/public-calculation-checklist.css'
      - 'tools/check_public_calculation_checklist_css.py'
      - 'docs/PUBLIC_CALCULATION_CHECKLIST_CSS_MIGRATION_2026-07-13.md'
      - '.github/workflows/public-calculation-checklist-css-check.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate calculation checklist CSS migration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_public_calculation_checklist_css.py 2>&1 | tee public-calculation-checklist-css-report.txt
      - name: Upload calculation checklist report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-calculation-checklist-css-report
          path: public-calculation-checklist-css-report.txt
          if-no-files-found: error
