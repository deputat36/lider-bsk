name: Public business advertising CSS check

on:
  push:
    branches: [main]
    paths:
      - 'reklama-dlya-biznesa.html'
      - 'assets/public-business-advertising.css'
      - 'tools/check_public_business_advertising_css.py'
      - '.github/workflows/public-business-advertising-css-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reklama-dlya-biznesa.html'
      - 'assets/public-business-advertising.css'
      - 'tools/check_public_business_advertising_css.py'
      - '.github/workflows/public-business-advertising-css-check.yml'

jobs:
  validate-public-business-advertising-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate business advertising page assets and content
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_business_advertising_css.py
