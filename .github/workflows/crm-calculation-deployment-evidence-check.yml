name: CRM calculation deployment evidence check

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/SUPABASE_STAGING_CALCULATION_VERSION_DEPLOYMENT_2026-07-15.md'
      - 'tools/check_crm_calculation_deployment_evidence.py'
      - 'supabase/config.toml'
      - 'supabase/functions/leader-crm-calculations/**'
      - 'supabase/staging-migrations/20260715_04_calculation_version_install.sql'
      - 'supabase/staging-migrations/20260715_05_calculation_version_grant_hardening.sql'
      - 'supabase/staging-migrations/20260715_06_calculation_version_fk_indexes.sql'
      - 'supabase/staging-tests/20260715_calculation_version_acceptance.sql'
      - 'supabase/staging-tests/20260715_calculation_version_safe_response.sql'
      - '.github/workflows/crm-calculation-deployment-evidence-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/SUPABASE_STAGING_CALCULATION_VERSION_DEPLOYMENT_2026-07-15.md'
      - 'tools/check_crm_calculation_deployment_evidence.py'
      - 'supabase/config.toml'
      - 'supabase/functions/leader-crm-calculations/**'
      - 'supabase/staging-migrations/20260715_04_calculation_version_install.sql'
      - 'supabase/staging-migrations/20260715_05_calculation_version_grant_hardening.sql'
      - 'supabase/staging-migrations/20260715_06_calculation_version_fk_indexes.sql'
      - 'supabase/staging-tests/20260715_calculation_version_acceptance.sql'
      - 'supabase/staging-tests/20260715_calculation_version_safe_response.sql'
      - '.github/workflows/crm-calculation-deployment-evidence-check.yml'

permissions:
  contents: read

jobs:
  validate-calculation-deployment-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile deployment evidence checker
        run: python3 -m py_compile tools/check_crm_calculation_deployment_evidence.py

      - name: Validate staging deployment evidence and production boundary
        run: python3 tools/check_crm_calculation_deployment_evidence.py
