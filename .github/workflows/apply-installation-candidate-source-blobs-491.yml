name: Apply installation candidate source blobs 491

on:
  push:
    branches: [agent/144-unified-contractor-quote]
    paths:
      - 'tools/patch_installation_candidate_source_blobs_491.py'
      - '.github/workflows/apply-installation-candidate-source-blobs-491.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/144-unified-contractor-quote
          fetch-depth: 0
      - name: Refresh pinned source blobs
        run: python3 tools/patch_installation_candidate_source_blobs_491.py
      - name: Validate candidate generation
        run: |
          python3 -m json.tool contracts/crm-installation-production-frontend-candidate-v1.json >/dev/null
          python3 tools/generate_crm_installation_production_frontend_candidate.py
      - name: Commit guard refresh
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_crm_installation_production_frontend_candidate.py contracts/crm-installation-production-frontend-candidate-v1.json
          git commit -m 'Refresh installation candidate source blob guards'
          git push origin HEAD:agent/144-unified-contractor-quote
