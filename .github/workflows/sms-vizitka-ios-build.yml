name: Build iOS SMS Vizitka

on:
  push:
    branches: ["sms-vizitka-ios-build"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        shell: bash
        run: |
          rm -rf /tmp/ios-work
          cat ios/sms-card-source/part*.b64 > /tmp/ios-source.b64
          base64 -D -i /tmp/ios-source.b64 -o /tmp/ios-source.zip
          echo "f47040eff92721799ff99c580c52178b20a6cdd918bac0476577e7a8206be1af  /tmp/ios-source.zip" | shasum -a 256 -c -
          unzip -q /tmp/ios-source.zip -d /tmp/ios-work

          cp ios/sms-card-patches/SettingsView.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Views/SettingsView.swift
          cp ios/sms-card-patches/EtazhiSMSVizitkaApp.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/App/EtazhiSMSVizitkaApp.swift
          cp ios/sms-card-patches/MessageComposeView.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Services/MessageComposeView.swift
          cp ios/sms-card-patches/SMSLength.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Services/SMSLength.swift
          cp ios/sms-card-patches/AppStore.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Services/AppStore.swift
          cp ios/sms-card-patches/SendView.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Views/SendView.swift
          cp ios/sms-card-patches/HistoryView.swift /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Views/HistoryView.swift
          cp ios/sms-card-patches/project.yml /tmp/ios-work/etagi-sms-card-ios/project.yml
          cp ios/sms-card-patches/Info.plist /tmp/ios-work/etagi-sms-card-ios/SMSVizitka/Resources/Info.plist

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv /tmp/ios-venv
          /tmp/ios-venv/bin/python -m pip install --upgrade pip
          /tmp/ios-venv/bin/python -m pip install pillow

      - name: Generate app icon assets
        run: /tmp/ios-venv/bin/python ios/sms-card-patches/generate_assets.py

      - name: Generate Xcode project
        working-directory: /tmp/ios-work/etagi-sms-card-ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: /tmp/ios-work/etagi-sms-card-ios
        run: |
          xcodebuild \
            -project EtazhiSMSVizitka.xcodeproj \
            -scheme EtazhiSMSVizitka \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for physical iPhone
        working-directory: /tmp/ios-work/etagi-sms-card-ios
        run: |
          xcodebuild \
            -project EtazhiSMSVizitka.xcodeproj \
            -scheme EtazhiSMSVizitka \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build-device/EtazhiSMSVizitka.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Validate release metadata
        working-directory: /tmp/ios-work/etagi-sms-card-ios
        shell: bash
        run: |
          APP_PLIST="build-device/EtazhiSMSVizitka.xcarchive/Products/Applications/Этажи СМС Визитка.app/Info.plist"
          test -f "$APP_PLIST"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          test "$VERSION" = "0.2.1"
          test "$BUILD" = "3"
          test -f "SMSVizitka/Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png"
          echo "Validated version $VERSION ($BUILD) and AppIcon assets."

      - name: Package release artifacts
        working-directory: /tmp/ios-work
        shell: bash
        run: |
          rm -rf /tmp/ios-package
          mkdir -p /tmp/ios-package

          rsync -a \
            --exclude build-simulator \
            --exclude build-device \
            etagi-sms-card-ios/ \
            /tmp/ios-package/etagi-sms-card-ios/

          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/ios-package/etagi-sms-card-ios \
            Etazhi-SMS-Vizitka-iOS-v0.2.1-Xcode-ready.zip

          APP_PATH="$(find etagi-sms-card-ios/build-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            Etazhi-SMS-Vizitka-iOS-v0.2.1-simulator-app.zip

          ditto -c -k --sequesterRsrc --keepParent \
            etagi-sms-card-ios/build-device/EtazhiSMSVizitka.xcarchive \
            Etazhi-SMS-Vizitka-iOS-v0.2.1-unsigned-device-archive.zip

      - name: Upload Xcode-ready project
        uses: actions/upload-artifact@v4
        with:
          name: Etazhi-SMS-Vizitka-iOS-v0.2.1-Xcode-ready
          path: /tmp/ios-work/Etazhi-SMS-Vizitka-iOS-v0.2.1-Xcode-ready.zip
          if-no-files-found: error

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Etazhi-SMS-Vizitka-iOS-v0.2.1-Simulator
          path: /tmp/ios-work/Etazhi-SMS-Vizitka-iOS-v0.2.1-simulator-app.zip
          if-no-files-found: error

      - name: Upload unsigned device archive
        uses: actions/upload-artifact@v4
        with:
          name: Etazhi-SMS-Vizitka-iOS-v0.2.1-Device-Archive
          path: /tmp/ios-work/Etazhi-SMS-Vizitka-iOS-v0.2.1-unsigned-device-archive.zip
          if-no-files-found: error
