name: Public simple service CSS check

on:
  push:
    branches: [main]
    paths:
      - 'socseti-kontent.html'
      - 'dizayn-maketov.html'
      - 'logotip-firmennyy-stil.html'
      - 'yandex-karty-2gis.html'
      - 'bannery-borisoglebsk.html'
      - 'tablichki-borisoglebsk.html'
      - 'vyveski-borisoglebsk.html'
      - 'pechat-na-plenke-borisoglebsk.html'
      - 'oformlenie-vitrin-borisoglebsk.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'nakleyki-plotternaya-rezka-borisoglebsk.html'
      - 'assets/public-simple-service.css'
      - 'assets/packages-link.js'
      - 'assets/brand/**'
      - 'tools/test_public_homepage_browser.mjs'
      - 'tools/check_public_simple_service_css.py'
      - '.github/workflows/public-simple-service-css-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'socseti-kontent.html'
      - 'dizayn-maketov.html'
      - 'logotip-firmennyy-stil.html'
      - 'yandex-karty-2gis.html'
      - 'bannery-borisoglebsk.html'
      - 'tablichki-borisoglebsk.html'
      - 'vyveski-borisoglebsk.html'
      - 'pechat-na-plenke-borisoglebsk.html'
      - 'oformlenie-vitrin-borisoglebsk.html'
      - 'outdoor-advertising-borisoglebsk.html'
      - 'nakleyki-plotternaya-rezka-borisoglebsk.html'
      - 'assets/public-simple-service.css'
      - 'assets/packages-link.js'
      - 'assets/brand/**'
      - 'tools/test_public_homepage_browser.mjs'
      - 'tools/check_public_simple_service_css.py'
      - '.github/workflows/public-simple-service-css-check.yml'

jobs:
  validate-shared-simple-service-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate eleven service pages and shared stylesheet
        run: python3 tools/check_public_simple_service_css.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check sign landing at five widths without production writes
        run: node tools/test_public_homepage_browser.mjs --signs
      - name: Upload sign screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-signs-browser
          path: artifacts/public-homepage/
          retention-days: 3
