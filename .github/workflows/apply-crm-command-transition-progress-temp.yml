name: Apply CRM command transition progress

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-crm-command-transition-progress-temp.yml'
      - 'tools/update_crm_command_transition_progress.py'

permissions:
  contents: write

jobs:
  apply-progress:
    if: github.head_ref == 'feat/crm-v4-command-transition-registry-2026-07-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-v4-command-transition-registry-2026-07-10

      - name: Apply and validate progress update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/update_crm_command_transition_progress.py
          test "$(python3 tools/update_crm_command_transition_progress.py)" = "already-applied"
          python3 tools/check_crm_v4_command_transition_registry.py
          python3 tools/check_crm_site_audit_execution_progress.py
          git diff --check

      - name: Commit progress update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CRM_SITE_AUDIT_EXECUTION_PROGRESS_2026-07-10.md; then
            echo 'No progress changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CRM_SITE_AUDIT_EXECUTION_PROGRESS_2026-07-10.md
          git commit -m 'Track CRM command transition registry progress'
          git push origin HEAD:feat/crm-v4-command-transition-registry-2026-07-10
