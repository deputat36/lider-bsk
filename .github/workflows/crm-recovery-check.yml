name: CRM recovery regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/quote-*.js'
      - 'crm/v4/assets/v4/catalog-management*.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/calculation-catalog-create-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'supabase/functions/leader-crm-quotes/**'
      - 'supabase/functions/leader-crm-catalog/**'
      - 'tools/test_catalog_access.mjs'
      - 'supabase/staging-recovered/**'
      - 'tools/test_crm_recovery_browser.mjs'
      - 'tools/test_offer_card_browser.mjs'
      - 'crm/v4/assets/v4/offer-order-create-v1.js'
      - 'crm/v4/assets/v4/offer-*.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'supabase/functions/leader-crm-offer-transitions/**'
      - 'supabase/migrations/20261031180000_leader_offer_editor_v1.sql'
      - 'supabase/staging-tests/20261031_offer_editor_acceptance.sql'
      - 'tools/build_offer_edit_rpc_test.py'
      - 'tools/test_offer_edit.mjs'
      - 'tools/test_offer_operations_edge.mjs'
      - 'tools/test_quote_workspace.mjs'
      - 'supabase/production-candidates/leader_quote_workspace_v1.sql'
      - 'tools/build_quote*'
      - 'tools/recovery/**'
      - 'tools/test_leader_data_restore.py'
      - '.github/workflows/crm-recovery-check.yml'
  push:
    branches: [main]
    paths:
      - 'crm/v4/index.html'
      - 'crm/v4/assets/v4/quote-*.js'
      - 'crm/v4/assets/v4/catalog-management*.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/calculation-catalog-create-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'supabase/functions/leader-crm-quotes/**'
      - 'supabase/functions/leader-crm-catalog/**'
      - 'tools/test_catalog_access.mjs'
      - 'supabase/staging-recovered/**'
      - 'tools/test_crm_recovery_browser.mjs'
      - 'tools/test_offer_card_browser.mjs'
      - 'crm/v4/assets/v4/offer-order-create-v1.js'
      - 'crm/v4/assets/v4/offer-*.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'supabase/functions/leader-crm-offer-transitions/**'
      - 'supabase/migrations/20261031180000_leader_offer_editor_v1.sql'
      - 'supabase/staging-tests/20261031_offer_editor_acceptance.sql'
      - 'tools/build_offer_edit_rpc_test.py'
      - 'tools/test_offer_edit.mjs'
      - 'tools/test_offer_operations_edge.mjs'
      - 'tools/test_quote_workspace.mjs'
      - 'supabase/production-candidates/leader_quote_workspace_v1.sql'
      - 'tools/build_quote*'
      - 'tools/recovery/**'
      - 'tools/test_leader_data_restore.py'
      - '.github/workflows/crm-recovery-check.yml'
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
      options: --ipc=host
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quote models and transport
        run: |
          node tools/test_quote_workspace.mjs
          node tools/test_calculation_catalog_create_v1.mjs
          node tools/test_catalog_management_staging_transport_v1.mjs
          node tools/test_catalog_access.mjs
          node --check crm/v4/assets/v4/quote-workspace-v1.js
          node tools/test_offer_edit.mjs
          node tools/test_offer_transition.mjs
          node --experimental-strip-types tools/test_offer_operations_edge.mjs
      - name: Install pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Real editors and calculator with blocked external HTTP
        run: node tools/test_crm_recovery_browser.mjs
      - name: Offer card and finance field permissions
        run: node tools/test_offer_card_browser.mjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-recovery
          path: |
            artifacts/crm-recovery/
            artifacts/offer-card/
          if-no-files-found: warn
          retention-days: 7

  quote-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: isolated-ci-only, POSTGRES_DB: quotes_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_quote_rpc_test.py
      - run: psql -h localhost -U postgres -d quotes_test -v ON_ERROR_STOP=1 -f build/quote-rpc-test.sql
        env: {PGPASSWORD: isolated-ci-only}
      - name: Exercise actual offer edit migration and server permissions in a separate database
        run: |
          python3 tools/build_offer_edit_rpc_test.py
          createdb -h localhost -U postgres leader_offer_editor_test
          psql -h localhost -U postgres -d leader_offer_editor_test -v ON_ERROR_STOP=1 -f build/offer-edit-rpc-test.sql
        env: {PGPASSWORD: isolated-ci-only}

      - name: Restore synthetic typed data and cyclic FKs in an isolated database
        run: |
          createdb -h localhost -U postgres leader_restore_test
          python3 tools/test_leader_data_restore.py
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: isolated-ci-only
          LEADER_RESTORE_NATIVE_TEST: '1'
