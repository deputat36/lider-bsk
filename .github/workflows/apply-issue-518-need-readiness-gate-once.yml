name: Apply issue 518 need readiness gate once

on:
  push:
    branches: [agent/518-need-calculation-readiness-gate-v1]
    paths:
      - 'tools/apply_issue_518_need_calculation_readiness_gate.py'
      - '.github/workflows/apply-issue-518-need-readiness-gate-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/518-need-calculation-readiness-gate-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source patch
        run: python3 tools/apply_issue_518_need_calculation_readiness_gate.py
      - name: Focused checks
        run: |
          node --check crm/v4/assets/v4/needs.js
          node --check crm/v4/assets/v4/need-calculation-readiness-v1.js
          node tools/test_need_calculation_readiness_v1.mjs
          python3 tools/check_crm_need_calculation_readiness_gate.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/needs.js crm/v4/assets/v4/crm-v4-tab-loader-v1.js
          git commit -m 'Add soft need readiness gate before calculation'
          git push origin HEAD:agent/518-need-calculation-readiness-gate-v1
