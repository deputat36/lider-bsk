name: Apply request CSS and v5 patch

on:
  push:
    branches:
      - 'fix/public-request-css-v5-2026-07-12'
    paths:
      - 'tools/apply_request_css_v5_patch.py'
      - 'tools/check_public_request_css_v5.py'
      - '.github/workflows/apply-request-css-v5-patch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_request_css_v5_patch.py'
      - 'tools/check_public_request_css_v5.py'
      - '.github/workflows/apply-request-css-v5-patch.yml'

permissions:
  contents: write

jobs:
  apply-guarded-request-patch:
    if: github.event_name == 'push' || github.head_ref == 'fix/public-request-css-v5-2026-07-12'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/public-request-css-v5-2026-07-12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-request-css-v5-2026-07-12
          fetch-depth: 0

      - name: Extract request CSS and synchronize v5 contracts
        run: python3 tools/apply_request_css_v5_patch.py

      - name: Validate diff
        run: git diff --check

      - name: Validate request page CSS and source copy
        id: request_check
        shell: bash
        run: |
          set +e
          python3 tools/check_public_request_css_v5.py > /tmp/request-check.log 2>&1
          status=$?
          cat /tmp/request-check.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit request checker diagnostic
        if: steps.request_check.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/diagnostics
          diagnostic="docs/diagnostics/request-css-v5-${GITHUB_RUN_ID}.txt"
          cp /tmp/request-check.log "$diagnostic"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostic"
          git commit -m "Record request CSS checker diagnostic ${GITHUB_RUN_ID}"
          git push origin HEAD:"$TARGET_BRANCH"
          exit 1

      - name: Validate complete public v5 coverage
        if: steps.request_check.outputs.status == '0'
        run: python3 tools/check_public_lead_form_cache_v5_partial.py

      - name: Validate request and homepage SEO contracts
        if: steps.request_check.outputs.status == '0'
        run: python3 tools/check_public_v5_landing_seo_contract.py

      - name: Validate public CI registry
        if: steps.request_check.outputs.status == '0'
        run: python3 tools/check_public_ci_workflows.py

      - name: Validate JavaScript syntax
        if: steps.request_check.outputs.status == '0'
        run: |
          node --check assets/public-lead-reference-v1.js
          node --check assets/public-lead-form.js

      - name: Commit request page migration
        if: steps.request_check.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add request.html assets/public-request.css \
            .github/workflows/request-reference-check.yml \
            .github/workflows/public-request-seo-check.yml \
            .github/workflows/public-site-audit-check.yml \
            .github/workflows/static-checks.yml
          git commit -m 'Extract request CSS and move public form to v5'
          git push origin HEAD:"$TARGET_BRANCH"
