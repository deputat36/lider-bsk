name: Apply request CSS and v5 patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_request_css_v5_patch.py'
      - 'tools/check_public_request_css_v5.py'
      - '.github/workflows/apply-request-css-v5-patch.yml'

permissions:
  contents: write

concurrency:
  group: request-css-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-guarded-request-patch:
    if: github.head_ref == 'fix/public-request-css-v5-2026-07-12'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/public-request-css-v5-2026-07-12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-request-css-v5-2026-07-12
          fetch-depth: 0

      - name: Extract request CSS and update source copy
        run: python3 tools/apply_request_css_v5_patch.py

      - name: Validate diff
        run: git diff --check

      - name: Validate request page CSS and source copy
        run: python3 tools/check_public_request_css_v5.py

      - name: Validate complete public v5 coverage
        run: python3 tools/check_public_lead_form_cache_v5_partial.py

      - name: Validate request and homepage SEO contracts
        run: python3 tools/check_public_v5_landing_seo_contract.py

      - name: Validate public CI registry
        run: python3 tools/check_public_ci_workflows.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/public-lead-reference-v1.js
          node --check assets/public-lead-form.js

      - name: Commit request page migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add request.html assets/public-request.css
          git commit -m 'Extract request CSS and move public form to v5'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
