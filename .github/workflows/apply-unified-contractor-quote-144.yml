name: Apply unified contractor quote 144

on:
  push:
    branches: [agent/144-unified-contractor-quote]
    paths:
      - 'tools/patch_unified_contractor_quote_144.py'
      - '.github/workflows/apply-unified-contractor-quote-144.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/144-unified-contractor-quote
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/patch_unified_contractor_quote_144.py
      - name: Validate syntax
        run: |
          node --check crm/v4/assets/v4/calculation-contractor-quote-model-v1.js
          node --check crm/v4/assets/v4/calculations.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
          node tools/test_calculation_contractor_quote_model_v1.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/calculations.js crm/v4/assets/v4/crm-v4-tab-loader-v1.js crm/v4/index.html
          git commit -m 'Unify contractor quote inside calculation builder'
          git push origin HEAD:agent/144-unified-contractor-quote
