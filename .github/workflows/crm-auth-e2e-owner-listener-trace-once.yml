name: CRM authenticated E2E owner listener trace once

on:
  push:
    branches:
      - agent/487-authenticated-staging-e2e
    paths:
      - 'tools/run-crm-auth-e2e-owner-listener-trace-once.txt'

permissions:
  contents: write

concurrency:
  group: crm-auth-e2e-owner-listener-trace-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trace CRM ready listener boundaries in owner UI E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tools/run_crm_staging_authenticated_e2e.mjs')
          source = runner.read_text()

          old = "let progressSequence=0;function progress(name){try{const sequence=String(++progressSequence).padStart(4,'0');navigator.sendBeacon('/__crm_e2e_progress',sequence+':'+String(name).slice(0,75));}catch(_){}}progress('role_ui_boot');"
          new = "function progress(name){try{const sequence=String(globalThis.__crmE2eProgressSequence=(globalThis.__crmE2eProgressSequence||0)+1).padStart(4,'0');navigator.sendBeacon('/__crm_e2e_progress',sequence+':'+String(name).slice(0,75));}catch(_){}}progress('role_ui_boot');"
          if old in source:
              source = source.replace(old, new, 1)
          elif '__crmE2eProgressSequence' not in source:
              raise SystemExit('role_progress_sequence_anchor_mismatch')

          old = "<head><script>globalThis.__crmE2eFatalErrors=[];for(const kind of [\"error\",\"unhandledrejection\"])addEventListener(kind,()=>globalThis.__crmE2eFatalErrors.push(kind));</script>"
          new = "<head><script>globalThis.__crmE2eFatalErrors=[];globalThis.__crmE2eProgressSequence=0;globalThis.__crmE2eProgress=(name)=>{try{const sequence=String(globalThis.__crmE2eProgressSequence=(globalThis.__crmE2eProgressSequence||0)+1).padStart(4,\"0\");navigator.sendBeacon(\"/__crm_e2e_progress\",sequence+\":\"+String(name).slice(0,75));}catch(_){}};for(const kind of [\"error\",\"unhandledrejection\"])addEventListener(kind,()=>globalThis.__crmE2eFatalErrors.push(kind));const __crmNativeAdd=EventTarget.prototype.addEventListener;let __crmReadyListenerSeq=0;EventTarget.prototype.addEventListener=function(type,listener,options){if(type===\"leader-v4:crm-ready\"&&typeof listener===\"function\"){const index=++__crmReadyListenerSeq;const stack=String(new Error().stack||\"\").split(\"\\n\")[2]||\"\";const match=stack.match(/\\/([^/?#]+\\.js)(?:[?:]|$)/);const label=String(match?.[1]||\"listener_\"+index).replace(/[^a-z0-9_.-]/gi,\"_\").slice(0,42);const wrapped=function(...args){globalThis.__crmE2eProgress?.(\"crm_ready_enter:\"+index+\":\"+label);const result=listener.apply(this,args);globalThis.__crmE2eProgress?.(\"crm_ready_exit:\"+index+\":\"+label);return result;};return __crmNativeAdd.call(this,type,wrapped,options);}return __crmNativeAdd.call(this,type,listener,options);};</script>"
          if old in source:
              source = source.replace(old, new, 1)
          elif 'crm_ready_enter:' not in source:
              raise SystemExit('early_instrumentation_anchor_mismatch')

          runner.write_text(source)
          PY

          node --check tools/run_crm_staging_authenticated_e2e.mjs
          node --check tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          node tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          grep -q 'crm_ready_enter' tools/run_crm_staging_authenticated_e2e.mjs
          grep -q '__crmE2eProgressSequence' tools/run_crm_staging_authenticated_e2e.mjs
          git diff --check

      - name: Commit CRM ready listener tracing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_crm_staging_authenticated_e2e.mjs
          git diff --cached --quiet && { echo 'No patch to commit' >&2; exit 1; }
          git commit -m 'Trace owner CRM ready listener boundaries'
          git push origin HEAD:agent/487-authenticated-staging-e2e
