name: Apply installation loader pin 152

on:
  push:
    branches: [agent/152-catalog-management-read-v1]
    paths:
      - 'tools/patch_installation_loader_pin_152.py'
      - '.github/workflows/apply-installation-loader-pin-152.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/152-catalog-management-read-v1
          fetch-depth: 0
      - name: Apply deterministic loader pin update
        run: python3 tools/patch_installation_loader_pin_152.py
      - name: Validate candidate generator
        run: |
          python3 -m py_compile tools/generate_crm_installation_production_frontend_candidate.py
          python3 tools/generate_crm_installation_production_frontend_candidate.py
          python3 tools/check_crm_installation_production_frontend_candidate.py
      - name: Commit generated source pin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_crm_installation_production_frontend_candidate.py
          git commit -m 'Refresh installation candidate loader source pin'
          git push origin HEAD:agent/152-catalog-management-read-v1
