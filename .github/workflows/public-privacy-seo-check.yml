name: Public privacy page check

on:
  push:
    branches: [main]
    paths:
      - 'privacy.html'
      - 'assets/public-utility-pages.css'
      - 'tools/check_public_privacy_page.py'
      - 'docs/PUBLIC_UTILITY_PAGES_CSS_2026-07-15.md'
      - '.github/workflows/public-privacy-seo-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'privacy.html'
      - 'assets/public-utility-pages.css'
      - 'tools/check_public_privacy_page.py'
      - 'docs/PUBLIC_UTILITY_PAGES_CSS_2026-07-15.md'
      - '.github/workflows/public-privacy-seo-check.yml'

jobs:
  validate-privacy-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate privacy content, SEO and external CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_privacy_page.py
