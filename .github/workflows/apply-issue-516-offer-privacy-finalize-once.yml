# One-shot workflow; remove after successful finalization.
name: Apply issue 516 offer privacy UX finalizer once

on:
  push:
    branches: [agent/516-offer-privacy-ux-v1]
    paths:
      - 'tools/apply_issue_516_offer_privacy_ux_finalize.py'
      - '.github/workflows/apply-issue-516-offer-privacy-finalize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/516-offer-privacy-ux-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply finalizer
        run: python3 tools/apply_issue_516_offer_privacy_ux_finalize.py
      - name: Focused regressions
        run: |
          node --check crm/v4/assets/v4/offers.js
          node --check crm/v4/assets/v4/offer-client-privacy-v1.js
          node --check crm/v4/assets/v4/offer-print-brand-v4.js
          node tools/test_offer_client_privacy_v1.mjs
          node tools/test_offer_print_privacy_v1.mjs
          python3 tools/check_crm_offer_client_privacy_ux.py
      - name: Commit final source changes
        run: |
          if git diff --quiet; then
            echo 'No final source changes'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/offers.js crm/v4/index.html
          git commit -m 'Finalize commercial offer privacy UX'
          git push origin HEAD:agent/516-offer-privacy-ux-v1
