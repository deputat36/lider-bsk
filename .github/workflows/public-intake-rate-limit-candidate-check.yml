name: Public intake rate-limit candidate check

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'supabase/functions/leader-public-lead/rate-limit.ts'
      - 'supabase/production-candidates/20260724_02_public_intake_rate_limit_candidate.sql'
      - 'supabase/production-candidates/rollback/20260724_02_public_intake_rate_limit_candidate_rollback.sql'
      - 'contracts/public-intake-rate-limit-candidate-v1.json'
      - 'docs/PUBLIC_INTAKE_RATE_LIMIT_CANDIDATE_V1_2026-07-24.md'
      - 'docs/PUBLIC_INTAKE_SERVICE_ROLE_CUTOVER_CANDIDATE_V1_2026-07-24.md'
      - 'tools/check_public_intake_rate_limit_candidate.py'
      - '.github/workflows/public-intake-rate-limit-candidate-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/leader-public-lead/index.ts'
      - 'supabase/functions/leader-public-lead/rate-limit.ts'
      - 'supabase/production-candidates/20260724_02_public_intake_rate_limit_candidate.sql'
      - 'supabase/production-candidates/rollback/20260724_02_public_intake_rate_limit_candidate_rollback.sql'
      - 'contracts/public-intake-rate-limit-candidate-v1.json'
      - 'docs/PUBLIC_INTAKE_RATE_LIMIT_CANDIDATE_V1_2026-07-24.md'
      - 'docs/PUBLIC_INTAKE_SERVICE_ROLE_CUTOVER_CANDIDATE_V1_2026-07-24.md'
      - 'tools/check_public_intake_rate_limit_candidate.py'
      - '.github/workflows/public-intake-rate-limit-candidate-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only rate-limit candidate
        run: python3 tools/check_public_intake_rate_limit_candidate.py
      - name: Validate TypeScript syntax
        run: |
          node --experimental-strip-types --check supabase/functions/leader-public-lead/rate-limit.ts
          node --experimental-strip-types --check supabase/functions/leader-public-lead/index.ts
      - name: Confirm no production automation
        run: |
          ! grep -R --exclude='public-intake-rate-limit-candidate-check.yml' "supabase functions deploy leader-public-lead" .github/workflows
          ! grep -R --exclude='public-intake-rate-limit-candidate-check.yml' "supabase db push" .github/workflows
