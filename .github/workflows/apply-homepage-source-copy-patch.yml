name: Apply homepage source copy patch

on:
  push:
    branches:
      - 'fix/public-homepage-source-copy-2026-07-12'
    paths:
      - 'tools/apply_homepage_source_copy_patch.py'
      - '.github/workflows/apply-homepage-source-copy-patch.yml'

permissions:
  contents: write

jobs:
  apply-guarded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-homepage-source-copy-2026-07-12
          fetch-depth: 0

      - name: Apply exact source-copy replacements
        run: python3 tools/apply_homepage_source_copy_patch.py

      - name: Validate patched homepage
        run: |
          git diff --check
          python3 tools/check_public_homepage_source_copy.py

      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Homepage source copy is already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace internal homepage copy in source HTML'
          git push origin HEAD:fix/public-homepage-source-copy-2026-07-12
