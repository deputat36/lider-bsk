name: Apply core form cache v23

on:
  push:
    branches: [public-core-form-cache-v23]
    paths:
      - 'tools/bump_public_core_form_cache_v23.py'
      - '.github/workflows/apply-core-form-cache-v23.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/bump_public_core_form_cache_v23.py'
      - '.github/workflows/apply-core-form-cache-v23.yml'

permissions:
  contents: write

jobs:
  apply-core-cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply guarded replacements
        run: python3 tools/bump_public_core_form_cache_v23.py
      - name: Validate migrated pages and cache contracts
        run: |
          set -euo pipefail
          python3 tools/check_public_homepage_css_migration.py
          python3 tools/check_public_request_css_v5.py
          python3 tools/check_public_services_catalog.py
          python3 tools/check_public_prices_css.py
          python3 tools/check_public_contacts_assets.py
          python3 tools/check_all_public_form_cache_versions.py
          python3 tools/check_public_cache_docs_current.py
          git diff --check
      - name: Commit generated migration
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html request.html uslugi.html prices.html kontakty.html \
            tools/check_public_homepage_css_migration.py \
            tools/check_public_request_css_v5.py \
            tools/check_public_services_catalog.py \
            tools/check_public_prices_css.py \
            tools/check_public_contacts_assets.py \
            tools/check_all_public_form_cache_versions.py \
            tools/check_public_cache_docs_current.py \
            .github/workflows/public-cache-docs-current-check.yml
          if git diff --cached --quiet; then
            echo 'Core cache markers are already current.'
            exit 0
          fi
          git commit -m 'Bump core public form cache to v23'
          git push origin "HEAD:${TARGET_BRANCH}"
