name: CRM staging installation runtime smoke check

on:
  pull_request:
    paths:
      - 'supabase/staging-migrations/20260722_02_pg_net_smoke_transport.sql'
      - 'supabase/staging-migrations/20260722_03_installation_read_order_status_fix.sql'
      - 'supabase/staging-migrations/20260722_04_pg_net_smoke_transport_cleanup.sql'
      - 'supabase/staging-functions/leader-staging-installation-smoke-bootstrap/index.ts'
      - 'contracts/crm-staging-installation-runtime-smoke-v1.json'
      - 'contracts/crm-staging-installation-read-edge-v1.json'
      - 'contracts/crm-staging-installation-command-edge-v1.json'
      - 'contracts/crm-staging-installation-user-jwt-smoke-v1.json'
      - 'docs/SUPABASE_STAGING_INSTALLATION_USER_JWT_SMOKE_V1_2026-07-21.md'
      - 'tools/check_crm_staging_installation_runtime_smoke.py'
      - '.github/workflows/crm-staging-installation-runtime-smoke-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/staging-migrations/20260722_02_pg_net_smoke_transport.sql'
      - 'supabase/staging-migrations/20260722_03_installation_read_order_status_fix.sql'
      - 'supabase/staging-migrations/20260722_04_pg_net_smoke_transport_cleanup.sql'
      - 'supabase/staging-functions/leader-staging-installation-smoke-bootstrap/index.ts'
      - 'contracts/crm-staging-installation-runtime-smoke-v1.json'
      - 'contracts/crm-staging-installation-read-edge-v1.json'
      - 'contracts/crm-staging-installation-command-edge-v1.json'
      - 'contracts/crm-staging-installation-user-jwt-smoke-v1.json'
      - 'docs/SUPABASE_STAGING_INSTALLATION_USER_JWT_SMOKE_V1_2026-07-21.md'
      - 'tools/check_crm_staging_installation_runtime_smoke.py'
      - '.github/workflows/crm-staging-installation-runtime-smoke-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check permanently locked bootstrap
        run: deno check supabase/staging-functions/leader-staging-installation-smoke-bootstrap/index.ts
      - name: Compile evidence checker
        run: python3 -m py_compile tools/check_crm_staging_installation_runtime_smoke.py
      - name: Validate runtime evidence, cleanup and production boundary
        id: contract
        continue-on-error: true
        run: python3 tools/check_crm_staging_installation_runtime_smoke.py > installation-runtime-smoke-check.log 2>&1
      - name: Upload runtime smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-runtime-smoke-check-diagnostics
          path: installation-runtime-smoke-check.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail on contract error
        if: steps.contract.outcome != 'success'
        run: |
          cat installation-runtime-smoke-check.log
          exit 1
