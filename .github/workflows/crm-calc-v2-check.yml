name: CRM calc v2 check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-crm-calc-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate saved calculation review
        run: |
          node --check crm/v4/assets/v4/calculation-saved-review-model-v1.js
          node --check crm/v4/assets/v4/calculations-saved-tools-v2.js
          node tools/test_calculation_saved_review_model.mjs
      - name: Validate CRM calc v2 docs
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_calc_v2.py 2>&1 | tee saved-calculation-check.log
      - name: Upload temporary saved calculation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saved-calculation-check-diagnostics
          path: saved-calculation-check.log
          if-no-files-found: error
          retention-days: 1
      - name: Validate offer rules v2
        run: python3 tools/check_offer_rules_v2.py
      - name: Validate offer visibility integration doc
        run: python3 tools/check_offer_visibility_integration_doc.py
      - name: Validate catalog pricing rules
        run: python3 tools/check_catalog_pricing_rules.py
      - name: Validate catalog pricing helper
        run: python3 tools/check_catalog_pricing_helper.py
      - name: Validate catalog mapping
        run: python3 tools/check_catalog_mapping.py
      - name: Check calculations catalog id preservation
        run: |
          node --check crm/v4/assets/v4/calculations.js
          python3 tools/check_calculations_catalog_id.py
          node tools/test_calculations_catalog_id.mjs
