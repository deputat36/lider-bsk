name: Public local resource integrity check

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'banner/**'
      - 'signs/**'
      - 'auto-stickers/**'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'tools/check_public_local_resources.py'
      - 'docs/PUBLIC_LOCAL_RESOURCE_INTEGRITY_2026-07-13.md'
      - '.github/workflows/public-local-resource-integrity-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'banner/**'
      - 'signs/**'
      - 'auto-stickers/**'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'tools/check_public_local_resources.py'
      - 'docs/PUBLIC_LOCAL_RESOURCE_INTEGRITY_2026-07-13.md'
      - '.github/workflows/public-local-resource-integrity-check.yml'

jobs:
  validate-public-local-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public local links, assets and anchors
        id: integrity
        shell: bash
        run: |
          set +e
          python3 tools/check_public_local_resources.py > public-local-resource-report.txt 2>&1
          status=$?
          cat public-local-resource-report.txt
          exit "$status"
      - name: Upload local resource integrity report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-local-resource-report
          path: public-local-resource-report.txt
          if-no-files-found: error
