name: CRM staging authenticated E2E diagnostic relay

on:
  workflow_run:
    workflows:
      - CRM staging installation authenticated UI smoke runtime
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  relay:
    if: >-
      github.event.workflow_run.head_branch == 'agent/487-authenticated-staging-e2e' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download privacy-safe E2E evidence
        uses: actions/download-artifact@v4
        with:
          name: crm-staging-authenticated-e2e
          path: ${{ runner.temp }}/crm-e2e-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract allowlisted failure code
        id: failure
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/crm-e2e-evidence"
          FAILURE='authenticated_e2e_failed_without_safe_code'
          if [ -f "${LOG_DIR}/browser.log" ]; then
            CANDIDATE="$(grep -Eo 'chrome_browser_scenario_timeout:[A-Za-z0-9_:-]+|chrome_browser_scenario_stalled:[A-Za-z0-9_:-]+|browser_e2e_failed:[A-Za-z0-9_:-]+' "${LOG_DIR}/browser.log" | tail -n 1 || true)"
            if [[ "${CANDIDATE}" =~ ^(chrome_browser_scenario_timeout|chrome_browser_scenario_stalled|browser_e2e_failed):[A-Za-z0-9_:-]{1,180}$ ]]; then
              FAILURE="${CANDIDATE}"
            fi
          fi
          echo "code=${FAILURE}" >> "${GITHUB_OUTPUT}"

      - name: Report sanitized failure to issue 487
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_CODE: ${{ steps.failure.outputs.code }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA:0:12}"
          gh issue comment 487 --repo "${GITHUB_REPOSITORY}" --body "Authenticated staging E2E diagnostic: \`${FAILURE_CODE}\`. Runtime: ${RUN_URL}. Head: \`${SHORT_SHA}\`. Сообщение содержит только allowlisted stage/error code; credentials и synthetic marker не публикуются."