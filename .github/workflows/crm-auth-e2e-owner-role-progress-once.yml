name: CRM authenticated E2E owner role progress once

on:
  push:
    branches:
      - agent/487-authenticated-staging-e2e
    paths:
      - 'tools/run-crm-auth-e2e-owner-role-progress-once.txt'

permissions:
  contents: write

concurrency:
  group: crm-auth-e2e-owner-role-progress-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add owner role UI progress heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tools/run_crm_staging_authenticated_e2e.mjs')
          source = runner.read_text()

          old = "function roleBrowserSource(expectedRole) {"
          new = "export function roleBrowserSource(expectedRole) {"
          if source.count(old) != 1:
              raise SystemExit('owner_role_export_anchor_mismatch')
          source = source.replace(old, new, 1)

          old = "const clean=(value)=>String(value??'').trim();function assert(value,code){if(!value)throw new Error(code);}async function waitFor(check,code,timeout=45000){const started=Date.now();while(Date.now()-started<timeout){const value=await check();if(value)return value;await sleep(50);}throw new Error(code);}"
          new = "const clean=(value)=>String(value??'').trim();function assert(value,code){if(!value)throw new Error(code);}let progressSequence=0;function progress(name){try{const sequence=String(++progressSequence).padStart(4,'0');navigator.sendBeacon('/__crm_e2e_progress',sequence+':'+String(name).slice(0,75));}catch(_){}}progress('role_ui_boot');async function waitFor(check,code,timeout=45000){const started=Date.now();let heartbeatAt=started;while(Date.now()-started<timeout){const value=await check();if(value)return value;if(Date.now()-heartbeatAt>=5000){progress('role_ui_wait:'+code);heartbeatAt=Date.now();}await sleep(50);}throw new Error(code);}"
          if source.count(old) != 1:
              raise SystemExit('owner_role_wait_anchor_mismatch')
          source = source.replace(old, new, 1)

          old = "try{await waitFor(()=>document.getElementById('loginForm')&&!document.getElementById('loginForm').classList.contains('hidden'),'login_form_missing');const email=document.getElementById('loginEmail'),password=document.getElementById('loginPassword');"
          new = "try{progress('role_ui_login_wait');await waitFor(()=>document.getElementById('loginForm')&&!document.getElementById('loginForm').classList.contains('hidden'),'login_form_missing');progress('role_ui_login_form');const email=document.getElementById('loginEmail'),password=document.getElementById('loginPassword');"
          if source.count(old) != 1:
              raise SystemExit('owner_role_login_anchor_mismatch')
          source = source.replace(old, new, 1)

          old = "document.getElementById('loginBtn').click();await waitFor(()=>!document.getElementById('crmWorkspace')?.classList.contains('hidden')&&clean(document.getElementById('profileRole')?.textContent).toLowerCase()==='${expectedRole}','role_workspace_timeout');"
          new = "document.getElementById('loginBtn').click();progress('role_ui_login_submitted');await waitFor(()=>!document.getElementById('crmWorkspace')?.classList.contains('hidden')&&clean(document.getElementById('profileRole')?.textContent).toLowerCase()==='${expectedRole}','role_workspace_timeout');progress('role_ui_workspace:${expectedRole}');"
          if source.count(old) != 1:
              raise SystemExit('owner_role_workspace_anchor_mismatch')
          source = source.replace(old, new, 1)

          old = "for(const tab of ['leads','orders','order_control','finance_control','production','user_admin'])assert(visible(tab),'owner_tab_hidden:'+tab);document.querySelector('[data-v4-tab-button=\\\"user_admin\\\"]').click();await waitFor(()=>document.body.dataset.v4Tab==='user_admin','owner_user_admin_open_failed');"
          new = "for(const tab of ['leads','orders','order_control','finance_control','production','user_admin'])assert(visible(tab),'owner_tab_hidden:'+tab);progress('owner_tabs_visible');document.querySelector('[data-v4-tab-button=\\\"user_admin\\\"]').click();progress('owner_user_admin_clicked');await waitFor(()=>document.body.dataset.v4Tab==='user_admin','owner_user_admin_open_failed');progress('owner_user_admin_opened');"
          if source.count(old) != 1:
              raise SystemExit('owner_role_admin_anchor_mismatch')
          source = source.replace(old, new, 1)
          runner.write_text(source)

          test = Path('tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs')
          test_source = test.read_text()
          old = "  browserSource,\n  operatorPlan"
          new = "  browserSource,\n  roleBrowserSource,\n  operatorPlan"
          if test_source.count(old) != 1:
              raise SystemExit('owner_role_test_import_anchor_mismatch')
          test_source = test_source.replace(old, new, 1)

          anchor = "const syntax = spawnSync(process.execPath, ['--input-type=module', '--check'], { input: browserSource(), encoding: 'utf8' });\nassert.equal(syntax.status, 0, syntax.stderr);\n"
          addition = anchor + "const ownerRoleSource = roleBrowserSource('owner');\nconst ownerSyntax = spawnSync(process.execPath, ['--input-type=module', '--check'], { input: ownerRoleSource, encoding: 'utf8' });\nassert.equal(ownerSyntax.status, 0, ownerSyntax.stderr);\nassert.ok(ownerRoleSource.includes(\"progress('role_ui_boot')\"));\nassert.ok(ownerRoleSource.includes(\"progress('role_ui_login_submitted')\"));\nassert.ok(ownerRoleSource.includes(\"progress('owner_user_admin_clicked')\"));\nassert.ok(ownerRoleSource.includes(\"progress('owner_user_admin_opened')\"));\nassert.ok(ownerRoleSource.includes(\"progress('role_ui_wait:'+code)\"));\n"
          if test_source.count(anchor) != 1:
              raise SystemExit('owner_role_test_syntax_anchor_mismatch')
          test.write_text(test_source.replace(anchor, addition, 1))
          PY

          node --check tools/run_crm_staging_authenticated_e2e.mjs
          node --check tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          node tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --check

      - name: Commit owner role harness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_crm_staging_authenticated_e2e.mjs tools/test_crm_staging_authenticated_e2e_browser_launcher.mjs
          git diff --cached --quiet && { echo 'No patch to commit' >&2; exit 1; }
          git commit -m 'Harden owner role UI E2E heartbeat'
          git push origin HEAD:agent/487-authenticated-staging-e2e
