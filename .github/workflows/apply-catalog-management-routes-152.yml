name: Apply catalog management routes 152

on:
  push:
    branches: [agent/152-catalog-management-read-v1]
    paths:
      - 'tools/patch_catalog_management_routes_152.py'
      - '.github/workflows/apply-catalog-management-routes-152.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/152-catalog-management-read-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic catalog tab routing patch
        run: python3 tools/patch_catalog_management_routes_152.py
      - name: Validate catalog tab source
        run: |
          node --check crm/v4/assets/v4/catalog-management-model-v1.js
          node --check crm/v4/assets/v4/catalog-management-v1.js
          node --check crm/v4/assets/v4/role-tab-permissions-v1.js
          node --check crm/v4/assets/v4/crm-v4-expanded-menu-v1.js
          node --check crm/v4/assets/v4/crm-v4-tabs-lite.js
          node --check crm/v4/assets/v4/crm-navigation-route-v1.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
          node tools/test_catalog_management_model_v1.mjs
          python3 tools/check_catalog_management_v1.py
          python3 tools/check_crm_lazy_tab_loader.py
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No generated change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/role-tab-permissions-v1.js crm/v4/assets/v4/crm-v4-expanded-menu-v1.js crm/v4/assets/v4/crm-v4-tabs-lite.js crm/v4/assets/v4/crm-navigation-route-v1.js crm/v4/assets/v4/crm-v4-tab-loader-v1.js tools/check_crm_lazy_tab_loader.py
          git commit -m 'Route catalog management as lazy owner admin tab'
          git push origin HEAD:agent/152-catalog-management-read-v1
