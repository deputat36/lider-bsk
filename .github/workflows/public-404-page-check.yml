name: Public 404 page check

on:
  push:
    branches: [main]
    paths:
      - '404.html'
      - 'tools/check_public_404_page.py'
      - 'docs/PUBLIC_404_PAGE_2026-07-13.md'
      - '.github/workflows/public-404-page-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '404.html'
      - 'tools/check_public_404_page.py'
      - 'docs/PUBLIC_404_PAGE_2026-07-13.md'
      - '.github/workflows/public-404-page-check.yml'

jobs:
  validate-public-404-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branded recovery page
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_public_404_page.py
