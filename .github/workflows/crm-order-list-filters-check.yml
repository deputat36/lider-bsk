name: CRM order list filters check
on:
  push:
    branches: [main]
    paths: ['crm/v4/index.html', 'crm/v4/assets/v4/orders-fast-loader-v1.js', 'crm/v4/assets/v4/order-list-preferences-v1.js', 'tools/test_order_list_preferences.mjs', 'tools/check_crm_order_list_filters.py', '.github/workflows/crm-order-list-filters-check.yml']
  pull_request:
    branches: [main]
    paths: ['crm/v4/index.html', 'crm/v4/assets/v4/orders-fast-loader-v1.js', 'crm/v4/assets/v4/order-list-preferences-v1.js', 'tools/test_order_list_preferences.mjs', 'tools/check_crm_order_list_filters.py', '.github/workflows/crm-order-list-filters-check.yml']
jobs:
  order-list-filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check crm/v4/assets/v4/order-list-preferences-v1.js
          node --check crm/v4/assets/v4/orders-fast-loader-v1.js
          node tools/test_order_list_preferences.mjs
          python3 tools/check_crm_order_list_filters.py
