name: CRM management workload check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/management-workload-model-v1.js'
      - 'crm/v4/assets/v4/management-workload-panel-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'tools/test_management_workload.mjs'
      - 'tools/check_management_workload_dashboard.py'
      - 'docs/CRM_MANAGEMENT_WORKLOAD_SLA_MANUAL_TEST_2026-07-12.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-management-workload-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/management-workload-model-v1.js'
      - 'crm/v4/assets/v4/management-workload-panel-v1.js'
      - 'crm/v4/assets/v4/status-transitions-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'tools/test_management_workload.mjs'
      - 'tools/check_management_workload_dashboard.py'
      - 'docs/CRM_MANAGEMENT_WORKLOAD_SLA_MANUAL_TEST_2026-07-12.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-management-workload-check.yml'

jobs:
  validate-management-workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only workload and SLA dashboard
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/management-workload-model-v1.js
          node --check crm/v4/assets/v4/management-workload-panel-v1.js
          node --check crm/v4/assets/v4/site-cache-note-v1.js
          node --check tools/test_management_workload.mjs
          node tools/test_management_workload.mjs
          python3 tools/check_management_workload_dashboard.py
