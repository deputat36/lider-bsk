name: Temporary CRM site audit diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/*.js'
      - 'tools/*.py'
      - '.github/workflows/tmp-crm-site-full-audit-diagnostic.yml'

jobs:
  diagnose-full-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Roadmap
        run: python3 tools/check_crm_site_full_audit_roadmap.py
      - name: Execution progress
        run: python3 tools/check_crm_site_audit_execution_progress.py
      - name: Profile first boot
        run: python3 tools/check_crm_profile_first_boot.py
      - name: Role tab matrix
        run: python3 tools/check_crm_v4_role_tab_matrix.py
      - name: Production data minimization
        run: python3 tools/check_crm_v4_production_role_data_minimization.py
      - name: Operational quality
        run: python3 tools/check_crm_operational_quality_panel.py
      - name: Backend write inventory
        run: python3 tools/check_crm_v4_backend_write_inventory.py
      - name: Backend command contract
        run: python3 tools/check_crm_v4_backend_command_contract.py
      - name: Completion act
        run: python3 tools/check_crm_order_completion_act.py
      - name: Company settings
        run: python3 tools/check_crm_company_legal_settings.py
      - name: Status registry
        run: python3 tools/check_crm_status_transition_registry.py
      - name: Public intake plan
        run: python3 tools/check_public_intake_cutover_plan.py
      - name: Server action RBAC
        run: python3 tools/check_crm_server_action_rbac_spec.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/public-lead-audit-v1.js
          node --check crm/v4/assets/v4/site-cache-note-v1.js
          node --check crm/v4/assets/v4/status-transitions-v1.js
          node --check tools/test_crm_status_transitions.mjs
          node tools/test_crm_status_transitions.mjs
