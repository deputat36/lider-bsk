name: CRM v4 command transition registry check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/crm-v4-command-transition-registry-v1.json'
      - 'docs/CRM_V4_COMMAND_TRANSITION_REGISTRY_2026-07-10.md'
      - 'tools/check_crm_v4_command_transition_registry.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'crm/v4/assets/v4/orders.js'
      - 'crm/v4/assets/v4/production-job-card-v2.js'
      - 'crm/v4/assets/v4/installation-job-card-v2.js'
      - '.github/workflows/crm-v4-command-transition-registry-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/crm-v4-command-transition-registry-v1.json'
      - 'docs/CRM_V4_COMMAND_TRANSITION_REGISTRY_2026-07-10.md'
      - 'tools/check_crm_v4_command_transition_registry.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'crm/v4/assets/v4/orders.js'
      - 'crm/v4/assets/v4/production-job-card-v2.js'
      - 'crm/v4/assets/v4/installation-job-card-v2.js'
      - '.github/workflows/crm-v4-command-transition-registry-check.yml'

jobs:
  validate-command-transition-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry JSON and contract graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool contracts/crm-v4-command-transition-registry-v1.json >/dev/null
          python3 tools/check_crm_v4_command_transition_registry.py
          node --check crm/v4/assets/v4/action-permissions-v1.js
