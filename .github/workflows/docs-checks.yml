name: Docs checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-crm-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current project documentation
        shell: bash
        run: |
          set -euo pipefail
          access_doc='docs/CRM_V4_TEST_ACCESS.md'
          checklist='docs/CRM_V4_TESTER_CHECKLIST.md'
          onboarding='docs/CRM_ADMIN_TESTER_ONBOARDING.md'
          next_steps='docs/NEXT_SAFE_STEPS.md'
          status_doc='docs/STATUS.md'
          manual_checklist='docs/MANUAL_TEST_CHECKLIST.md'
          decisions_doc='docs/DECISIONS.md'
          static_runbook='docs/STATIC_CHECKS_RUNBOOK.md'
          browser_report='docs/CRM_V4_BROWSER_TEST_REPORT.md'
          audit_doc='docs/PUBLIC_LEAD_AUDIT.md'
          public_site_audit='docs/PUBLIC_SITE_AUDIT.md'
          audit_v8_check='docs/CRM_V4_AUDIT_V8_CHECK.md'
          issue_template='.github/ISSUE_TEMPLATE/crm-v4-browser-test.md'
          current_ops_check='tools/check_current_public_ops_docs.py'

          for file in "$access_doc" "$checklist" "$onboarding" "$next_steps" "$status_doc" "$manual_checklist" "$decisions_doc" "$static_runbook" "$browser_report" "$audit_doc" "$public_site_audit" "$audit_v8_check" "$issue_template" "$current_ops_check"; do
            test -f "$file"
          done

          grep -Fq 'https://deputat36.github.io/lidercalculator/app-v4.html' "$access_doc"
          grep -Fq 'leader_user_profiles' "$access_doc"
          grep -Fq 'user_metadata' "$access_doc"
          grep -Fq 'is_active = false' "$access_doc"

          grep -Fq 'Ctrl + F5' "$checklist"
          grep -Fq 'Проверить CRM' "$checklist"
          grep -Fq 'Аудит заявок' "$checklist"
          grep -Fq 'request_id' "$checklist"
          grep -Fq 'docs/CRM_V4_BROWSER_TEST_REPORT.md' "$checklist"
          grep -Fq 'https://www.lider-bsk.ru/request.html' "$checklist"
          grep -Fq 'Тест CRM v4 audit v8' "$checklist"
          grep -Fq 'Скопировать request_id' "$checklist"
          grep -Fq 'docs/CRM_V4_AUDIT_V8_CHECK.md' "$checklist"
          if grep -Fq 'Тест CRM v4 audit v7' "$checklist"; then
            echo 'CRM_V4_TESTER_CHECKLIST.md must use audit v8 wording.' >&2
            exit 1
          fi

          grep -Fq 'Проверка аудита публичной заявки v8' "$audit_v8_check"
          grep -Fq 'Тест CRM v4 audit v8' "$audit_v8_check"
          grep -Fq 'Скопировать request_id' "$audit_v8_check"
          grep -Fq 'Проверить request_id' "$audit_v8_check"
          grep -Fq 'Проверить цепочку' "$audit_v8_check"
          grep -Fq 'С request_id' "$audit_v8_check"
          grep -Fq 'Без request_id' "$audit_v8_check"
          grep -Fq 'Открыть заявку' "$audit_v8_check"
          grep -Fq 'Цепочка полная' "$audit_v8_check"
          grep -Fq 'Дубль' "$audit_v8_check"

          grep -Fq 'ADR-008. Идемпотентность публичных заявок и явный audit дублей' "$decisions_doc"
          grep -Fq 'ADR-009. Трассировка request_id через read-only view' "$decisions_doc"
          grep -Fq 'ADR-012. Публичный сайт не раскрывает внутреннюю терминологию и неподтверждённый NAP' "$decisions_doc"
          grep -Fq 'ADR-013. Browser E2E публичной заявки является approval-gated production-действием' "$decisions_doc"
          grep -Fq 'leader_request_trace' "$decisions_doc"
          grep -Fq 'security_invoker = true' "$decisions_doc"
          grep -Fq 'request_id_conflict' "$decisions_doc"
          if grep -Fq 'ignore-duplicates' "$decisions_doc"; then
            echo 'DECISIONS.md must describe explicit duplicate audit handling.' >&2
            exit 1
          fi

          python3 "$current_ops_check"

          grep -Fq 'Дата: 2026-06-29.' "$static_runbook"
          grep -Fq 'leader-public-lead v9' "$static_runbook"
          grep -Fq 'leader-crm-leads v12' "$static_runbook"
          grep -Fq 'leader_request_trace' "$static_runbook"
          grep -Fq 'public-lead-audit-v1.js?v=20260629-trace-button-1' "$static_runbook"
          grep -Fq 'public-lead-audit-helper-v1.js?v=20260629-trace-open-lead-1' "$static_runbook"
          grep -Fq 'public-lead-audit-summary-v1.js?v=20260629-request-summary-1' "$static_runbook"
          grep -Fq 'Проверить request_id' "$static_runbook"
          grep -Fq 'Проверить цепочку' "$static_runbook"
          grep -Fq 'С request_id' "$static_runbook"
          grep -Fq 'Без request_id' "$static_runbook"
          grep -Fq 'Открыть заявку' "$static_runbook"
          grep -Fq 'Цепочка полная' "$static_runbook"

          grep -Fq 'kvmbsk@yandex.ru' "$onboarding"
          grep -Fq 'роль admin' "$onboarding"
          grep -Fq 'leader_user_profiles.is_active = false' "$onboarding"

          grep -Fq 'Дата: 2026-06-28.' "$manual_checklist"
          grep -Fq 'Доступ и роли' "$manual_checklist"
          grep -Fq 'auth.js?v=20260628-access-label-1' "$manual_checklist"
          grep -Fq 'user-admin-v1.js?v=20260628-access-label-1' "$manual_checklist"
          grep -Fq 'crm-v4-expanded-menu-v1.js?v=20260628-access-label-1' "$manual_checklist"
          grep -Fq 'marker `20260628-access-label-1`' "$manual_checklist"
          if grep -Fq 'auth.js?v=20260627-access-3' "$manual_checklist"; then
            echo 'MANUAL_TEST_CHECKLIST.md must use current access label marker.' >&2
            exit 1
          fi

          grep -Fq '`v9`' "$audit_doc"
          grep -Fq 'v8 audit contract' "$audit_doc"
          grep -Fq 'duplicate' "$audit_doc"
          grep -Fq 'Скопировать request_id' "$audit_doc"
          grep -Fq 'leader_public_lead_audit_insert_failed' "$audit_doc"
          grep -Fq 'rollback-smoke-test' "$audit_doc"
          if grep -Fq '`v7`' "$audit_doc"; then
            echo 'PUBLIC_LEAD_AUDIT.md must describe the v9 historical audit baseline, not v7.' >&2
            exit 1
          fi

          grep -Fq 'Обновление статуса: 2026-06-29.' "$public_site_audit"
          grep -Fq 'leader-public-lead v9' "$public_site_audit"
          grep -Fq 'v8 audit contract' "$public_site_audit"
          grep -Fq 'После PR #102' "$public_site_audit"
          grep -Fq 'После PR #103' "$public_site_audit"
          grep -Fq 'leader-public-header-guard-v1' "$public_site_audit"
          grep -Fq 'index.html' "$public_site_audit"
          if grep -Fq 'после v8' "$public_site_audit"; then
            echo 'PUBLIC_SITE_AUDIT.md must preserve its dated v9 baseline wording.' >&2
            exit 1
          fi

          grep -Fq 'CRM v4 browser test report' "$browser_report"
          grep -Fq 'Итог: прошло / прошло с замечаниями / не прошло' "$browser_report"
          grep -Fq 'CRM v4 browser test' "$issue_template"
          grep -Fq 'request_id' "$issue_template"

          ! grep -Fq '### Шаг 3. Добавить серверный аудит публичных заявок' "$next_steps"
