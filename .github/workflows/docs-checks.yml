name: Docs checks

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/check_docs_contract.py'
      - 'tools/check_current_public_ops_docs.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/check_docs_contract.py'
      - 'tools/check_current_public_ops_docs.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/docs-checks.yml'

jobs:
  validate-project-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_docs_contract.py
