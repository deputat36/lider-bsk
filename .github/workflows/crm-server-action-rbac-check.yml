name: CRM server action RBAC check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/CRM_SERVER_ACTION_RBAC_SPEC_2026-07-10.md'
      - 'docs/CRM_EDGE_EMPTY_UPDATE_GUARD_2026-07-15.md'
      - 'docs/CRM_ORDERS_CANONICAL_ROLE_GUARD_2026-07-16.md'
      - 'docs/CRM_ORDERS_MANAGER_FIELD_PERMISSIONS_2026-07-16.md'
      - 'docs/CRM_ORDERS_RESTRICT_GENERIC_ROLES_2026-07-16.md'
      - 'docs/CRM_LEADS_RESTRICT_GENERIC_ROLES_2026-07-16.md'
      - 'docs/CRM_LEADS_ACTION_PERMISSION_REGISTRY_2026-07-16.md'
      - 'docs/CRM_OFFER_ORDER_SAFE_RESPONSE_PROJECTION_2026-07-16.md'
      - 'docs/CRM_LEADS_ORDER_LIST_ROLE_PROJECTIONS_2026-07-16.md'
      - 'tools/check_crm_server_action_rbac_spec.py'
      - 'tools/check_crm_edge_empty_update_guard.py'
      - 'tools/check_crm_orders_canonical_role_guard.py'
      - 'tools/check_crm_orders_manager_field_permissions.py'
      - 'tools/check_crm_orders_restrict_generic_roles.py'
      - 'tools/check_crm_leads_restrict_generic_roles.py'
      - 'tools/check_crm_leads_action_permissions.py'
      - 'tools/check_crm_offer_order_safe_projection.py'
      - 'tools/check_crm_leads_order_list_projections.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/offer-order-create-v1.js'
      - 'supabase/functions/leader-crm-leads/index.ts'
      - 'supabase/functions/leader-crm-orders/index.ts'
      - 'supabase/migrations/20260626_06_leader_order_from_offer_rpc.sql'
      - '.github/workflows/crm-server-action-rbac-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/CRM_SERVER_ACTION_RBAC_SPEC_2026-07-10.md'
      - 'docs/CRM_EDGE_EMPTY_UPDATE_GUARD_2026-07-15.md'
      - 'docs/CRM_ORDERS_CANONICAL_ROLE_GUARD_2026-07-16.md'
      - 'docs/CRM_ORDERS_MANAGER_FIELD_PERMISSIONS_2026-07-16.md'
      - 'docs/CRM_ORDERS_RESTRICT_GENERIC_ROLES_2026-07-16.md'
      - 'docs/CRM_LEADS_RESTRICT_GENERIC_ROLES_2026-07-16.md'
      - 'docs/CRM_LEADS_ACTION_PERMISSION_REGISTRY_2026-07-16.md'
      - 'docs/CRM_OFFER_ORDER_SAFE_RESPONSE_PROJECTION_2026-07-16.md'
      - 'docs/CRM_LEADS_ORDER_LIST_ROLE_PROJECTIONS_2026-07-16.md'
      - 'tools/check_crm_server_action_rbac_spec.py'
      - 'tools/check_crm_edge_empty_update_guard.py'
      - 'tools/check_crm_orders_canonical_role_guard.py'
      - 'tools/check_crm_orders_manager_field_permissions.py'
      - 'tools/check_crm_orders_restrict_generic_roles.py'
      - 'tools/check_crm_leads_restrict_generic_roles.py'
      - 'tools/check_crm_leads_action_permissions.py'
      - 'tools/check_crm_offer_order_safe_projection.py'
      - 'tools/check_crm_leads_order_list_projections.py'
      - 'crm/v4/assets/v4/action-permissions-v1.js'
      - 'crm/v4/assets/v4/offer-order-create-v1.js'
      - 'supabase/functions/leader-crm-leads/index.ts'
      - 'supabase/functions/leader-crm-orders/index.ts'
      - 'supabase/migrations/20260626_06_leader_order_from_offer_rpc.sql'
      - '.github/workflows/crm-server-action-rbac-check.yml'

jobs:
  validate-server-action-rbac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source quietly
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Validate Edge action coverage and role contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_crm_server_action_rbac_spec.py
          python3 tools/check_crm_edge_empty_update_guard.py
          python3 tools/check_crm_orders_canonical_role_guard.py
          python3 tools/check_crm_orders_manager_field_permissions.py
          python3 tools/check_crm_orders_restrict_generic_roles.py
          python3 tools/check_crm_leads_restrict_generic_roles.py
          python3 tools/check_crm_leads_action_permissions.py
          python3 tools/check_crm_offer_order_safe_projection.py
          python3 tools/check_crm_leads_order_list_projections.py
