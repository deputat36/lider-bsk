name: Apply catalog id patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-catalog-id-patch-temp.yml'
      - 'tools/check_calculations_catalog_id.py'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'fix/calculations-catalog-id-2026-07-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculations-catalog-id-2026-07-10

      - name: Apply guarded catalog id line edit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crm/v4/assets/v4/calculations.js')
          text = path.read_text(encoding='utf-8')
          old = "  return {\n    category: raw.category || 'Расчёт по позиции',"
          new = "  return {\n    catalog_id: raw.catalog_id || null,\n    category: raw.category || 'Расчёт по позиции',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one calcItem marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'catalog_id: raw.catalog_id || null' crm/v4/assets/v4/calculations.js
          node --check crm/v4/assets/v4/calculations.js
          python3 tools/check_calculations_catalog_id.py
          git diff --check

      - name: Commit patched calculation source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/calculations.js
          git commit -m 'Preserve catalog id in calculation items'
          git push origin HEAD:fix/calculations-catalog-id-2026-07-10
