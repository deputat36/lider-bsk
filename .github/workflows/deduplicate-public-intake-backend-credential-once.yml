name: Deduplicate public intake backend credential once

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/deduplicate_public_intake_backend_credential_once.py'
      - 'tools/run-deduplicate-public-intake-backend-credential-once.txt'
      - '.github/workflows/deduplicate-public-intake-backend-credential-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/public-intake-service-role-candidate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize helper to one copy
        run: |
          set -euo pipefail
          python3 tools/deduplicate_public_intake_backend_credential_once.py
      - name: Commit normalized source
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/leader-public-lead/index.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/leader-public-lead/index.ts
          git commit -m 'Оставить один backend credential helper в public intake'
          git push origin HEAD:${{ github.head_ref }}
