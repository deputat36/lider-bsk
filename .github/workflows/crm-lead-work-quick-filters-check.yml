name: CRM lead work quick filters check

on:
  pull_request:
    paths:
      - 'crm/v4/assets/v4/lead-work-quick-filters-v1.js'
      - 'crm/v4/assets/v4/lead-work-quick-filters-ui-v1.js'
      - 'crm/v4/assets/v4/lead-work-quick-filters-v1.css'
      - 'crm/v4/assets/v4/lead-analytics-badges-v1.js'
      - 'tools/test_lead_work_quick_filters.mjs'
      - 'tools/check_crm_lead_work_quick_filters.py'
      - 'contracts/crm-lead-work-quick-filters-v1.json'
      - 'docs/CRM_LEAD_WORK_QUICK_FILTERS_V1_2026-07-23.md'
      - '.github/workflows/crm-lead-work-quick-filters-check.yml'
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/lead-work-quick-filters-v1.js'
      - 'crm/v4/assets/v4/lead-work-quick-filters-ui-v1.js'
      - 'crm/v4/assets/v4/lead-work-quick-filters-v1.css'
      - 'crm/v4/assets/v4/lead-analytics-badges-v1.js'
      - 'tools/test_lead_work_quick_filters.mjs'
      - 'tools/check_crm_lead_work_quick_filters.py'
      - 'contracts/crm-lead-work-quick-filters-v1.json'
      - 'docs/CRM_LEAD_WORK_QUICK_FILTERS_V1_2026-07-23.md'
      - '.github/workflows/crm-lead-work-quick-filters-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check crm/v4/assets/v4/lead-work-quick-filters-v1.js
          node --check crm/v4/assets/v4/lead-work-quick-filters-ui-v1.js
          node --check tools/test_lead_work_quick_filters.mjs
      - name: Run quick filter model tests
        run: node tools/test_lead_work_quick_filters.mjs
      - name: Compile contract checker
        run: python3 -m py_compile tools/check_crm_lead_work_quick_filters.py
      - name: Validate read-only filter contract
        run: python3 tools/check_crm_lead_work_quick_filters.py
