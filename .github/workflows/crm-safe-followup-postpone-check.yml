name: CRM safe followup postpone check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/followup-schedule-model-v1.js'
      - 'crm/v4/assets/v4/followups.js'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/lead-status-ui-model-v1.js'
      - 'crm/v4/assets/v4/lead-status-ui-registry-v1.js'
      - 'crm/v4/assets/v4/lead-analytics-badges-v1.js'
      - 'crm/v4/assets/v4/lead-list-preferences-v1.js'
      - 'crm/v4/index.html'
      - 'tools/test_crm_followup_schedule.mjs'
      - 'tools/check_crm_safe_followup_postpone.py'
      - 'tools/check_crm_loading_integrity.py'
      - 'tools/check_crm_lead_status_ui_registry.py'
      - 'tools/check_crm_lead_self_assignment.py'
      - 'docs/CRM_SAFE_FOLLOWUP_POSTPONE_MANUAL_TEST_2026-07-21.md'
      - 'docs/CRM_SAFE_FOLLOWUP_POSTPONE_STAGING_2026-07-21.md'
      - '.github/workflows/crm-safe-followup-postpone-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/followup-schedule-model-v1.js'
      - 'crm/v4/assets/v4/followups.js'
      - 'crm/v4/assets/v4/leads.js'
      - 'crm/v4/assets/v4/lead-status-ui-model-v1.js'
      - 'crm/v4/assets/v4/lead-status-ui-registry-v1.js'
      - 'crm/v4/assets/v4/lead-analytics-badges-v1.js'
      - 'crm/v4/assets/v4/lead-list-preferences-v1.js'
      - 'crm/v4/index.html'
      - 'tools/test_crm_followup_schedule.mjs'
      - 'tools/check_crm_safe_followup_postpone.py'
      - 'tools/check_crm_loading_integrity.py'
      - 'tools/check_crm_lead_status_ui_registry.py'
      - 'tools/check_crm_lead_self_assignment.py'
      - 'docs/CRM_SAFE_FOLLOWUP_POSTPONE_MANUAL_TEST_2026-07-21.md'
      - 'docs/CRM_SAFE_FOLLOWUP_POSTPONE_STAGING_2026-07-21.md'
      - '.github/workflows/crm-safe-followup-postpone-check.yml'

jobs:
  safe-followup-postpone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check crm/v4/assets/v4/followup-schedule-model-v1.js
          node --check crm/v4/assets/v4/followups.js
          node --check crm/v4/assets/v4/leads.js
          node --check crm/v4/assets/v4/lead-status-ui-model-v1.js
          node --check crm/v4/assets/v4/lead-status-ui-registry-v1.js
          node --check crm/v4/assets/v4/lead-analytics-badges-v1.js
          node --check crm/v4/assets/v4/lead-list-preferences-v1.js
          node --check tools/test_crm_followup_schedule.mjs
      - name: Pure model tests
        run: node tools/test_crm_followup_schedule.mjs
      - name: Safe followup source contract
        run: python3 tools/check_crm_safe_followup_postpone.py
      - name: Loading integrity contract
        run: python3 tools/check_crm_loading_integrity.py
      - name: Status registry contract
        run: python3 tools/check_crm_lead_status_ui_registry.py
      - name: Assignment regression contract
        run: python3 tools/check_crm_lead_self_assignment.py
