name: Apply staging catalog client 169

on:
  push:
    branches: [agent/169-staging-catalog-e2e]
    paths:
      - 'tools/patch_staging_catalog_client_169.py'
      - '.github/workflows/apply-staging-catalog-client-169.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/169-staging-catalog-e2e
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic staging catalog patch
        run: python3 tools/patch_staging_catalog_client_169.py
      - name: Validate catalog integration
        run: |
          node --check crm/v4/assets/v4/calculations.js
          python3 tools/check_calculation_catalog_ui_mode.py
      - name: Commit generated integration
        run: |
          if git diff --quiet -- crm/v4/assets/v4/calculations.js; then
            echo 'No generated change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/v4/assets/v4/calculations.js
          git commit -m 'Use remote catalog path in staging'
          git push origin HEAD:agent/169-staging-catalog-e2e
