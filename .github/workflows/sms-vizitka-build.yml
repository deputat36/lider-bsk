name: Build SMS Vizitka Android

on:
  push:
    branches: ["sms-vizitka-archived-bootstrap-no-trigger"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          rm -rf android/build-src
          mkdir -p android/build-src
          cat android/sms-card-source/part*.b64 > /tmp/sms-card.b64
          base64 --decode /tmp/sms-card.b64 > /tmp/sms-card.zip
          echo "d6657ee943237b60f7f62f22f59707bbb948dbd50dbf7e5ec3bcdd6cde05d4bc  /tmp/sms-card.zip" | sha256sum -c -
          unzip -q /tmp/sms-card.zip -d android/build-src
          python - <<'PY'
          from pathlib import Path
          root = Path("android/build-src/sms-card-app")

          p = root / "app/src/main/java/ru/etagi/borisoglebsk/smscard/SmsComposeActivity.java"
          s = p.read_text()
          s = s.replace(
              '\n        if ((clientName == null || clientName.trim().isEmpty()) && automatic) {\n'
              '            clientName = ContactResolver.displayName(this, number);\n'
              '        }\n',
              '\n'
          )
          p.write_text(s)

          p = root / "app/src/main/java/ru/etagi/borisoglebsk/smscard/MainActivity.java"
          s = p.read_text()
          s = s.replace(
              'EditText client = edit("Имя клиента (необязательно)", InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);',
              'EditText client = edit("Обращение по имени (необязательно)", InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS);'
          )
          s = s.replace('import android.app.RoleManager;', 'import android.app.role.RoleManager;')
          p.write_text(s)

          p = root / "app/src/main/java/ru/etagi/borisoglebsk/smscard/NotificationHelper.java"
          s = p.read_text()
          s = s.replace('private static final String CHANNEL_ID = "after_call_cards";',
                        'private static final String CHANNEL_ID = "after_call_cards_popup_v2";')
          s = s.replace('"Визитка после звонка",\n                NotificationManager.IMPORTANCE_HIGH',
                        '"Визитка после звонка — всплывающее",\n                NotificationManager.IMPORTANCE_HIGH')
          s = s.replace(
              'channel.setDescription("Предложение отправить SMS-визитку после завершения разговора");\n        manager.createNotificationChannel(channel);',
              'channel.setDescription("Всплывающее предложение отправить SMS-визитку после завершения разговора");\n'
              '        channel.enableVibration(true);\n'
              '        channel.setVibrationPattern(new long[]{0, 120, 80, 120});\n'
              '        channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);\n'
              '        manager.createNotificationChannel(channel);'
          )
          s = s.replace('.setContentIntent(openPi)', '.setContentIntent(sendPi)')
          s = s.replace('"Отправить", sendPi', '"Отправить SMS", sendPi')
          s = s.replace(
              '.setAutoCancel(true)\n                .setCategory(Notification.CATEGORY_REMINDER)',
              '.setAutoCancel(true)\n'
              '                .setPriority(Notification.PRIORITY_MAX)\n'
              '                .setDefaults(Notification.DEFAULT_ALL)\n'
              '                .setVisibility(Notification.VISIBILITY_PUBLIC)\n'
              '                .setCategory(Notification.CATEGORY_REMINDER)'
          )
          p.write_text(s)

          p = root / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace('versionCode = 2', 'versionCode = 3')
          s = s.replace('versionName = "0.2.0"', 'versionName = "0.2.2"')
          p.write_text(s)
          PY

          cp android/sms-card-v030/SmsTemplates.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/SmsTemplates.java
          python android/sms-card-v030/v030_patch.py

          cp android/sms-card-v040/NotificationHelper.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/NotificationHelper.java
          cp android/sms-card-v040/SmsLength.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/SmsLength.java
          cp android/sms-card-v040/DeviceDiagnostics.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/DeviceDiagnostics.java
          cp android/sms-card-v040/ConfigBackup.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/ConfigBackup.java
          cp android/sms-card-v040/README.md android/build-src/sms-card-app/README.md
          python android/sms-card-v040/v040_patch.py
          rm -f android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/ContactResolver.java

          cp android/sms-card-v050/PhoneNormalizer.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/PhoneNormalizer.java
          cp android/sms-card-v050/ContactRepository.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/ContactRepository.java
          cp android/sms-card-v050/BulkCampaignStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/BulkCampaignStore.java
          cp android/sms-card-v050/BulkCampaignActivity.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/BulkCampaignActivity.java
          cp android/sms-card-v050/README.md android/build-src/sms-card-app/README.md
          python android/sms-card-v050/v050_patch.py

          cp android/sms-card-v051/PhoneNormalizer.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/PhoneNormalizer.java
          cp android/sms-card-v051/ContactRepository.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/ContactRepository.java
          cp android/sms-card-v051/BulkCampaignStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/BulkCampaignStore.java
          cp android/sms-card-v051/CallSessionStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/CallSessionStore.java
          cp android/sms-card-v051/DeviceDiagnostics.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/DeviceDiagnostics.java
          cp android/sms-card-v051/DismissNotificationReceiver.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/DismissNotificationReceiver.java
          cp android/sms-card-v051/NotificationHelper.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/NotificationHelper.java
          cp android/sms-card-v051/RecipientPolicyStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/RecipientPolicyStore.java

          mkdir -p android/build-src/sms-card-app/app/src/main/res/xml
          cp android/sms-card-v051/backup_rules.xml android/build-src/sms-card-app/app/src/main/res/xml/backup_rules.xml
          cp android/sms-card-v051/data_extraction_rules.xml android/build-src/sms-card-app/app/src/main/res/xml/data_extraction_rules.xml

          mkdir -p android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard
          cp android/sms-card-v051/PhoneNormalizerTest.java android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard/PhoneNormalizerTest.java
          cp android/sms-card-v051/CallSessionStoreTest.java android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard/CallSessionStoreTest.java

          python android/sms-card-v051/v051_core_patch.py
          python android/sms-card-v051/v051_bulk_patch.py
          cp android/sms-card-v051/README.md android/build-src/sms-card-app/README.md

          python android/sms-card-v052/v052_core_patch.py
          python android/sms-card-v052/v052_bulk_patch.py
          python android/sms-card-v052/v052_ui_patch.py

          cp android/sms-card-v052/BugfixSafetyTest.java android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard/BugfixSafetyTest.java
          cp android/sms-card-v052/README.md android/build-src/sms-card-app/README.md

          cp android/sms-card-v060/SmsDatabase.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/SmsDatabase.java
          cp android/sms-card-v060/SqliteStores.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/SqliteStores.java
          cp android/sms-card-v060/HistoryStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/HistoryStore.java
          cp android/sms-card-v060/RecipientPolicyStore.java android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/RecipientPolicyStore.java
          cp android/sms-card-v060/CampaignQueueTest.java android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard/CampaignQueueTest.java
          python android/sms-card-v060/v060_patch.py
          python android/sms-card-v060/v060_ui_patch.py
          python android/sms-card-v060/v060_perf_patch.py
          cp android/sms-card-v060/README.md android/build-src/sms-card-app/README.md

          python android/sms-card-v061/v061_sms_address_fix.py
          cp android/sms-card-v061/SmsRecipientFormatTest.java android/build-src/sms-card-app/app/src/test/java/ru/etagi/borisoglebsk/smscard/SmsRecipientFormatTest.java
          cp android/sms-card-v061/README.md android/build-src/sms-card-app/README.md
          grep -q 'String smsRecipient = PhoneNormalizer.toSmsRecipient(normalized)' android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/SmsComposeActivity.java
          grep -q 'String smsRecipient = PhoneNormalizer.toSmsRecipient(recipient.phone)' android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/BulkCampaignActivity.java

          grep -q 'versionName = "0.6.1"' android/build-src/sms-card-app/app/build.gradle.kts
          grep -q 'SqliteStores' android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/HistoryStore.java
          grep -q 'android:allowBackup="false"' android/build-src/sms-card-app/app/src/main/AndroidManifest.xml
          grep -q 'after_call_cards_popup_v3' android/build-src/sms-card-app/app/src/main/java/ru/etagi/borisoglebsk/smscard/NotificationHelper.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Check SQLite schema
        shell: bash
        run: python android/sms-card-v060/sqlite_schema_smoke.py

      - name: Prepare complete source archive
        shell: bash
        run: |
          cd android/build-src/sms-card-app
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          cd ..
          zip -qr ../../sms-card-etagi-v0.6.1-source.zip sms-card-app -x 'sms-card-app/.gradle/*' 'sms-card-app/build/*' 'sms-card-app/app/build/*'
          cd ../..
          sha256sum sms-card-etagi-v0.6.1-source.zip

      - name: Test, lint and build APKs
        working-directory: android/build-src/sms-card-app
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace
          echo "===== LINT TEXT REPORT ====="
          cat app/build/reports/lint-results-debug.txt || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-vizitka-v0.6.1-debug
          path: android/build-src/sms-card-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sign release APK when protected secrets are configured
        env:
          SMS_SIGNING_KEYSTORE_B64: ${{ secrets.SMS_SIGNING_KEYSTORE_B64 }}
          SMS_SIGNING_STORE_PASSWORD: ${{ secrets.SMS_SIGNING_STORE_PASSWORD }}
          SMS_SIGNING_KEY_PASSWORD: ${{ secrets.SMS_SIGNING_KEY_PASSWORD }}
          SMS_SIGNING_ALIAS: ${{ secrets.SMS_SIGNING_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SMS_SIGNING_KEYSTORE_B64" || -z "$SMS_SIGNING_STORE_PASSWORD" || -z "$SMS_SIGNING_KEY_PASSWORD" || -z "$SMS_SIGNING_ALIAS" ]]; then
            echo "Signing secrets not configured: signed Release artifact will be skipped."
            exit 0
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s' "$SMS_SIGNING_KEYSTORE_B64" | base64 -d > "$work/release.jks"
          tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          align="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name zipalign -type f | sort -V | tail -n 1)"
          [[ -x "$tools" && -x "$align" ]]
          "$align" -f -p 4 android/build-src/sms-card-app/app/build/outputs/apk/release/app-release-unsigned.apk "$work/aligned.apk"
          "$tools" sign --ks "$work/release.jks" --ks-key-alias "$SMS_SIGNING_ALIAS" --ks-pass env:SMS_SIGNING_STORE_PASSWORD --key-pass env:SMS_SIGNING_KEY_PASSWORD --out android/build-src/sms-card-app/app/build/outputs/apk/release/app-release-signed.apk "$work/aligned.apk"
          "$tools" verify --verbose android/build-src/sms-card-app/app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-vizitka-v0.6.1-release-signed
          path: android/build-src/sms-card-app/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: ignore

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-vizitka-v0.6.1-release-unsigned
          path: android/build-src/sms-card-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: sms-vizitka-v0.6.1-source
          path: sms-card-etagi-v0.6.1-source.zip
          if-no-files-found: error
