name: Public business card builder assets check

on:
  pull_request:
    branches: [main]
    paths:
      - 'vizitki-borisoglebsk.html'
      - 'assets/public-business-card-builder.css'
      - 'assets/public-business-card-builder.js'
      - 'tools/check_public_business_card_builder_assets.py'
      - '.github/workflows/public-business-card-builder-assets-check.yml'
  push:
    branches: [main]
    paths:
      - 'vizitki-borisoglebsk.html'
      - 'assets/public-business-card-builder.css'
      - 'assets/public-business-card-builder.js'
      - 'tools/check_public_business_card_builder_assets.py'
      - '.github/workflows/public-business-card-builder-assets-check.yml'

permissions:
  contents: read

jobs:
  check-business-card-builder-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, CSS and builder behavior
        run: python3 tools/check_public_business_card_builder_assets.py
      - name: Validate JavaScript syntax
        run: node --check assets/public-business-card-builder.js
