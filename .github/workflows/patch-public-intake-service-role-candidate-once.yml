name: Patch public intake service-role candidate once

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/patch_public_intake_service_role_candidate_once.py'
      - 'tools/run-patch-public-intake-service-role-candidate-once.txt'
      - '.github/workflows/patch-public-intake-service-role-candidate-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/public-intake-service-role-candidate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply protected intake source patch
        run: |
          set -euo pipefail
          python3 tools/patch_public_intake_service_role_candidate_once.py
      - name: Commit source candidate
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/leader-public-lead/index.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/leader-public-lead/index.ts
          git commit -m 'Перевести public intake source на backend credential'
          git push origin HEAD:${{ github.head_ref }}
