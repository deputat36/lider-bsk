name: CRM need readiness check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/need-readiness-model-v1.js'
      - 'crm/v4/assets/v4/need-readiness-panel-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'crm/v4/assets/v4/needs.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'tools/test_need_readiness.mjs'
      - 'tools/check_need_readiness_warning.py'
      - 'docs/CRM_NEED_READINESS_WARNING_MANUAL_TEST_2026-07-13.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-need-readiness-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/need-readiness-model-v1.js'
      - 'crm/v4/assets/v4/need-readiness-panel-v1.js'
      - 'crm/v4/assets/v4/site-cache-note-v1.js'
      - 'crm/v4/assets/v4/needs.js'
      - 'crm/v4/assets/v4/calculations.js'
      - 'crm/v4/assets/v4/offers.js'
      - 'tools/test_need_readiness.mjs'
      - 'tools/check_need_readiness_warning.py'
      - 'docs/CRM_NEED_READINESS_WARNING_MANUAL_TEST_2026-07-13.md'
      - 'docs/STATUS.md'
      - '.github/workflows/crm-need-readiness-check.yml'

jobs:
  need-readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate advisory readiness model and UI
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/v4/assets/v4/need-readiness-model-v1.js
          node --check crm/v4/assets/v4/need-readiness-panel-v1.js
          node --check crm/v4/assets/v4/site-cache-note-v1.js
          node --check tools/test_need_readiness.mjs
          node tools/test_need_readiness.mjs
          python3 tools/check_need_readiness_warning.py
