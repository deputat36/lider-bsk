name: CRM catalog management check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/catalog-management-model-v1.js'
      - 'crm/v4/assets/v4/catalog-management-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-expanded-menu-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tabs-lite.js'
      - 'crm/v4/assets/v4/crm-navigation-route-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'tools/test_catalog_management_model_v1.mjs'
      - 'tools/check_catalog_management_v1.py'
      - 'tools/check_crm_lazy_tab_loader.py'
      - '.github/workflows/crm-catalog-management-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/catalog-management-model-v1.js'
      - 'crm/v4/assets/v4/catalog-management-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-expanded-menu-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tabs-lite.js'
      - 'crm/v4/assets/v4/crm-navigation-route-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'tools/test_catalog_management_model_v1.mjs'
      - 'tools/check_catalog_management_v1.py'
      - 'tools/check_crm_lazy_tab_loader.py'
      - '.github/workflows/crm-catalog-management-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-management:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check crm/v4/assets/v4/catalog-management-model-v1.js
          node --check crm/v4/assets/v4/catalog-management-v1.js
          node --check crm/v4/assets/v4/role-tab-permissions-v1.js
          node --check crm/v4/assets/v4/crm-v4-expanded-menu-v1.js
          node --check crm/v4/assets/v4/crm-v4-tabs-lite.js
          node --check crm/v4/assets/v4/crm-navigation-route-v1.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
      - name: Catalog management model tests
        run: node tools/test_catalog_management_model_v1.mjs
      - name: Catalog management source contract
        run: python3 tools/check_catalog_management_v1.py
      - name: Lazy loader regression contract
        run: python3 tools/check_crm_lazy_tab_loader.py
