name: CRM catalog management check

on:
  push:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/catalog-management-model-v1.js'
      - 'crm/v4/assets/v4/catalog-management-v1.js'
      - 'crm/v4/assets/v4/catalog-management-staging-transport-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-expanded-menu-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tabs-lite.js'
      - 'crm/v4/assets/v4/crm-navigation-route-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'contracts/crm-installation-production-frontend-candidate-v1.json'
      - 'supabase/functions/leader-crm-catalog/**'
      - 'supabase/staging-migrations/20260904_02_catalog_management_write_harness.sql'
      - 'supabase/staging-tests/20260904_catalog_management_write_acceptance.sql'
      - 'tools/test_catalog_management_model_v1.mjs'
      - 'tools/test_catalog_management_staging_transport_v1.mjs'
      - 'tools/test_crm_navigation_route.mjs'
      - 'tools/check_catalog_management_v1.py'
      - 'tools/check_catalog_management_write_staging_v1.py'
      - 'tools/check_crm_lazy_tab_loader.py'
      - 'tools/generate_crm_installation_production_frontend_candidate.py'
      - 'tools/check_crm_installation_production_frontend_candidate.py'
      - '.github/workflows/crm-catalog-management-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crm/v4/assets/v4/catalog-management-model-v1.js'
      - 'crm/v4/assets/v4/catalog-management-v1.js'
      - 'crm/v4/assets/v4/catalog-management-staging-transport-v1.js'
      - 'crm/v4/assets/v4/role-tab-permissions-v1.js'
      - 'crm/v4/assets/v4/crm-v4-expanded-menu-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tabs-lite.js'
      - 'crm/v4/assets/v4/crm-navigation-route-v1.js'
      - 'crm/v4/assets/v4/crm-v4-tab-loader-v1.js'
      - 'contracts/crm-installation-production-frontend-candidate-v1.json'
      - 'supabase/functions/leader-crm-catalog/**'
      - 'supabase/staging-migrations/20260904_02_catalog_management_write_harness.sql'
      - 'supabase/staging-tests/20260904_catalog_management_write_acceptance.sql'
      - 'tools/test_catalog_management_model_v1.mjs'
      - 'tools/test_catalog_management_staging_transport_v1.mjs'
      - 'tools/test_crm_navigation_route.mjs'
      - 'tools/check_catalog_management_v1.py'
      - 'tools/check_catalog_management_write_staging_v1.py'
      - 'tools/check_crm_lazy_tab_loader.py'
      - 'tools/generate_crm_installation_production_frontend_candidate.py'
      - 'tools/check_crm_installation_production_frontend_candidate.py'
      - '.github/workflows/crm-catalog-management-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-management:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Syntax checks
        run: |
          node --check crm/v4/assets/v4/catalog-management-model-v1.js
          node --check crm/v4/assets/v4/catalog-management-v1.js
          node --check crm/v4/assets/v4/catalog-management-staging-transport-v1.js
          node --check crm/v4/assets/v4/role-tab-permissions-v1.js
          node --check crm/v4/assets/v4/crm-v4-expanded-menu-v1.js
          node --check crm/v4/assets/v4/crm-v4-tabs-lite.js
          node --check crm/v4/assets/v4/crm-navigation-route-v1.js
          node --check crm/v4/assets/v4/crm-v4-tab-loader-v1.js
      - name: Type-check catalog Edge
        run: deno check supabase/functions/leader-crm-catalog/index.ts
      - name: Catalog management model tests
        run: node tools/test_catalog_management_model_v1.mjs
      - name: Catalog staging transport tests
        run: node tools/test_catalog_management_staging_transport_v1.mjs
      - name: Catalog navigation regression
        run: node tools/test_crm_navigation_route.mjs
      - name: Catalog management source contract
        run: python3 tools/check_catalog_management_v1.py
      - name: Catalog staging write source contract
        run: python3 tools/check_catalog_management_write_staging_v1.py
      - name: Lazy loader regression contract
        run: python3 tools/check_crm_lazy_tab_loader.py
      - name: Installation candidate loader pin regression
        run: |
          python3 -m py_compile tools/generate_crm_installation_production_frontend_candidate.py
          python3 tools/generate_crm_installation_production_frontend_candidate.py
          python3 tools/check_crm_installation_production_frontend_candidate.py
