  <style>body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111827;line-height:1.55}.wrap{width:min(100% - 32px,1120px);margin:auto}.hero{background:#111827;color:#fff;padding:62px 0}.section{padding:54px 0}.soft{background:#f6f7f8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid #e5e7eb;border-radius:24px;background:#fff;padding:22px}.calc{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:900;margin:0 0 6px}.field select{width:100%;min-height:44px;border:1px solid #d0d5dd;border-radius:14px;padding:10px}.full{grid-column:1/-1}.summary{white-space:pre-line;background:#111827;color:#fff;border-radius:22px;padding:20px;min-height:210px}.btn{border:0;border-radius:999px;padding:12px 18px;background:#ff6a00;color:#fff;font-weight:900;cursor:pointer}.cta{background:#111827;color:#fff;border-radius:30px;padding:30px;display:grid;grid-template-columns:.85fr 1.15fr;gap:24px}@media(max-width:900px){.grid,.calc,.cta{grid-template-columns:1fr}.full{grid-column:auto}}</style>

<body>
<header class="hero"><div class="wrap"><a href="uslugi.html" style="color:#fff">← Все услуги</a><h1>Визитки в Борисоглебске</h1><p>Выберите параметры визиток. Цена на странице не показывается: заявка уйдет с готовым описанием заказа.</p></div></header>
<main>
<section class="section soft"><div class="wrap"><h2>Конструктор заказа визиток</h2><div class="grid"><div class="card"><div class="calc" id="card-calc">
<div class="field"><label>Вид визиток</label><select data-calc="kind"><option>Стандартные</option><option>Квадратные</option><option>Складные</option></select></div>
<div class="field"><label>Формат</label><select data-calc="format"><option>90 × 50 мм</option><option>85 × 55 мм</option><option>Другой формат</option></select></div>
<div class="field"><label>Стороны печати</label><select data-calc="sides"><option>Одна сторона</option><option>Две стороны</option></select></div>
<div class="field"><label>Тираж</label><select data-calc="qty"><option>100 шт.</option><option>200 шт.</option><option>300 шт.</option><option>500 шт.</option><option>Другой тираж</option></select></div>
<div class="field"><label>Бумага</label><select data-calc="paper"><option>Картон мелованный 300 г/м²</option><option>Матовая бумага / картон</option><option>Дизайнерская бумага</option><option>Нужно подобрать</option></select></div>
<div class="field"><label>Ламинация</label><select data-calc="lamination"><option>Без ламинации</option><option>Ламинация двухсторонняя</option><option>Нужно обсудить</option></select></div>
<div class="field"><label>Скругление углов</label><select data-calc="corners"><option>Не нужно</option><option>Нужно</option></select></div>
<div class="field full"><label>Макет / дизайн</label><select data-calc="design"><option>Макет готов</option><option>Нужен дизайн с нуля</option><option>Есть пример, нужно доработать</option><option>Нужна проверка макета</option></select></div>
</div></div><div class="card"><h3>Итоговое описание</h3><div class="summary" id="card-summary"></div><p><button class="btn" id="send-card-summary" type="button">Перенести в заявку</button></p></div></div></div></section>
<section id="request" class="section"><div class="wrap"><div class="cta"><div><h2>Рассчитать визитки</h2><p>Заполните параметры выше или просто оставьте телефон.</p><p><a href="tel:+79802457471" style="color:#fff">8 980 245-74-71</a></p></div><div id="leader-lead-form" data-leader-lead-form></div></div></div></section>
</main>
<script src="assets/public-lead-form.js?v=5"></script>
<script src="assets/public-related-services.js?v=1"></script>
<script>document.addEventListener('DOMContentLoaded',function(){var box=document.getElementById('card-calc');var summary=document.getElementById('card-summary');function val(name){var el=box&&box.querySelector('[data-calc="'+name+'"]');return el?el.value:''}function text(){return 'Заказ: визитки\nВид: '+val('kind')+'\nФормат: '+val('format')+'\nСтороны печати: '+val('sides')+'\nТираж: '+val('qty')+'\nБумага: '+val('paper')+'\nЛаминация: '+val('lamination')+'\nСкругление углов: '+val('corners')+'\nМакет / дизайн: '+val('design')}function update(){if(summary)summary.textContent=text()}function ensureOption(select,value){if(!select)return;for(var i=0;i<select.options.length;i++){if(select.options[i].value===value)return;}select.add(new Option(value,value));}if(box){box.addEventListener('change',update);update()}var btn=document.getElementById('send-card-summary');if(btn)btn.addEventListener('click',function(){var msg=document.querySelector('[name="message"]');var service=document.querySelector('[name="service"]');if(service){ensureOption(service,'Визитки');service.value='Визитки';}if(msg)msg.value=text();document.getElementById('request').scrollIntoView({behavior:'smooth'});});});</script>
</body>
